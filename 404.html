<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#242220">
<title>Page not found — ClassDrop</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/montserrat-400.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:800;font-display:swap;src:url(/fonts/montserrat-800.woff2) format('woff2')}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#242220;color:#fff;font-family:Montserrat,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center}
main{max-width:520px}
.mark{width:64px;height:64px;margin:0 auto 22px;display:block}
p.code{color:#c99a4a;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.8rem;margin:0 0 10px}
h1{font-size:2rem;font-weight:800;margin:0 0 12px;line-height:1.15}
p{color:#d9d2c4;line-height:1.55;margin:0 0 24px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-block;padding:12px 20px;border-radius:12px;font-weight:800;text-decoration:none;background:#ae853e;color:#1a1815}
a.btn.ghost{background:transparent;color:#fff;border:1.5px solid #5a5449}
a.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<main>
  <img class="mark" src="/favicon.svg" alt="">
  <p class="code">404</p>
  <h1>That page isn't in the tray.</h1>
  <p>The link may be old, or it may have been mistyped. Nothing has been lost — everything you've saved in ClassDrop stays on the device it was saved on.</p>
  <div class="btns">
    <a class="btn" href="/app/">Open ClassDrop</a>
    <a class="btn ghost" href="/">About ClassDrop</a>
  </div>
</main>
</body>
</html>
