/* ---------- safeguarding / moderation ---------- */
const PROFANITY = ['stupid', 'idiot', 'dumb', 'shut up', 'loser', 'hate you', 'ugly', 'moron'];
const profanityRe = new RegExp('\\b(' + PROFANITY.map(w => w.replace(/ /g, '\\s+')).join('|') + ')\\b', 'i');
const profanityHit = t => profanityRe.test(String(t || ''));
const moderates = c => !!(c && c.moderate);
/* stamp a NEW student-authored, peer-visible post — hold it if the class moderates or language is flagged */
function modStamp(c, text) {
  if (!isStudent()) return {};
  const prof = profanityHit(text);
  const o = {};
  if (moderates(c) || prof) o.pending = true;
  if (prof) { o.flagged = true; o.flagReason = 'Held automatically — please check the language'; }
  return o;
}
/* should the current viewer NOT see this held post? teachers + the author always can */
function hiddenFromViewer(o) {
  if (!o.pending) return false;
  if (isTeacher()) return false;
  return o.authorId !== db.session;
}
function modLogAdd(action, detail) {
  db.modLog.unshift({ id: uid(), by: db.session, action, detail, ts: Date.now() });
  db.modLog = db.modLog.slice(0, 300);
}
function pendingBanner(o, onApprove, onReject) {
  if (!o.pending) return '';
  if (isTeacher()) {
    return `<div class="${o.flagged ? 'flagged' : 'pending-flag'}">${ic('i-shield')} ${o.flagged ? esc(o.flagReason || 'Flagged') : 'Waiting for you to approve'}
      <span class="spacer"></span>
      <button class="btn small" data-modok>${ic('i-tick')} Approve</button>
      <button class="btn ghost small" data-modno>${ic('i-x')} Remove</button></div>`;
  }
  return `<div class="pending-flag">${ic('i-shield')} Waiting for your teacher to approve this</div>`;
}

/* ---------- view state ---------- */
let view = { page: 'dash', classId: null, tab: 'tasks', assignmentId: null, studentId: null, discussionId: null };
function go(patch) {
  const next = Object.assign({}, view, patch);
  const changed = JSON.stringify(next) !== JSON.stringify(view);
  view = next; render();
  if (changed) history.pushState({ view }, '');
}

/* browser back/forward: close any open layer first, otherwise restore that entry's view */
window.addEventListener('popstate', e => {
  const drawerScrim = document.querySelector('.scrim');
  if (drawerScrim) { drawerScrim.click(); history.pushState({ view }, ''); return; }
  const layer = document.querySelector('.modal-scrim, .zoom-scrim, .tt-wrap, .rp-wrap, .sgp-wrap, .sp-wrap');
  if (layer) { layer.remove(); history.pushState({ view }, ''); return; }
  if (document.querySelector('.cv-wrap')) { history.pushState({ view }, ''); return; } // canvas editor may hold unsaved work — leave via its own controls
  if (e.state && e.state.view) { view = Object.assign({}, e.state.view); render(); }
});

  if (view.page === 'folder') renderFolder(main);
  else if (view.page === 'assignment') renderAssignment(main);
  else if (view.page === 'discussion' && feat('discussions')) renderDiscussionThread(main);
  else if (view.page === 'class') renderClass(main);
  else if (view.page === 'activity') renderActivity(main);
  else if ((view.page === 'tools' || view.page === 'library') && isTeacher()) renderTools(main);
  else if (view.page === 'timetable' && isTeacher() && feat('timetables')) renderTimetableEditor(main);
  else if (view.page === 'seating' && isTeacher() && feat('seating')) renderSeating(main);
  else if (view.page === 'safeguarding' && (isTeacher() || isAdmin()) && feat('safeguarding')) renderSafeguarding(main);
  else if (view.page === 'portfolio' && feat('portfolios')) renderPortfolioPage(main);
  else if (view.page === 'reading' && feat('reading')) renderReadingPage(main);
  else if (view.page === 'tables' && (isStudent() || isParent()) && feat('tables')) renderTables(main);
  else if (view.page === 'staff' && isAdmin()) renderAdminStaff(main);
  else if (view.page === 'pupils' && isAdmin()) renderAdminStudents(main);
  else if (view.page === 'aclasses' && isAdmin()) renderAdminClasses(main);
  else if (view.page === 'afeatures' && isAdmin()) renderAdminFeatures(main);
  else if (view.page === 'ascales' && isAdmin() && feat('markbook')) renderAdminScales(main);
  else if (view.page === 'areports' && isAdmin() && feat('reports')) renderAdminReports(main);
  else if (view.page === 'rbuild' && isAdmin() && feat('reports')) renderReportBuilder(main);
  else renderDash(main);
}

/* ---------- dashboard ---------- */
function renderDash(main) {
  const u = me(), classes = myClasses();
  if (isAdmin()) { renderAdminDash(main); return; }
  if (isTeacher()) {
    const myAssigns = db.assignments.filter(a => classes.some(c => c.id === a.classId) && !a.archived);
    const toReview = myAssigns.reduce((n, a) => n + toReviewCount(a.id), 0);
    const students = new Set(classes.flatMap(c => c.students)).size;
    const reviewRows = myAssigns
      .map(a => ({ a, n: toReviewCount(a.id) }))
      .filter(x => x.n > 0)
      .map(x => `
        <button class="assign-row" data-open-assign="${x.a.id}">
          <span class="assign-ico">${ic('i-inbox')}</span>
          <span class="assign-body"><b>${esc(x.a.title)}</b><small>${esc(klass(x.a.classId).name)}</small></span>
          <span class="assign-side"><span class="chip amber">${x.n} to review</span></span>
        </button>`).join('');
    main.innerHTML = `
      <div class="page-head"><h2>Hello, ${esc(u.name)} 👋</h2>
        <span class="spacer"></span>
        <button class="btn" id="btn-newclass2">${ic('i-plus')} New class</button></div>
      <div class="stat-row">
        <div class="stat"><div class="n">${classes.length}</div><div class="l">Classes</div></div>
        <div class="stat"><div class="n">${students}</div><div class="l">Students</div></div>
        <div class="stat"><div class="n">${myAssigns.length}</div><div class="l">Tasks set</div></div>
        <div class="stat ${toReview ? 'hot' : 'green'}"><div class="n">${toReview}</div><div class="l">To review</div></div>
      </div>
      ${reviewRows ? `<h3 style="margin:6px 0 12px">Waiting for your feedback</h3>${reviewRows}` : ''}
      <h3 style="margin:20px 0 12px">My classes</h3>
      ${renderClassGrid(classes)}`;
    $('#btn-newclass2').onclick = openNewClass;
  } else if (isParent()) {
    renderParentDash(main);
    return;
  } else {
    const tasks = db.assignments
      .filter(a => classes.some(c => c.id === a.classId) && !a.archived && isLive(a))
      .map(a => ({ a, h: handin(a.id, u.id) }))
      .sort((x, y) => (x.a.due || '9999') < (y.a.due || '9999') ? -1 : 1);
    const open = tasks.filter(t => t.h.status === 'none');
    const rows = tasks.map(t => taskRowHTML(t.a, u.id)).join('');
    main.innerHTML = `
      <div class="page-head"><h2>Hello, ${esc(u.name.split(' ')[0])} 👋</h2>
        <span class="spacer"></span>
        <button class="btn sec" id="btn-join2">${ic('i-key')} Join a class</button></div>
      <div class="stat-row">
        <div class="stat"><div class="n">${classes.length}</div><div class="l">Classes</div></div>
        <div class="stat ${open.length ? 'amber' : 'green'}"><div class="n">${open.length}</div><div class="l">Tasks to do</div></div>
        <div class="stat green"><div class="n">${tasks.filter(t => t.h.status !== 'none').length}</div><div class="l">Handed in</div></div>
      </div>
      ${feat('timetables') ? (tt => tt ? ttStripHTML(tt) : '')(ttForStudent(u.id)) : ''}
      ${feat('tables') ? xtDashHTML(u.id) : ''}
      <h3 style="margin:6px 0 12px">My tasks</h3>
      ${rows || `<div class="card empty">${ic('i-task', 'big')}No tasks yet — join a class to get started.</div>`}
      <h3 style="margin:20px 0 12px">My classes</h3>
      ${renderClassGrid(classes)}`;
    $('#btn-join2').onclick = openJoinClass;
    wireTaskRows(u.id);
    wireTTStrip();
    wireXtDash();
  }
  document.querySelectorAll('[data-open-assign]').forEach(b => b.onclick = () => {
    const a = assignment(b.dataset.openAssign);
    go({ page: 'assignment', classId: a.classId, assignmentId: a.id });
  });
  wireClassGrid();
}

function taskRowHTML(a, sid) {
  const g = gradeOf(a.id, sid);
  return `
  <button class="assign-row" data-open-folder="${a.id}" data-fsid="${sid}">
    <span class="assign-ico">${effLocked(a) ? ic('i-lock') : ic('i-task')}</span>
    <span class="assign-body"><b>${esc(a.title)}</b><small>${esc(klass(a.classId).name)}</small></span>
    <span class="assign-side">${g && a.outOf ? `<span class="chip green">${ic('i-grade')} ${g.score}/${a.outOf}</span>` : statusChip(a.id, sid)}${dueChip(a)}</span>
  </button>`;
}
function wireTaskRows() {
  document.querySelectorAll('[data-open-folder]').forEach(b => b.onclick = () => {
    const a = assignment(b.dataset.openFolder);
    go({ page: 'folder', classId: a.classId, assignmentId: a.id, studentId: b.dataset.fsid });
  });
}

    const owned = schoolClasses().filter(c => c.teacher === t.id);

    <div class="page-head"><h2>${ic('i-teacher')} Staff</h2><span class="spacer"></span>
      <button class="btn sec small" id="btn-addadmin">${ic('i-plus')} Add office account</button>

    <p class="page-sub">The school office runs every account. Tap the chips to give someone both hats — a teaching head or an office manager who also covers a class holds a dual role and switches between them from their sidebar. (The real, multi-device version gives each a password — this demo skips that.)</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Name</th><th>Roles</th><th>Own classes</th><th>Co-teaching</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="empty">No staff yet.</td></tr>`}</tbody>
    </table></div>
    ${feat('safeguarding') ? `<div class="card" style="margin-top:20px">
      <h3>${ic('i-shield')} Designated safeguarding lead</h3>
      <p class="m-sub" style="margin-top:0">The DSL sees every safeguarding record in the school; other staff see only records they reported themselves.</p>
      <select id="dsl-sel" style="max-width:300px">${schoolStaff()
        .map(u => `<option value="${u.id}" ${u.id === mySchool().dslId ? 'selected' : ''}>${esc(u.name)} (${dualRole(u) ? 'dual role' : canOffice(u) ? 'office' : 'teacher'})</option>`).join('')}</select>
    </div>` : ''}`;
  main.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {
    const [which, id] = b.dataset.role.split('|');
    const t = user(id);
    const has = which === 'teach' ? canTeach(t) : canOffice(t);
    // never leave someone with no role at all — that would strand the account
    if (has && (which === 'teach' ? !canOffice(t) : !canTeach(t))) {
      toast(`${t.name} needs at least one role — give them the other first.`, true); return;
    }
    if (which === 'teach') {
      if (has) {
        const teaching = schoolClasses().filter(c => classTeachers(c).includes(t.id));
        if (teaching.length) { toast(`${t.name} still teaches ${teaching.map(c => c.name).join(', ')} — remove them from the class first.`, true); return; }
        if (t.role === 'teacher') { t.role = 'admin'; t.alsoAdmin = false; } else t.alsoTeacher = false;

    } else {
      if (has) {
        if (mySchool().dslId === t.id && !canTeach(t)) { toast(`${t.name} is the DSL — hand that over first.`, true); return; }
        if (t.role === 'admin') { t.role = 'teacher'; t.alsoTeacher = false; } else t.alsoAdmin = false;
      } else { if (t.role === 'teacher') t.alsoAdmin = true; else t.role = 'admin'; }

  };
  $('#btn-addadmin').onclick = () => openPrompt('Add an office account', 'This person gets full admin access to the school. What is their name?', 'e.g. Mr Reeves', name => {
    db.users.push({ id: uid(), name, role: 'admin', schoolId: mySchool().id });
    saveDB(); render(); toast(name + ' can now sign in as an office admin');
  });
  $('#btn-addstaff').onclick = () => openPrompt('Add a teacher', 'What is their name?', 'e.g. Mr Idowu', name => {
    db.users.push({ id: uid(), name, role: 'teacher', schoolId: mySchool().id });
    saveDB(); render(); toast(name + ' can now sign in and make classes');
  });
  document.querySelectorAll('[data-rmstaff]').forEach(b => b.onclick = () => {
    const t = user(b.dataset.rmstaff);
    const owned = schoolClasses().filter(c => c.teacher === t.id);
    if (owned.length) { toast(`${t.name} still owns ${owned.length} class${owned.length === 1 ? '' : 'es'} — delete or hand those over first.`, true); return; }
    if (canOffice(t) && schoolOffice().length <= 1) { toast('A school needs at least one office account.', true); return; }
    if (mySchool().dslId === t.id) { toast(`${t.name} is the DSL — hand that over first.`, true); return; }

function openScaleEditor(school, existing) {
  let levels = existing ? JSON.parse(JSON.stringify(existing.opts)) : [
    { code: '', label: '', color: LEVEL_PALETTE[0][0], bg: LEVEL_PALETTE[0][1] },
  ];
  const m = openModal(`
    <h3>${ic('i-markbook')} ${existing ? 'Edit scale' : 'New grade scale'}</h3>
    <div class="form-2col">
      <div><label>Name</label><input id="sc-name" maxlength="40" placeholder="e.g. Effort grade" value="${existing ? esc(existing.name) : ''}"></div>
      <div><label>Type</label><select id="sc-kind">${SCALE_KINDS.map(([k, kl]) => `<option value="${k}" ${existing && existing.kind === k ? 'selected' : ''}>${kl}</option>`).join('')}</select></div>
    </div>
    <label>Levels <span class="muted small" style="font-weight:600">— code, what it means, and a colour</span></label>
    <div id="sc-levels"></div>
    <button class="btn sec small" id="sc-add" style="margin-top:8px">${ic('i-plus')} Add a level</button>
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-tick')} ${existing ? 'Save scale' : 'Create scale'}</button>
    </div>`);
  m.querySelector('.modal').classList.add('wide');
  const drawLevels = () => {
    m.querySelector('#sc-levels').innerHTML = levels.map((lv, i) => `
      <div class="lvl-row">
        <input class="lvl-code" data-i="${i}" maxlength="6" placeholder="Code" value="${esc(lv.code)}" style="max-width:78px">
        <input class="lvl-label" data-i="${i}" maxlength="30" placeholder="What it means" value="${esc(lv.label || '')}">
        <span class="lvl-swatches">${LEVEL_PALETTE.map((p, pi) => `<button class="lvl-sw ${p[0] === lv.color ? 'on' : ''}" data-i="${i}" data-p="${pi}" style="background:${p[1]};border-color:${p[0]}"></button>`).join('')}</span>
        <button class="iconbtn lvl-del" data-i="${i}" title="Remove level">${ic('i-x')}</button>
      </div>`).join('');
    m.querySelectorAll('.lvl-code').forEach(el => el.oninput = () => levels[+el.dataset.i].code = el.value.trim());
    m.querySelectorAll('.lvl-label').forEach(el => el.oninput = () => levels[+el.dataset.i].label = el.value);
    m.querySelectorAll('.lvl-sw').forEach(el => el.onclick = () => {
      const p = LEVEL_PALETTE[+el.dataset.p];
      levels[+el.dataset.i].color = p[0]; levels[+el.dataset.i].bg = p[1];
      drawLevels();
    });
    m.querySelectorAll('.lvl-del').forEach(el => el.onclick = () => {
      if (levels.length <= 1) { toast('A scale needs at least one level', true); return; }
      levels.splice(+el.dataset.i, 1); drawLevels();
    });
  };
  drawLevels();
  m.querySelector('#sc-add').onclick = () => { const p = LEVEL_PALETTE[levels.length % LEVEL_PALETTE.length]; levels.push({ code: '', label: '', color: p[0], bg: p[1] }); drawLevels(); };
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('[data-go]').onclick = () => {
    const name = m.querySelector('#sc-name').value.trim();
    if (!name) { toast('Give the scale a name', true); return; }
    const opts = levels.filter(lv => lv.code.trim()).map(lv => ({ code: lv.code.trim(), label: lv.label.trim(), color: lv.color, bg: lv.bg }));
    if (!opts.length) { toast('Add at least one level with a code', true); return; }
    const kind = m.querySelector('#sc-kind').value;
    if (existing) { existing.name = name; existing.kind = kind; existing.opts = opts; }
    else (school.scales = school.scales || []).push({ id: uid(), name, kind, opts });
    saveDB(); m.remove(); render(); toast(existing ? 'Scale saved' : 'Scale created');
  };
  m.querySelector('#sc-name').focus();
}

/* ---------- report builder (office designs templates → generate a class at once) ---------- */
function findMarkCol(c, name) { name = (name || '').trim().toLowerCase(); return (c.markCols || []).find(x => x.name.toLowerCase() === name); }
function reportGrade(c, colName, sid) {
  const col = findMarkCol(c, colName); if (!col) return '';
  const v = mkGet(col, sid); if (v === '') return '';
  if (col.type === 'mark') return v + ' / ' + col.max;
  const opt = resolveScaleOpts(c, col).find(o => o.code === v);
  return opt ? (opt.label && opt.label !== opt.code ? `${opt.label} (${opt.code})` : opt.code) : v;
}
function reportComment(c, colName, sid) { const col = findMarkCol(c, colName); return col ? mkGet(col, sid) : ''; }
function reportField(field, ctx) {
  if (field === 'pupilName') return ctx.student.name;
  if (field === 'className') return ctx.klass.name;
  if (field === 'teacherName') return classTeachers(ctx.klass).map(t => user(t).name).join(', ');
  if (field === 'schoolName') return schoolOf(ctx.klass).name;
  if (field === 'date') return new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  if (field === 'year') { const d = new Date(), y = d.getFullYear(), s = d.getMonth() >= 8 ? y : y - 1; return `${s}–${String(s + 1).slice(2)}`; }
  return '';
}
const FIELD_LABEL = { pupilName: 'Pupil', className: 'Class', teacherName: 'Teacher', schoolName: 'School', date: 'Date', year: 'Year' };
function attendanceOf(sid) { return (db.attendance || {})[sid] || {}; }
const RP_FS = { h: { s: '1.15rem', m: '1.5rem', l: '2rem' }, t: { s: '.85rem', m: '.96rem', l: '1.2rem' } };
function elStyle(el, base) {
  let s = el.align ? `text-align:${el.align};` : '';
  if (el.size && RP_FS[base]) s += `font-size:${RP_FS[base][el.size]};`;
  return s ? ` style="${s}"` : '';
}
function renderReportEl(el, ctx) {
  if (el.type === 'heading') return `<h2 class="rp-h"${elStyle(el, 'h')}>${esc(el.text || '')}</h2>`;
  if (el.type === 'text') return `<p class="rp-t"${elStyle(el, 't')}>${esc(el.text || '')}</p>`;
  if (el.type === 'field') return `<div class="rp-field"${elStyle(el, 'f')}><b>${esc(FIELD_LABEL[el.field] || '')}:</b> ${esc(reportField(el.field, ctx))}</div>`;
  if (el.type === 'letterhead') {
    const s = schoolOf(ctx.klass);
    return `<div class="rp-lh">
      ${s.logo ? `<img class="rp-logo" src="${s.logo}" alt="">` : ''}
      <div><div class="rp-lh-name">${esc(s.name)}</div>${s.strapline ? `<div class="rp-lh-sub">${esc(s.strapline)}</div>` : ''}</div>
    </div>`;
  }
  if (el.type === 'attendance') {
    const a = attendanceOf(ctx.student.id);
    const pct = (a.pct != null && a.pct !== '') ? a.pct + '%' : '—';
    const late = a.late ? ` · ${esc(String(a.late))} late mark${+a.late === 1 ? '' : 's'}` : '';
    return `<div class="rp-att"><b>Attendance:</b> ${esc(pct)}${late}</div>`;
  }
  if (el.type === 'gradetable') {
    const rows = el.rows || [];
    if (!rows.length) return '';
    const anyEffort = rows.some(r => r.effortCol);
    return `<div class="rp-subj" style="border:none;padding:0;margin-top:12px"><table class="rp-gt">
      <thead><tr><th>${esc(el.label || 'Subject')}</th><th>Attainment</th>${anyEffort ? '<th>Effort</th>' : ''}</tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td>${esc(r.label || '')}</td>
        <td>${esc((r.gradeCol && reportGrade(ctx.klass, r.gradeCol, ctx.student.id)) || '—')}</td>
        ${anyEffort ? `<td>${esc((r.effortCol && reportGrade(ctx.klass, r.effortCol, ctx.student.id)) || '—')}</td>` : ''}
      </tr>`).join('')}</tbody>
    </table></div>`;
  }
  if (el.type === 'subject') {
    const grade = el.gradeCol ? reportGrade(ctx.klass, el.gradeCol, ctx.student.id) : '';
    const effort = el.effortCol ? reportGrade(ctx.klass, el.effortCol, ctx.student.id) : '';
    const comment = el.commentCol ? reportComment(ctx.klass, el.commentCol, ctx.student.id) : '';
    const both = grade && effort;
    const pill = (v, lbl, cls) => both ? `<span class="rp-pill-wrap"><small>${lbl}</small><span class="rp-grade ${cls}">${esc(v)}</span></span>` : `<span class="rp-grade ${cls}">${esc(v)}</span>`;
    return `<div class="rp-subj">
      <div class="rp-subj-head"><b>${esc(el.label || '')}</b>
        <span class="rp-pills">${grade ? pill(grade, 'Attainment', '') : ''}${effort ? pill(effort, 'Effort', 'rp-effort') : ''}</span>
      </div>
      ${comment ? `<p class="rp-c">${esc(comment)}</p>` : (el.commentCol ? `<p class="rp-c rp-empty">No comment written yet.</p>` : '')}
    </div>`;
  }
  return '';
}

    <datalist id="rb-gcols">${gcols.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <datalist id="rb-ccols">${ccols.map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;

  const page = $('#rpb-page'), propsBox = $('#rpb-props');
  const boxEl = id => page.querySelector(`[data-elbox="${id}"]`);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const refreshBox = id => { const el = t.elements.find(x => x.id === id); if (el && boxEl(id)) boxEl(id).innerHTML = boxInner(el); };

  const alignSize = el => `
    <label>Align</label>
    <select data-el="${el.id}" data-f="align">${[['', 'Default'], ['left', 'Left'], ['center', 'Centre'], ['right', 'Right']].map(([v, l]) => `<option value="${v}" ${(el.align || '') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <label>Text size</label>
    <select data-el="${el.id}" data-f="size">${[['', 'Default'], ['s', 'Small'], ['m', 'Medium'], ['l', 'Large']].map(([v, l]) => `<option value="${v}" ${(el.size || '') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const sideProps = el => {
    if (!el) return `<p class="muted small">Click an element on the page to edit it here.</p>`;
    let f = '';
    if (el.type === 'heading') f = `<label>Heading text</label><input data-el="${el.id}" data-f="text" value="${esc(el.text || '')}">${alignSize(el)}`;
    else if (el.type === 'text') f = `<label>Text</label><textarea data-el="${el.id}" data-f="text" style="min-height:90px">${esc(el.text || '')}</textarea>${alignSize(el)}`;
    else if (el.type === 'field') f = `<label>Which field</label><select data-el="${el.id}" data-f="field">${REPORT_FIELDS.map(([v, l]) => `<option value="${v}" ${el.field === v ? 'selected' : ''}>${l}</option>`).join('')}</select>${alignSize(el)}`;
    else if (el.type === 'subject') f = `
      <label>Subject / heading</label><input data-el="${el.id}" data-f="label" value="${esc(el.label || '')}" placeholder="e.g. Mathematics">
      <label>Attainment grade column</label><input list="rb-gcols" data-el="${el.id}" data-f="gradeCol" value="${esc(el.gradeCol || '')}" placeholder="none">
      <label>Effort grade column</label><input list="rb-gcols" data-el="${el.id}" data-f="effortCol" value="${esc(el.effortCol || '')}" placeholder="none">
      <label>Comment column</label><input list="rb-ccols" data-el="${el.id}" data-f="commentCol" value="${esc(el.commentCol || '')}" placeholder="none">`;
    else if (el.type === 'gradetable') f = `
      <label>Table heading</label><input data-el="${el.id}" data-f="label" value="${esc(el.label || '')}" placeholder="Subjects">
      <label>Rows</label>
      ${(el.rows || []).map((r, ri) => `<div class="gt-row">
        <input data-gtr="${el.id}|${ri}" data-f="label" placeholder="Subject" value="${esc(r.label || '')}">
        <input list="rb-gcols" data-gtr="${el.id}|${ri}" data-f="gradeCol" placeholder="Attainment col" value="${esc(r.gradeCol || '')}">
        <input list="rb-gcols" data-gtr="${el.id}|${ri}" data-f="effortCol" placeholder="Effort col" value="${esc(r.effortCol || '')}">
        <button class="iconbtn" data-gtdel="${el.id}|${ri}">${ic('i-x')}</button></div>`).join('')}
      <button class="btn sec small" data-gtadd="${el.id}" style="margin-top:8px">${ic('i-plus')} Add row</button>`;
    else if (el.type === 'letterhead') f = `<p class="muted small">Shows the school logo, name and strapline. Set these under <b>School details</b>.</p>`;
    else if (el.type === 'attendance') f = `<p class="muted small">Shows the pupil's attendance % and late marks (entered on the <b>Students</b> page).</p>`;
    return `<div class="rb-tag" style="margin-bottom:8px">${TAG[el.type]}</div>${f}
      <button class="btn danger small" data-propdel="${el.id}" style="margin-top:14px">${ic('i-trash')} Delete element</button>`;
  };
  const rebuildProps = () => {
    const el = t.elements.find(x => x.id === rbSel);
    propsBox.innerHTML = sideProps(el);
    propsBox.querySelectorAll('[data-el]').forEach(inp => {
      const save = () => { el[inp.dataset.f] = inp.value; saveDB(); refreshBox(el.id); };
      inp.addEventListener('input', save); inp.addEventListener('change', save);
    });
    propsBox.querySelectorAll('[data-gtr]').forEach(inp => {
      const save = () => { const [, ri] = inp.dataset.gtr.split('|'); (el.rows[+ri] = el.rows[+ri] || {})[inp.dataset.f] = inp.value; saveDB(); refreshBox(el.id); };
      inp.addEventListener('input', save); inp.addEventListener('change', save);
    });
    const ga = propsBox.querySelector('[data-gtadd]');
    if (ga) ga.onclick = () => { (el.rows = el.rows || []).push({ id: uid(), label: '', gradeCol: '', effortCol: '' }); saveDB(); refreshBox(el.id); rebuildProps(); };
    propsBox.querySelectorAll('[data-gtdel]').forEach(b => b.onclick = () => { const [, ri] = b.dataset.gtdel.split('|'); el.rows.splice(+ri, 1); saveDB(); refreshBox(el.id); rebuildProps(); });
    const pd = propsBox.querySelector('[data-propdel]');
    if (pd) pd.onclick = () => { t.elements = t.elements.filter(x => x.id !== el.id); rbSel = null; saveDB(); render(); };
  };
  const selectEl = id => { rbSel = id; page.querySelectorAll('.rpb-el').forEach(b => b.classList.toggle('sel', b.dataset.elbox === id)); rebuildProps(); };
  rebuildProps();

  // move / resize via pointer, delete + select via delegation
  page.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-eldel]')) return;
    const rs = e.target.closest('[data-elrs]'), box = e.target.closest('[data-elbox]');
    if (!box) return;
    const id = box.dataset.elbox, el = t.elements.find(x => x.id === id);
    selectEl(id);
    const sx = e.clientX, sy = e.clientY, ox = el.x, oy = el.y, ow = el.w, oh = el.h, resizing = !!rs;
    const bx = boxEl(id);
    const mv = ev => {
      if (resizing) { el.w = clamp(ow + (ev.clientX - sx), 60, RP_PAGE_W - el.x); el.h = Math.max(24, oh + (ev.clientY - sy)); bx.style.width = el.w + 'px'; bx.style.height = el.h + 'px'; }
      else { el.x = clamp(ox + (ev.clientX - sx), 0, RP_PAGE_W - el.w); el.y = Math.max(0, oy + (ev.clientY - sy)); bx.style.left = el.x + 'px'; bx.style.top = el.y + 'px'; }
    };
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); saveDB(); };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
    e.preventDefault();
  });
  page.addEventListener('click', e => {
    const del = e.target.closest('[data-eldel]');
    if (del) { t.elements = t.elements.filter(x => x.id !== del.dataset.eldel); rbSel = null; saveDB(); render(); }
  });

  main.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const ty = b.dataset.add, sz = RP_ELSIZE[ty] || [696, 60];
    const bottom = t.elements.reduce((mx, el) => Math.max(mx, el.y + el.h), 20);
    const defaults = {
      heading: { text: 'New heading' }, text: { text: 'New paragraph of text.' }, field: { field: 'pupilName' },
      subject: { label: 'Subject', gradeCol: '', effortCol: '', commentCol: '' },
      letterhead: {}, attendance: {},
      gradetable: { label: 'Subjects', rows: [{ id: uid(), label: '', gradeCol: '', effortCol: '' }] },
    };
    const el = Object.assign({ id: uid(), type: ty, x: 32, y: Math.min(bottom + 12, RP_PAGE_H - sz[1]), w: sz[0], h: sz[1] }, defaults[ty]);
    t.elements.push(el); rbSel = el.id; saveDB(); render();
  });

  $('#crumb').onclick = () => go({ page: 'areports', templateId: null });
  $('#rb-name').oninput = e => { t.name = e.target.value; saveDB(); };
  $('#rb-gen').onclick = () => openReportGenerate(t);
}

/* pick a class, then open the printable run */
function openReportGenerate(t) {
  const classes = schoolClasses().filter(c => !c.archived && c.students.length);
  if (!classes.length) { toast('No classes with students to report on yet.', true); return; }
  const m = openModal(`
    <h3>${ic('i-report')} Generate “${esc(t.name)}”</h3>
    <p class="m-sub">Builds a report for every student in the class, pulling their grades and comments from the Markbook.</p>
    <label>Class</label>
    <select id="rg-class">${classes.map(c => `<option value="${c.id}">${esc(c.name)} (${c.students.length})</option>`).join('')}</select>
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-print')} Generate reports</button>
    </div>`);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('[data-go]').onclick = () => { const c = klass(m.querySelector('#rg-class').value); m.remove(); openReportRun(t, c); };
}

function openReportRun(t, c) {
  const wrap = document.createElement('div');
  wrap.className = 'rp-wrap';
  const school = schoolOf(c);
  wrap.innerHTML = `
    <div class="rp-bar">
      <span class="mark">${MARK}</span>
      <b>${esc(t.name)} · ${esc(c.name)}</b>
      <span class="chip brand">${c.students.length} report${c.students.length === 1 ? '' : 's'}</span>
      <button class="btn small" id="rp-print">${ic('i-print')} Print / save PDF</button>
      <button class="btn ghost small" id="rp-close">${ic('i-x')} Close</button>
    </div>
    <div class="rp-scroll">
      ${c.students.map(sid => {
        const ctx = { student: user(sid), klass: c, school };
        return `<div class="rp-page pos" style="${rpVars(school)}">
          ${t.elements.map(el => `<div style="position:absolute;left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px">${renderReportEl(el, ctx)}</div>`).join('') || '<p class="rp-empty" style="padding:40px">This template has no elements yet.</p>'}
        </div>`;
      }).join('') || `<div class="rp-page"><p class="rp-empty">No students in this class.</p></div>`}
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#rp-close').onclick = () => wrap.remove();
  wrap.querySelector('#rp-print').onclick = () => window.print();
}

/* ---------- parent dashboard ---------- */
function renderParentDash(main) {
  const u = me(), child = user(u.childId);
  const classes = myClasses();
  const tasks = db.assignments
    .filter(a => classes.some(c => c.id === a.classId) && !a.archived && isLive(a))
    .sort((x, y) => (x.due || '9999') < (y.due || '9999') ? -1 : 1);
  const starred = db.items.filter(i => i.star && i.studentId === child.id);
  main.innerHTML = `
    <div class="page-head"><h2>${esc(child.name.split(' ')[0])}'s learning 🌱</h2></div>
    <p class="page-sub">You're following ${esc(child.name)} as a parent — you can see their work and their teacher's feedback, but not change anything.</p>
    <div class="stat-row">
      <div class="stat"><div class="n">${classes.length}</div><div class="l">Classes</div></div>
      <div class="stat green"><div class="n">${tasks.filter(a => handin(a.id, child.id).status !== 'none').length}</div><div class="l">Handed in</div></div>
      <div class="stat amber"><div class="n">${starred.length}</div><div class="l">Portfolio pieces</div></div>
    </div>
    ${feat('timetables') ? (tt => tt ? ttStripHTML(tt) : '')(ttForStudent(child.id)) : ''}
    ${feat('tables') ? xtDashHTML(child.id, true) : ''}
    <h3 style="margin:6px 0 12px">${esc(child.name.split(' ')[0])}'s tasks</h3>
    ${tasks.map(a => taskRowHTML(a, child.id)).join('') || `<div class="card empty">${ic('i-task', 'big')}No tasks yet.</div>`}
    <h3 style="margin:20px 0 12px">${ic('i-star')} Portfolio</h3>
    ${portfolioGrid(starred)}`;
  wireTaskRows();
  wirePortfolioGrid();
  wireTTStrip();
  wireXtDash();
}

/* ---------- class grid ---------- */
function renderClassGrid(classes) {
  if (!classes.length) return `<div class="card empty">${ic('i-class', 'big')}No classes yet.</div>`;
  return `<div class="class-grid">` + classes.map(c => {
    const n = db.assignments.filter(a => a.classId === c.id && !a.archived && (isTeacher() || isLive(a))).length;
    return `
    <button class="class-card" data-open-class="${c.id}">
      <div class="class-band">${ic('i-class')}</div>
      <div class="cbody"><b>${esc(c.name)}</b><small>${esc(c.subject || '')}</small>
        <div class="cfoot">
          <span class="chip brand">${ic('i-people')} ${c.students.length}</span>
          <span class="chip grey">${ic('i-task')} ${n} task${n === 1 ? '' : 's'}</span>
          ${c.archived ? `<span class="chip red">${ic('i-archive')} archived</span>` : ''}
        </div>
      </div>
    </button>`;
  }).join('') + `</div>`;
}
function wireClassGrid() {
  document.querySelectorAll('[data-open-class]').forEach(b => b.onclick = () =>
    go({ page: 'class', classId: b.dataset.openClass, tab: 'tasks' }));
}

/* ---------- activity feed ---------- */
function renderActivity(main) {
  const mine = db.notifications.filter(n => n.userId === db.session);
  main.innerHTML = `
    <div class="page-head"><h2>${ic('i-bell')} Activity</h2><span class="spacer"></span>
      ${mine.some(n => !n.read) ? `<button class="btn sec small" id="btn-readall">${ic('i-tick')} Mark all read</button>` : ''}</div>
    ${mine.map(n => `
      <button class="notif ${n.read ? '' : 'unread'}" data-notif="${n.id}">
        <span class="avatar">${ic('i-bell')}</span>
        <span class="n-body">${esc(n.text)}<small>${fmtWhen(n.ts)}</small></span>
      </button>`).join('') || `<div class="card empty">${ic('i-bell', 'big')}Nothing yet — activity about your classes shows up here.</div>`}`;
  const ra = $('#btn-readall');
  if (ra) ra.onclick = () => { mine.forEach(n => n.read = true); saveDB(); render(); };
  document.querySelectorAll('[data-notif]').forEach(b => b.onclick = () => {
    const n = db.notifications.find(x => x.id === b.dataset.notif);
    n.read = true; saveDB();
    if (n.link) go(Object.assign({ page: 'dash' }, n.link));
    else render();
  });
}

/* ---------- class view ---------- */
function renderClass(main) {
  const c = klass(view.classId);
  if (!c) { go({ page: 'dash' }); return; }
  // the office can look into any class (read-only); only teachers get the action buttons
  const teacherView = isTeacher() || isAdmin();
  const tabs = [['tasks', 'i-task', 'Tasks']];
  if (feat('points')) tabs.push(['points', 'i-award', 'Points']);
  if (feat('discussions')) tabs.push(['discussions', 'i-chat', 'Discussions']);
  if (teacherView) {
    tabs.push(['students', 'i-people', 'Students']);
    if (feat('gradebook')) tabs.push(['gradebook', 'i-grade', 'Gradebook']);
    if (feat('markbook')) tabs.push(['markbook', 'i-markbook', 'Markbook']);
    if (feat('reading')) tabs.push(['reading', 'i-book', 'Reading']);
    if (feat('tables')) tabs.push(['tables', 'i-tables', 'Times tables']);
  } else if (!isParent() && feat('portfolios')) tabs.push(['portfolio', 'i-star', 'My portfolio']);
  if (!tabs.some(t => t[0] === view.tab)) view.tab = 'tasks'; // a switched-off tab falls back
  const tabBtns = tabs.map(([k, icn, lbl]) =>
    `<button class="${view.tab === k ? 'on' : ''}" data-tab="${k}">${ic(icn)} ${lbl}</button>`).join('');
  main.innerHTML = `
    <button class="crumb" id="crumb">${ic('i-back')} Home</button>
    <div class="page-head"><h2>${esc(c.name)}</h2>
      ${c.archived ? `<span class="chip red">${ic('i-archive')} archived</span>` : ''}
      <span class="spacer"></span>
      ${isTeacher() ? `<button class="btn ghost small" id="btn-settings">${ic('i-gear')} Class settings</button>
        <button class="btn" id="btn-newtask" ${c.archived ? 'disabled' : ''}>${ic('i-plus')} New task</button>` : ''}</div>
    <p class="page-sub">${esc(c.subject || '')}${teacherView ? ` · Join code: <b>${c.code}</b>` : ''}${isAdmin() ? ` · <span class="chip grey">${ic('i-eye')} office view</span>` : ''}</p>
    <div class="tabbar">${tabBtns}</div>
    <div id="tabbody"></div>`;
  $('#crumb').onclick = () => go({ page: 'dash', classId: null });
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go({ tab: b.dataset.tab }));
  if (isTeacher()) {
    $('#btn-newtask').onclick = () => openTaskModal(c.id, null);
    $('#btn-settings').onclick = () => openClassSettings(c);
  }

  const body = $('#tabbody');
  if (view.tab === 'points' && feat('points')) renderPointsTab(body, c);
  else if (view.tab === 'discussions' && feat('discussions')) renderDiscussionList(body, c);
  else if (view.tab === 'students' && teacherView) renderStudents(body, c);
  else if (view.tab === 'gradebook' && teacherView && feat('gradebook')) renderGradebook(body, c);
  else if (view.tab === 'markbook' && teacherView && feat('markbook')) renderMarkbook(body, c);
  else if (view.tab === 'reading' && teacherView && feat('reading')) renderReadingTab(body, c);
  else if (view.tab === 'tables' && teacherView && feat('tables')) renderTablesTab(body, c);
  else if (view.tab === 'portfolio' && feat('portfolios')) renderPortfolioTab(body, c);
  else renderTasksTab(body, c);
}

function renderTasksTab(body, c) {
  const teacherView = isTeacher();
  const sid = isParent() ? me().childId : db.session;
  const all = db.assignments.filter(a => a.classId === c.id && (teacherView || isLive(a))).sort((a, b) => b.createdAt - a.createdAt);
  const live = all.filter(a => !a.archived);
  const archived = all.filter(a => a.archived);
  const rowFor = a => {
    if (!teacherView) return taskRowHTML(a, sid);
    const inCount = c.students.filter(s => handin(a.id, s).status !== 'none').length;
    return `
    <button class="assign-row ${a.archived ? 'dim' : ''}" data-task="${a.id}">
      <span class="assign-ico">${!isLive(a) ? ic('i-cal') : effLocked(a) ? ic('i-lock') : ic('i-task')}</span>
      <span class="assign-body"><b>${esc(a.title)}</b><small>set ${fmtDate(a.createdAt)}${effLocked(a) ? ' · locked' : ''}${a.outOf ? ' · graded /' + a.outOf : ''}</small></span>
      <span class="assign-side">${schedChip(a) || (toReviewCount(a.id) ? `<span class="chip amber">${toReviewCount(a.id)} to review</span>` : `<span class="chip grey">${inCount}/${c.students.length} in</span>`)}${dueChip(a)}</span>
    </button>`;
  };
  body.innerHTML = `
    ${live.map(rowFor).join('') || `<div class="card empty">${ic('i-task', 'big')}No tasks yet${teacherView ? ' — set one with “New task”.' : '.'}</div>`}
    ${teacherView && archived.length ? `<details class="arch"><summary>${ic('i-archive')} Archived tasks (${archived.length})</summary>${archived.map(rowFor).join('')}</details>` : ''}`;
  if (teacherView) {
    document.querySelectorAll('[data-task]').forEach(b => b.onclick = () =>
      go({ page: 'assignment', assignmentId: b.dataset.task }));
  } else wireTaskRows();
}

/* ---------- students tab (roster + parent codes) ---------- */
function renderStudents(body, c) {
  const rows = c.students.map(sid => {
    const s = user(sid);
    if (!db.parentCodes[sid]) { db.parentCodes[sid] = classCode(); saveDB(); }
    const done = db.assignments.filter(a => a.classId === c.id && !a.archived && handin(a.id, sid).status !== 'none').length;
    const total = db.assignments.filter(a => a.classId === c.id && !a.archived).length;
    const parents = parentsOf(sid).map(p => user(p).name).join(', ');
    return `<tr>
      <td><span class="row"><span class="avatar">${initials(s.name)}</span><b>${esc(s.name)}</b></span></td>
      <td>${done}/${total} handed in</td>
      <td><code style="font-weight:800;letter-spacing:.1em;color:var(--gold-dk)">${db.parentCodes[sid]}</code>
        ${parents ? `<div class="small muted">${ic('i-family')} ${esc(parents)}</div>` : ''}</td>
      <td style="text-align:right">
        ${feat('portfolios') ? `<button class="btn ghost small" data-portfolio="${sid}">${ic('i-star')} Portfolio</button>` : ''}
        <button class="btn ghost small" data-remove="${sid}">${ic('i-x')} Remove</button></td>
    </tr>`;
  }).join('');
  const isOwner = c.teacher === db.session;
  const teacherRows = classTeachers(c).map(tid => {
    const t = user(tid);
    return `<span class="row" style="padding:5px 0">
      <span class="avatar" style="width:30px;height:30px;font-size:.72rem">${initials(t.name)}</span>
      <b class="small">${esc(t.name)}</b>
      ${tid === c.teacher ? `<span class="chip brand">owner</span>` : ''}
      ${isOwner && tid !== c.teacher ? `<button class="iconbtn" data-rmteacher="${tid}" title="Remove co-teacher">${ic('i-x')}</button>` : ''}
    </span>`;
  }).join('');
  body.innerHTML = `
    <div class="grid cols-2" style="margin-bottom:16px">
      <div class="code-pill"><code>${c.code}</code><small>Students join with this code</small></div>
      <div class="card" style="padding:14px 16px"><b>${ic('i-family')} Parent codes</b>
        <div class="small muted" style="margin-top:4px">Each student has a parent code. Parents enter it on the sign-in screen to follow their child's work — view only.</div></div>
      <div class="card" style="padding:14px 16px"><b>${ic('i-teacher')} Teachers</b>
        <div style="margin-top:6px">${teacherRows}</div>
        <button class="btn sec small" id="btn-addteacher" style="margin-top:8px">${ic('i-plus')} Add a co-teacher</button>
        <div class="small muted" style="margin-top:6px">Co-teachers see this class, its folders and gradebook — students keep the one login for everyone.</div></div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Student</th><th>Progress</th><th>Parent code</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4" class="empty">No students yet — share the join code.</td></tr>`}</tbody>
    </table></div>`;
  document.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => {
    const s = user(b.dataset.remove);
    openConfirm(`Remove ${s.name}?`, `${s.name} will leave ${c.name}. Their work stays saved.`, () => {
      c.students = c.students.filter(x => x !== b.dataset.remove);
      saveDB(); render(); toast(`${s.name} removed`);
    });
  });
  document.querySelectorAll('[data-portfolio]').forEach(b => b.onclick = () =>
    go({ page: 'portfolio', studentId: b.dataset.portfolio }));
  const at = $('#btn-addteacher');
  if (at) at.onclick = () => {
    const candidates = db.users.filter(x => x.role === 'teacher' && x.schoolId === c.schoolId && !classTeachers(c).includes(x.id));
    if (!candidates.length) { toast('No other teachers at your school yet — ask the school office to add them under Staff.', true); return; }
    const m = openModal(`

      <div class="m-actions">
        <button class="btn ghost" data-x>Cancel</button>
        <button class="btn" data-go>${ic('i-plus')} Add</button>

    m.querySelector('[data-x]').onclick = () => m.remove();
    m.querySelector('[data-go]').onclick = () => {
      const tid = m.querySelector('#ct-teacher').value;
      c.teachers = [...classTeachers(c), tid];
      notify([tid], `${me().name} made you a co-teacher of ${c.name}`, { page: 'class', classId: c.id, tab: 'tasks' });
      saveDB(); m.remove(); render(); toast(`${user(tid).name} added — they can see everything in this class now`);
    };
  };
  document.querySelectorAll('[data-rmteacher]').forEach(b => b.onclick = () => {
    const t = user(b.dataset.rmteacher);
    openConfirm(`Remove ${t.name}?`, `They'll no longer see ${c.name}.`, () => {
      c.teachers = classTeachers(c).filter(x => x !== b.dataset.rmteacher);

    });
  });
}

/* ---------- portfolio ---------- */
function portfolioGrid(items) {
  if (!items.length) return `<div class="card empty">${ic('i-star', 'big')}Nothing in the portfolio yet — press the star on a great piece of work to add it.</div>`;
  return `<div class="port-grid">` + items.sort((a, b) => b.ts - a.ts).map(i => {
    const a = assignment(i.assignmentId);
    let preview = '';
    if ((i.kind === 'file' && i.type && i.type.startsWith('image/')) || i.kind === 'drawing' || i.kind === 'canvas') preview = `<img class="w-img" src="${i.data}" alt="">`;
    else if (i.kind === 'file' && i.type && i.type.startsWith('video/')) preview = `<video class="w-vid" controls playsinline src="${mediaURL(i)}"></video>`;
    else if (i.kind === 'audio') preview = `<audio controls src="${mediaURL(i)}"></audio>`;
    else if (i.kind === 'note') preview = `<div class="w-body">${esc(i.text.slice(0, 120))}${i.text.length > 120 ? '…' : ''}</div>`;
    else if (i.kind === 'link') preview = `<span class="w-file">${ic('i-link')}<span>${esc(i.text || i.url)}</span></span>`;
    else preview = `<span class="w-file">${ic('i-clip')}<span>${esc(i.name || 'file')}</span></span>`;
    return `<div class="port-card" data-port-open="${i.id}">${preview}<small>${a ? esc(a.title) : ''} · ${fmtDate(i.ts)}</small></div>`;
  }).join('') + `</div>`;
}

function openReadingEntry(sid, existing) {
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  let rating = existing ? existing.rating || 0 : 0;
  const m = openModal(`
    <h3>${ic('i-book')} ${existing ? 'Edit reading entry' : 'Add reading'}</h3>
    <p class="m-sub">${esc(user(sid).name)}</p>
    <div class="form-2col">
      <div><label>Date</label><input id="re-date" type="date" value="${existing ? existing.date : today}"></div>
      <div><label>Pages (optional)</label><input id="re-pages" maxlength="30" placeholder="e.g. pp 12–20" value="${existing ? esc(existing.pages || '') : ''}"></div>
    </div>
    <label>Book</label><input id="re-book" maxlength="80" placeholder="Book title" value="${existing ? esc(existing.book || '') : ''}">
    <label>Author (optional)</label><input id="re-author" maxlength="60" placeholder="Author" value="${existing ? esc(existing.author || '') : ''}">
    <label>How did the reading go?</label>
    <div class="star-pick" id="re-stars">${[1, 2, 3, 4, 5].map(i => `<span class="s ${i <= rating ? 'on' : ''}" data-star="${i}">★</span>`).join('')}</div>
    <label>Comment</label><textarea id="re-note" placeholder="e.g. Read with lovely expression, enjoyed the ending…">${existing ? esc(existing.note || '') : ''}</textarea>
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-tick')} ${existing ? 'Save' : 'Add entry'}</button>
    </div>`);
  m.querySelectorAll('#re-stars .s').forEach(st => st.onclick = () => {
    rating = +st.dataset.star;
    m.querySelectorAll('#re-stars .s').forEach(x => x.classList.toggle('on', +x.dataset.star <= rating));
  });
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('[data-go]').onclick = () => {
    const book = m.querySelector('#re-book').value.trim();
    const note = m.querySelector('#re-note').value.trim();
    if (!book && !note) { toast('Add a book title or a comment', true); return; }
    const data = {
      date: m.querySelector('#re-date').value || today, book, author: m.querySelector('#re-author').value.trim(),
      pages: m.querySelector('#re-pages').value.trim(), rating, note,
    };
    if (existing) { Object.assign(existing, data); }
    else {
      (db.reading[sid] = readingOf(sid).slice()).push(Object.assign({ id: uid(), by: me().id, ts: Date.now() }, data));
      const childTeachers = [...new Set(db.classes.filter(c => c.students.includes(sid)).flatMap(classTeachers))];
      if (isTeacher()) notify([sid, ...parentsOf(sid)], `${me().name} added to ${user(sid).name.split(' ')[0]}'s reading record`, { page: 'reading', studentId: sid });
      else if (isParent()) notify(childTeachers, `${me().name} added to ${user(sid).name.split(' ')[0]}'s reading record`, { page: 'reading', studentId: sid });
    }
    saveDB(); m.remove(); render(); toast(existing ? 'Entry saved' : 'Reading added 📖');
  };
  m.querySelector('#re-book').focus();
}

/* ---------- behaviour points (ClassDojo-style) ---------- */
const classBehaviours = c => c.behaviours && c.behaviours.length ? c.behaviours : DEFAULT_BEHAVIOURS;
const pointsFor = (cid, sid) => db.points.filter(p => p.classId === cid && p.studentId === sid).reduce((n, p) => n + p.points, 0);
const classTotal = c => c.students.reduce((n, s) => n + pointsFor(c.id, s), 0);
function givePoints(c, sids, beh) {
  const ts = Date.now();
  sids.forEach(sid => {
    db.points.push({ id: uid(), classId: c.id, studentId: sid, behId: beh.id, label: beh.label, emoji: beh.emoji, points: beh.points, by: db.session, ts });
    notify([sid, ...parentsOf(sid)], `${beh.emoji} ${beh.points > 0 ? '+' + beh.points : beh.points} — ${beh.label} (${c.name})`, { page: 'class', classId: c.id, tab: 'points' });
  });
  saveDB();
}

    scopeClasses = db.classes.filter(c => c.students.includes(sid));
  }
  const s = user(sid);
  const groups = scopeClasses.map(c => {
    const aids = db.assignments.filter(a => a.classId === c.id).map(a => a.id);
    return { c, items: db.items.filter(i => i.star && i.studentId === sid && aids.includes(i.assignmentId)) };
  }).filter(g => g.items.length);
  const total = groups.reduce((n, g) => n + g.items.length, 0);
  main.innerHTML = `
    <div class="page-head">
      <span class="avatar" style="width:46px;height:46px">${initials(s.name)}</span>
      <h2>${sid === db.session ? 'My portfolio' : esc(s.name.split(' ')[0]) + "'s portfolio"}</h2>
      <span class="chip brand">${ic('i-star')} ${total} piece${total === 1 ? '' : 's'}</span>
      <span class="spacer"></span>${picker}
    </div>
    <p class="page-sub">Best work from ${isTeacher() ? 'every class you share with them' : 'all ' + (isParent() ? 'their' : 'your') + ' classes'} — press the star on any piece of work to add it.</p>
    ${groups.map(g => `
      <h3 style="margin:20px 0 12px">${ic('i-class')} ${esc(g.c.name)}${g.c.archived ? ` <span class="chip red">${ic('i-archive')} archived</span>` : ''}</h3>
      ${portfolioGrid(g.items)}`).join('')
      || `<div class="card empty">${ic('i-star', 'big')}Nothing starred yet — the portfolio fills up as great work gets a star.</div>`}`;
  const sel = $('#pfp-sel');
  if (sel) sel.onchange = () => go({ studentId: sel.value });
  wirePortfolioGrid();
}
