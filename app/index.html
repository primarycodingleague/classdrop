/* ---------- gradebook ---------- */
/* ---------- markbook (teacher-authored assessment grid, SIMS-style) ---------- */
function mkGet(col, sid) {
  if (col.type === 'mark' && col.linkTask) { const g = gradeOf(col.linkTask, sid); return g ? String(g.score) : ''; }
  const m = db.marks[col.id + '_' + sid]; return m ? String(m.value) : '';
}
function mkSet(col, sid, value) {
  if (value === '' || value == null) delete db.marks[col.id + '_' + sid];
  else db.marks[col.id + '_' + sid] = { value, ts: Date.now() };
  saveDB();
}
function mkPct(col, sid) {
  if (col.type !== 'mark' || !col.max) return null;
  const v = mkGet(col, sid); if (v === '') return null;
  const n = parseFloat(v); return isNaN(n) ? null : Math.max(0, Math.min(100, n / col.max * 100));
}
function colHint(c, col) {
  if (col.type === 'mark') return (col.linkTask ? ic('i-task') + ' task · ' : '') + '/ ' + col.max;
  if (col.type === 'comment') return 'note';
  return esc(scaleNameOf(c, col));
}

function commentCellInner(v) {
  if (!v) return `<span class="mb-cadd">＋ comment</span>`;
  return esc(v.length > 60 ? v.slice(0, 60) + '…' : v);
}
function commentSubst(text, sid) {
  const s = user(sid);
  return String(text).replace(/\{first\}/g, s.name.split(' ')[0]).replace(/\{name\}/g, s.name);
}
function openCommentEditor(col, sid, onDone) {
  const cur = mkGet(col, sid);
  const first = user(sid).name.split(' ')[0];
  const m = openModal(`
    <h3>${ic('i-note')} ${esc(col.name)}</h3>
    <p class="m-sub">${esc(user(sid).name)}</p>
    <textarea id="cm-text" style="min-height:150px" placeholder="Write ${esc(first)}'s comment…">${esc(cur)}</textarea>
    <div class="cm-count" id="cm-count"></div>
    <button class="c-toggle" id="cm-bank-toggle" style="margin-top:8px">${ic('i-note')} Comment bank — tap a phrase to insert</button>
    <div id="cm-bank" style="display:none">
      <div class="cb-chips" id="cm-bank-list"></div>
      <button class="btn sec small" id="cm-bank-add" style="margin-top:8px">${ic('i-plus')} Save current comment to the bank</button>
      <div class="small muted" style="margin-top:6px">Tip: type <b>{first}</b> in a saved phrase and it becomes the pupil's name when inserted.</div>
    </div>
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-tick')} Save comment</button>
    </div>`);
  m.querySelector('.modal').classList.add('wide');
  const ta = m.querySelector('#cm-text'), count = m.querySelector('#cm-count');
  const upd = () => count.textContent = ta.value.trim().length + ' characters';
  ta.addEventListener('input', upd); upd(); ta.focus();
  // comment bank
  const school = mySchool();
  const renderBank = () => {
    const bank = school.commentBank || [];
    m.querySelector('#cm-bank-list').innerHTML = bank.length ? bank.map(b => `
      <div class="cb-chip" data-cb="${b.id}"><span>${esc(commentSubst(b.text, sid))}</span>
        <button class="cb-del" data-cbdel="${b.id}" title="Remove from bank">${ic('i-x')}</button></div>`).join('')
      : `<div class="small muted">No saved phrases yet — write a comment and save it to reuse it.</div>`;
    m.querySelectorAll('[data-cb]').forEach(ch => ch.onclick = e => {
      if (e.target.closest('[data-cbdel]')) return;
      const b = bank.find(x => x.id === ch.dataset.cb);
      const ins = commentSubst(b.text, sid);
      ta.value = ta.value.trim() ? ta.value.replace(/\s*$/, '') + ' ' + ins : ins;
      upd(); ta.focus();
    });
    m.querySelectorAll('[data-cbdel]').forEach(b => b.onclick = () => {
      school.commentBank = (school.commentBank || []).filter(x => x.id !== b.dataset.cbdel); saveDB(); renderBank();
    });
  };
  renderBank();
  m.querySelector('#cm-bank-toggle').onclick = () => {
    const el = m.querySelector('#cm-bank');
    el.style.display = el.style.display === 'none' ? '' : 'none';
  };
  m.querySelector('#cm-bank-add').onclick = () => {
    const t = ta.value.trim();
    if (!t) { toast('Write a comment first', true); return; }
    // store with the pupil's first name turned back into {first} so it's reusable
    const templated = first ? t.split(first).join('{first}') : t;
    (school.commentBank = school.commentBank || []).push({ id: uid(), text: templated });
    saveDB(); renderBank(); toast('Saved to the comment bank');
  };
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('[data-go]').onclick = () => { mkSet(col, sid, ta.value.trim()); m.remove(); onDone(); toast('Comment saved'); };
}

function renderMarkbook(body, c) {
  const cols = c.markCols || [];
  const students = c.students;
  const avg = arr => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) + '%' : '—';

  const cellHTML = (col, sid) => {
    const v = mkGet(col, sid);
    if (col.type === 'mark' && col.linkTask)
      return `<td class="mb-cell linked" title="Pulled from the linked task's grade">${v === '' ? '–' : esc(v) + '/' + col.max}</td>`;
    if (col.type === 'mark')
      return `<td class="mb-cell"><input type="number" min="0" max="${col.max}" step="any" data-mk="${col.id}|${sid}" value="${esc(v)}"></td>`;
    if (col.type === 'comment')
      return `<td class="mb-cell mb-commentcell" data-comment="${col.id}|${sid}" title="Click to write a comment">${commentCellInner(v)}</td>`;
    // grade dropdown
    const opts = resolveScaleOpts(c, col);
    return `<td class="mb-cell"><select data-mk="${col.id}|${sid}">
      <option value="">–</option>
      ${opts.map(o => `<option value="${esc(o.code)}" ${o.code === v ? 'selected' : ''}>${esc(o.code)}</option>`).join('')}
    </select></td>`;
  };

  body.innerHTML = `
    <div class="mb-actions">
      <button class="btn" id="mb-add">${ic('i-plus')} Add column</button>
      <button class="btn sec small" id="mb-csv">${ic('i-clip')} Export CSV</button>
      ${(schoolOf(c).reportTemplates || []).length ? `<button class="btn sec small" id="mb-report">${ic('i-report')} Generate reports</button>` : ''}
      <span class="small muted">Type marks straight into the grid. Link a column to a task to pull its grade automatically.</span>
    </div>
    ${cols.length ? `<div class="mb-wrap"><table class="mb">
      <thead><tr>
        <th class="mb-corner">Student</th>
        ${cols.map(col => `<th class="mb-col">
          ${col.group ? `<span class="mb-grp">${esc(col.group)}</span>` : ''}
          <span class="mb-cn" data-editcol="${col.id}">${esc(col.name)}</span>
          <span class="mb-cmeta">${colHint(c, col)}<button class="mb-colbtn" data-delcol="${col.id}" title="Delete column">${ic('i-x')}</button></span>
        </th>`).join('')}
        <th class="mb-total">Avg</th>
      </tr></thead>
      <tbody>
        ${students.map(sid => `<tr>
          <td class="mb-name">${esc(user(sid).name)}</td>
          ${cols.map(col => cellHTML(col, sid)).join('')}
          <td class="mb-total" data-avg="${sid}"></td>
        </tr>`).join('') || `<tr><td class="mb-name">—</td>${cols.map(() => '<td></td>').join('')}<td></td></tr>`}
      </tbody>
      <tfoot><tr>
        <td class="mb-name">Class average</td>
        ${cols.map(col => `<td class="mb-cell" data-foot="${col.id}"></td>`).join('')}
        <td class="mb-total"></td>
      </tr></tfoot>
    </table></div>`
      : `<div class="card empty">${ic('i-markbook', 'big')}No columns yet — add your first assessment column to start your markbook.</div>`}`;

  // live recalc of averages
  const recalc = () => {
    students.forEach(sid => {
      const el = body.querySelector(`[data-avg="${sid}"]`);
      if (el) el.textContent = avg(cols.map(col => mkPct(col, sid)).filter(v => v != null));
    });
    cols.forEach(col => {
      const el = body.querySelector(`[data-foot="${col.id}"]`);
      if (!el) return;
      el.textContent = col.type === 'mark' ? avg(students.map(sid => mkPct(col, sid)).filter(v => v != null)) : '';
    });
  };
  const styleGrade = el => {
    const col = cols.find(x => x.id === el.dataset.mk.split('|')[0]);
    const opt = col && col.type !== 'mark' && col.type !== 'comment' ? resolveScaleOpts(c, col).find(o => o.code === el.value) : null;
    if (opt) { el.style.background = opt.bg; el.style.color = opt.color; el.style.fontWeight = 800; }
    else { el.style.background = ''; el.style.color = ''; el.style.fontWeight = ''; }
  };

  body.querySelectorAll('[data-mk]').forEach(el => {
    if (el.tagName === 'SELECT') styleGrade(el);
    const save = () => {
      const [cid, sid] = el.dataset.mk.split('|');
      const col = cols.find(x => x.id === cid);
      mkSet(col, sid, el.value.trim());
      if (el.tagName === 'SELECT') styleGrade(el);
      recalc();
    };
    el.addEventListener('change', save);
    if (el.type === 'text' || el.type === 'number') el.addEventListener('input', save);
  });
  // comment cells open a proper writing window
  body.querySelectorAll('[data-comment]').forEach(td => td.onclick = () => {
    const [cid, sid] = td.dataset.comment.split('|');
    const col = cols.find(x => x.id === cid);
    openCommentEditor(col, sid, () => { td.innerHTML = commentCellInner(mkGet(col, sid)); });
  });
  recalc();

  $('#mb-add').onclick = () => openMarkCol(c, null);
  body.querySelectorAll('[data-editcol]').forEach(b => b.onclick = () =>
    openMarkCol(c, cols.find(x => x.id === b.dataset.editcol)));
  body.querySelectorAll('[data-delcol]').forEach(b => b.onclick = () => {
    const col = cols.find(x => x.id === b.dataset.delcol);
    openConfirm(`Delete “${col.name}”?`, 'The column and its marks are removed. Linked task grades are not affected.', () => {
      c.markCols = cols.filter(x => x.id !== col.id);
      Object.keys(db.marks).forEach(k => { if (k.startsWith(col.id + '_')) delete db.marks[k]; });
      saveDB(); render(); toast('Column deleted');
    });
  });
  $('#mb-csv').onclick = () => {
    const head = ['Student', ...cols.map(col => col.name + (col.group ? ` (${col.group})` : ''))];
    const rows = [head, ...students.map(sid => [user(sid).name, ...cols.map(col => mkGet(col, sid))])];
    const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = c.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '-markbook.csv';
    a.click();
    toast('Markbook exported');
  };
  const rb = $('#mb-report');
  if (rb) rb.onclick = () => {
    const temps = schoolOf(c).reportTemplates || [];
    if (temps.length === 1) { openReportRun(temps[0], c); return; }
    const m = openModal(`
      <h3>${ic('i-report')} Generate reports</h3>
      <p class="m-sub">Pick a report template — it fills in from this class's markbook.</p>
      <label>Template</label><select id="mrp-t">${temps.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
      <div class="m-actions"><button class="btn ghost" data-x>Cancel</button><button class="btn" data-go>${ic('i-print')} Generate</button></div>`);
    m.querySelector('[data-x]').onclick = () => m.remove();
    m.querySelector('[data-go]').onclick = () => { const t = temps.find(x => x.id === m.querySelector('#mrp-t').value); m.remove(); openReportRun(t, c); };
  };
}

function openMarkCol(c, existing) {
  const gradedTasks = db.assignments.filter(a => a.classId === c.id && a.outOf && !a.archived);
  const m = openModal(`
    <h3>${ic('i-markbook')} ${existing ? 'Edit column' : 'New markbook column'}</h3>
    <div class="form-2col">
      <div><label>Name</label><input id="mc-name" maxlength="40" placeholder="e.g. Algorithms" value="${existing ? esc(existing.name) : ''}"></div>
      <div><label>Group / term (optional)</label><input id="mc-grp" maxlength="24" placeholder="e.g. Autumn 1" value="${existing && existing.group ? esc(existing.group) : ''}"></div>
    </div>
    <label>What are you recording?</label>
    <select id="mc-type">
      <option value="grade" ${!existing || existing.type === 'grade' ? 'selected' : ''}>A grade (from a scale)</option>
      <option value="mark" ${existing && existing.type === 'mark' ? 'selected' : ''}>A mark out of a number</option>
      <option value="comment" ${existing && existing.type === 'comment' ? 'selected' : ''}>A short comment</option>
    </select>
    <div id="mc-grade-wrap">
      <label>Grade scale <span class="muted small" style="font-weight:600">— your school's scales</span></label>
      <select id="mc-scale">
        ${SCALE_KINDS.map(([k, kl]) => {
          const list = schoolScales(c.schoolId).filter(s => (s.kind || 'other') === k);
          return list.length ? `<optgroup label="${kl}">${list.map(s => `<option value="${s.id}" ${(existing && (existing.scaleId || existing.scale) === s.id) ? 'selected' : ''}>${esc(s.name)} (${s.opts.map(o => o.code).join(' / ')})</option>`).join('')}</optgroup>` : '';
        }).join('')}
        <option value="custom" ${existing && (existing.scaleId || existing.scale) === 'custom' ? 'selected' : ''}>Custom (just this column)…</option>
      </select>
      <div id="mc-custom-wrap" style="display:none"><label>Custom grades (comma-separated)</label>
        <input id="mc-custom" placeholder="e.g. Bronze, Silver, Gold" value="${existing && existing.customOpts ? esc(existing.customOpts.map(o => o.code).join(', ')) : ''}"></div>
      <div class="small muted" style="margin-top:6px">Need a different scale? The school office adds them under <b>Grades &amp; levels</b>.</div>
    </div>
    <div id="mc-mark-wrap" style="display:none">
      <div class="form-2col">
        <div><label>Out of</label><input id="mc-max" type="number" min="1" max="1000" value="${existing && existing.max ? existing.max : 10}"></div>
        <div><label>Link to a graded task (optional)</label>
          <select id="mc-link"><option value="">Enter marks by hand</option>
            ${gradedTasks.map(a => `<option value="${a.id}" ${existing && existing.linkTask === a.id ? 'selected' : ''}>${esc(a.title)} (/${a.outOf})</option>`).join('')}
          </select></div>
      </div>
      <div class="small muted" style="margin-top:6px">Linked columns fill in automatically from that task's grades — no typing.</div>
    </div>
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-tick')} ${existing ? 'Save' : 'Add column'}</button>
    </div>`);
  const typeSel = m.querySelector('#mc-type'), scaleSel = m.querySelector('#mc-scale');
  const sync = () => {
    m.querySelector('#mc-grade-wrap').style.display = typeSel.value === 'grade' ? '' : 'none';
    m.querySelector('#mc-mark-wrap').style.display = typeSel.value === 'mark' ? '' : 'none';
    m.querySelector('#mc-custom-wrap').style.display = typeSel.value === 'grade' && scaleSel.value === 'custom' ? '' : 'none';
  };
  typeSel.onchange = sync; scaleSel.onchange = sync; sync();
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('[data-go]').onclick = () => {
    const name = m.querySelector('#mc-name').value.trim();
    if (!name) { toast('Give the column a name', true); return; }
    const type = typeSel.value;
    const col = existing || { id: uid() };
    col.name = name;
    col.group = m.querySelector('#mc-grp').value.trim();
    col.type = type;
    delete col.max; delete col.linkTask; delete col.scale; delete col.scaleId; delete col.customOpts;
    if (type === 'mark') {
      col.max = Math.max(1, +m.querySelector('#mc-max').value || 10);
      col.linkTask = m.querySelector('#mc-link').value || null;
    } else if (type === 'grade') {
      col.scaleId = scaleSel.value;
      if (col.scaleId === 'custom') {
        const codes = m.querySelector('#mc-custom').value.split(',').map(x => x.trim()).filter(Boolean);
        if (!codes.length) { toast('Type at least one custom grade', true); return; }
        col.customOpts = codes.map((code, i) => ({ code, label: code, color: CUSTOM_PALETTE[i % 6][0], bg: CUSTOM_PALETTE[i % 6][1] }));
      }
    }
    if (!existing) (c.markCols = c.markCols || []).push(col);
    saveDB(); m.remove(); render();
    toast(existing ? 'Column updated' : 'Column added');
  };
  m.querySelector('#mc-name').focus();
}

function renderGradebook(body, c) {
  const assigns = db.assignments.filter(a => a.classId === c.id && !a.archived).sort((a, b) => a.createdAt - b.createdAt);
  if (!assigns.length) { body.innerHTML = `<div class="card empty">${ic('i-grade', 'big')}Set some tasks first — grades show up here.</div>`; return; }
  const head = assigns.map(a => `<th title="${esc(a.title)}">${esc(a.title.length > 18 ? a.title.slice(0, 17) + '…' : a.title)}${a.outOf ? `<br><span style="font-weight:600">/ ${a.outOf}</span>` : ''}</th>`).join('');
  const rows = c.students.map(sid => {
    const s = user(sid);
    const cells = assigns.map(a => {
      const g = gradeOf(a.id, sid);
      if (g && a.outOf != null) return `<td class="gb-cell" data-gb="${a.id}_${sid}" style="cursor:pointer" title="Open folder"><span style="color:var(--green)">${g.score}</span></td>`;
      const h = handin(a.id, sid).status;
      const chip = h === 'reviewed' ? `<span class="chip green">${ic('i-tick')}</span>` : h === 'in' ? `<span class="chip amber">in</span>` : `<span class="chip grey">—</span>`;
      return `<td class="gb-cell" data-gb="${a.id}_${sid}" style="cursor:pointer" title="Open folder">${chip}</td>`;
    }).join('');
    const graded = assigns.filter(a => a.outOf != null && gradeOf(a.id, sid));
    const pct = graded.length ? Math.round(100 * graded.reduce((t, a) => t + gradeOf(a.id, sid).score, 0) / graded.reduce((t, a) => t + a.outOf, 0)) : null;
    return `<tr><td><b>${esc(s.name)}</b></td>${cells}<td class="gb-cell">${pct == null ? '<span class="muted">—</span>' : pct + '%'}</td></tr>`;
  }).join('');
  body.innerHTML = `
    <p class="small muted" style="margin:0 0 12px">Tap any cell to open that student's folder. Grades are set inside the folder (tasks need “points” switched on).</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Student</th>${head}<th>Overall</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  document.querySelectorAll('[data-gb]').forEach(td => td.onclick = () => {
    const [aid, sid] = td.dataset.gb.split('_');
    go({ page: 'folder', assignmentId: aid, studentId: sid });
  });
}

/* ---------- discussions ---------- */
function renderDiscussionList(body, c) {
  const teacherView = isTeacher();
  const list = db.discussions.filter(d => d.classId === c.id).sort((a, b) => {
    const la = a.posts.length ? a.posts[a.posts.length - 1].ts : a.ts;
    const lb = b.posts.length ? b.posts[b.posts.length - 1].ts : b.ts;
    return lb - la;
  });
  body.innerHTML = `
    ${teacherView && !c.archived ? `<div style="margin-bottom:14px"><button class="btn" id="btn-newdisc">${ic('i-plus')} New discussion</button></div>` : ''}
    ${list.map(d => {
      const last = d.posts[d.posts.length - 1];
      return `
      <button class="disc-card" data-disc="${d.id}">
        <span class="assign-ico">${d.locked ? ic('i-lock') : ic('i-chat')}</span>
        <span class="assign-body"><b>${esc(d.title)}</b>
          <small>${last ? esc(user(last.authorId).name.split(' ')[0]) + ': ' + esc(last.text.slice(0, 60)) : 'no posts yet'}</small></span>
        <span class="assign-side"><span class="chip brand">${d.posts.length} post${d.posts.length === 1 ? '' : 's'}</span>
          ${d.locked ? `<span class="chip red">${ic('i-lock')} locked</span>` : ''}</span>
      </button>`;
    }).join('') || `<div class="card empty">${ic('i-chat', 'big')}No discussions yet${teacherView ? ' — start one!' : '.'}</div>`}`;
  const nd = $('#btn-newdisc');
  if (nd) nd.onclick = () => openPrompt('New discussion', 'Give the discussion a topic — the whole class can post in it.', 'e.g. Maze game help & tips', title => {
    const d = { id: uid(), classId: c.id, title, authorId: db.session, ts: Date.now(), locked: false, posts: [] };
    db.discussions.push(d);
    notify(c.students, `New discussion in ${c.name}: “${title}”`, { page: 'discussion', classId: c.id, discussionId: d.id });
    saveDB(); go({ page: 'discussion', discussionId: d.id });
  });
  document.querySelectorAll('[data-disc]').forEach(b => b.onclick = () =>
    go({ page: 'discussion', discussionId: b.dataset.disc }));
}

function renderDiscussionThread(main) {
  const d = db.discussions.find(x => x.id === view.discussionId);
  if (!d) { go({ page: 'class', tab: 'discussions' }); return; }
  const c = klass(d.classId);
  const teacherView = isTeacher();
  const canPost = !isParent() && !d.locked || teacherView;
  main.innerHTML = `
    <button class="crumb" id="crumb">${ic('i-back')} ${esc(c.name)} · Discussions</button>
    <div class="page-head"><h2>${esc(d.title)}</h2><span class="spacer"></span>
      ${teacherView ? `<button class="btn sec small" id="btn-dlock">${d.locked ? ic('i-unlock') + ' Unlock' : ic('i-lock') + ' Lock'}</button>
        <button class="btn danger small" id="btn-ddel">${ic('i-trash')}</button>` : ''}</div>
    ${d.locked ? `<p class="page-sub">${ic('i-lock')} This discussion is locked — only the teacher can post.</p>` : ''}
    ${teacherView && moderates(c) ? `<p class="page-sub">${ic('i-shield')} Post-checking is ON for this class — pupils' messages wait for your approval before classmates see them.</p>` : ''}
    <div class="card">
      <div class="msg-thread" id="thread">
        ${d.posts.filter(m => !hiddenFromViewer(m)).map(m => {
          const a = user(m.authorId);
          const mine = m.authorId === db.session;
          const canReport = !isParent() && a.role === 'student' && !mine && !m.pending;
          return `<div style="align-self:${mine ? 'flex-end' : 'flex-start'};max-width:75%" data-post="${m.id}">
            <div class="msg ${mine ? 'mine' : 'theirs'}" style="max-width:100%">${!mine ? `<b style="font-size:.78rem;color:var(--gold-dk)">${esc(a.name)}${a.role === 'teacher' ? ' · teacher' : ''}</b><br>` : ''}${esc(m.text)}<span class="meta">${fmtWhen(m.ts)}</span></div>
            ${pendingBanner(m)}
            ${canReport ? `<button class="mod-btn report" data-report="${m.id}">${ic('i-flag')} Report</button>` : ''}
          </div>`;
        }).join('') || `<div class="empty">${ic('i-chat', 'big')}Nothing here yet — say hello!</div>`}
      </div>
      ${canPost ? `
      <div class="msg-compose">
        <textarea id="msg-in" placeholder="Write a message…"></textarea>
        <button class="btn" id="msg-send">${ic('i-send')} Send</button>
      </div>` : ''}
    </div>`;
  $('#crumb').onclick = () => go({ page: 'class', classId: c.id, tab: 'discussions', discussionId: null });
  const th = $('#thread'); th.scrollTop = th.scrollHeight;
  const send = $('#msg-send');
  if (send) send.onclick = () => {
    const t = $('#msg-in').value.trim();
    if (!t) return;
    const post = Object.assign({ id: uid(), authorId: db.session, text: t, ts: Date.now() }, modStamp(c, t));
    d.posts.push(post);
    if (post.pending) { notify(classTeachers(c), `A message from ${me().name} in “${d.title}” needs approval`, { page: 'discussion', classId: c.id, discussionId: d.id }); toast(post.flagged ? 'Sent — your teacher will check it first' : 'Sent — waiting for your teacher to approve'); }
    else notify([...classTeachers(c), ...c.students], `${me().name} posted in “${d.title}” (${c.name})`, { page: 'discussion', classId: c.id, discussionId: d.id });
    saveDB(); render();
  };
  // moderation actions
  main.querySelectorAll('[data-post]').forEach(box => {
    const m = d.posts.find(x => x.id === box.dataset.post);
    const ok = box.querySelector('[data-modok]'); if (ok) ok.onclick = () => { delete m.pending; delete m.flagged; modLogAdd('approve', `post in “${d.title}”`); saveDB(); render(); toast('Approved'); };
    const no = box.querySelector('[data-modno]'); if (no) no.onclick = () => openConfirm('Remove this message?', 'It will be deleted and the pupil told to try again.', () => { d.posts = d.posts.filter(x => x.id !== m.id); modLogAdd('remove', `post in “${d.title}”`); notify([m.authorId], `A message you posted in “${d.title}” was removed by your teacher`, { page: 'discussion', classId: c.id, discussionId: d.id }); saveDB(); render(); toast('Removed'); });
    const rep = box.querySelector('[data-report]'); if (rep) rep.onclick = () => { m.pending = true; m.flagged = true; m.flagReason = 'Reported by a pupil'; modLogAdd('report', `post in “${d.title}”`); notify(classTeachers(c), `A message in “${d.title}” was reported and needs review`, { page: 'discussion', classId: c.id, discussionId: d.id }); saveDB(); render(); toast('Reported to your teacher — thank you'); };
  });
  const bl = $('#btn-dlock');
  if (bl) bl.onclick = () => { d.locked = !d.locked; saveDB(); render(); toast(d.locked ? 'Discussion locked' : 'Discussion unlocked'); };
  const bd = $('#btn-ddel');
  if (bd) bd.onclick = () => openConfirm('Delete this discussion?', 'All its posts will be removed.', () => {
    db.discussions = db.discussions.filter(x => x.id !== d.id);
    saveDB(); go({ page: 'class', tab: 'discussions', discussionId: null }); toast('Discussion deleted');
  });
}

/* ---------- teacher: assignment (folder grid) ---------- */
function renderAssignment(main) {
  const a = assignment(view.assignmentId);
  if (!a) { go({ page: 'dash' }); return; }
  const c = klass(a.classId);
  const sharedCount = folderItems(a.id, SHARED).length;
  const cards = `
    <button class="fcard shared" data-folder="${SHARED}">
      <span class="avatar">${ic('i-people')}</span>
      <b>Shared folder</b>
      <span class="chip brand">${sharedCount} item${sharedCount === 1 ? '' : 's'}</span>
    </button>` + c.students.map(sid => {
    const s = user(sid);
    const g = gradeOf(a.id, sid);
    return `
    <button class="fcard" data-folder="${sid}">
      <span class="avatar">${initials(s.name)}</span>
      <b>${esc(s.name)}</b>
      ${g && a.outOf ? `<span class="chip green">${ic('i-grade')} ${g.score}/${a.outOf}</span>` : statusChip(a.id, sid)}
    </button>`;
  }).join('');
  main.innerHTML = `
    <button class="crumb" id="crumb">${ic('i-back')} ${esc(c.name)}</button>
    <div class="page-head"><h2>${esc(a.title)}</h2><span class="spacer"></span>
      <button class="btn ghost small" id="btn-edit">${ic('i-pencil')} Edit</button>
      <button class="btn ghost small" id="btn-copy">${ic('i-copy')} Reuse…</button>
      ${feat('staffshare') ? `<button class="btn ghost small" id="btn-share" title="Put a copy in the staff library so colleagues can use it">${ic('i-teacher')} ${db.taskLibrary.some(t => t.sourceId === a.id) ? 'Shared with staff' : 'Share with staff'}</button>` : ''}
      <button class="btn ghost small" id="btn-arch">${ic('i-archive')} ${a.archived ? 'Restore' : 'Archive'}</button>
      <button class="btn sec small" id="btn-lock">${a.locked ? ic('i-unlock') + ' Unlock' : ic('i-lock') + ' Lock'}</button>
      <button class="btn danger small" id="btn-del">${ic('i-trash')}</button></div>
    <p class="page-sub">${schedChip(a)} ${dueChip(a)}
      ${a.outOf ? `<span class="chip blue">${ic('i-grade')} graded out of ${a.outOf}</span>` : ''}
      ${a.autoLock ? `<span class="chip grey">${ic('i-lock')} auto-locks when due</span>` : ''}
      ${effLocked(a) ? `<span class="chip red">${ic('i-lock')} locked — students can look but not add</span>` : ''}
      ${a.archived ? `<span class="chip red">${ic('i-archive')} archived — hidden from students</span>` : ''}</p>
    <div class="card" style="margin-bottom:18px">
      <h3>${ic('i-note')} Instructions</h3>
      <div class="w-body">${esc(a.instructions || '—')}</div>
      ${renderAttachments(a, at => at.kind === 'canvas'
        ? `<button class="btn ghost small" data-att-open="${a.attachments.indexOf(at)}">${ic('i-eye')} Open</button>` : '')}
    </div>
    <h3 style="margin:0 0 12px">Folders</h3>
    ${c.students.length ? `<div class="folder-grid">${cards}</div>`
      : `<div class="card empty">${ic('i-people', 'big')}No students in this class yet — share the join code <b>${c.code}</b> and their folders will appear here.</div>`}`;
  $('#crumb').onclick = () => go({ page: 'class', classId: c.id, tab: 'tasks', assignmentId: null });
  $('#btn-edit').onclick = () => openTaskModal(c.id, a);
  $('#btn-copy').onclick = () => openReuseTask(a);
  const shb = $('#btn-share'); if (shb) shb.onclick = () => shareTaskWithStaff(a);
  $('#btn-arch').onclick = () => { a.archived = !a.archived; saveDB(); render(); toast(a.archived ? 'Task archived' : 'Task restored'); };
  $('#btn-lock').onclick = () => { a.locked = !a.locked; saveDB(); render(); toast(a.locked ? 'Task locked' : 'Task unlocked'); };
  $('#btn-del').onclick = () => openConfirm('Delete this task?', 'The task and all student work in it will be removed. This cannot be undone.', () => {
    db.assignments = db.assignments.filter(x => x.id !== a.id);
    db.items = db.items.filter(i => i.assignmentId !== a.id);
    Object.keys(db.handins).forEach(k => { if (k.startsWith(a.id + '_')) delete db.handins[k]; });
    Object.keys(db.grades).forEach(k => { if (k.startsWith(a.id + '_')) delete db.grades[k]; });
    saveDB(); go({ page: 'class', tab: 'tasks', assignmentId: null }); toast('Task deleted');
  });
  document.querySelectorAll('[data-folder]').forEach(b => b.onclick = () =>
    go({ page: 'folder', studentId: b.dataset.folder }));
  document.querySelectorAll('[data-att-open]').forEach(b => b.onclick = () => {
    const at = a.attachments[+b.dataset.attOpen];
    openCanvasEditor({ name: at.name, canvas: at.canvas }, { readOnly: true });
  });
}

/* attachments on a task — actions(at, idx) returns extra button HTML per attachment */
function renderAttachments(a, actions) {
  if (!a.attachments || !a.attachments.length) return '';
  return `<div class="mt">` + a.attachments.map((at, idx) => {
    let body;
    if (at.kind === 'canvas') body = `<span class="w-canvas"><img class="w-img" src="${at.data}" alt="${esc(at.name)}">
      <span class="cv-badge">${ic('i-canvas')} ${esc(at.name)}${at.canvas && at.canvas.pages && at.canvas.pages.length > 1 ? ' · ' + at.canvas.pages.length + ' pages' : ''}</span></span>`;
    else if (at.type && at.type.startsWith('image/')) body = `<img class="w-img" src="${at.data}" alt="${esc(at.name)}">`;
    else if (at.type && at.type.startsWith('video/')) body = `<video class="w-vid" controls playsinline src="${mediaURL(at)}"></video>`;
    else body = `<a class="w-file" download="${esc(at.name)}" href="${at.data}">${ic('i-clip')}<span>${esc(at.name)}</span></a>`;
    const acts = actions ? actions(at, idx) : '';
    return `<div class="att-card">${body}${acts ? `<div class="att-actions">${acts}</div>` : ''}</div>`;
  }).join('') + `</div>`;
}

/* ---------- the folder (student work + feedback, or the shared folder) ---------- */
function renderFolder(main) {
  const a = assignment(view.assignmentId);
  const sid = view.studentId;
  if (!a || !sid) { go({ page: 'dash' }); return; }
  const shared = sid === SHARED;
  const s = shared ? { name: 'Shared folder', role: 'student' } : user(sid);
  const c = klass(a.classId);
  const teacherView = isTeacher();
  if (!teacherView && !isLive(a)) { go({ page: 'dash', assignmentId: null, studentId: null }); return; } // scheduled = hidden
  const parentView = isParent();
  const mine = sid === db.session;
  const h = handin(a.id, sid);
  const g = gradeOf(a.id, sid);
  const locked = effLocked(a);

  const items = folderItems(a.id, sid);
  const workItems = items.filter(i => i.kind !== 'sticker');
  const stickers = items.filter(i => i.kind === 'sticker');
  const stickerHTML = stickers.length ? `<div class="sticker-row">${stickers.map(st => renderSticker(st)).join('')}</div>` : '';

  const canPost = !parentView && !shared && (teacherView || (mine && !locked))
    || (shared && !parentView && (teacherView || (a.sharedPosting && !locked && c.students.includes(db.session))));
  const canComment = !parentView;

  const workHTML = workItems.filter(i => !hiddenFromViewer(i)).map(i => renderWorkItem(i, a, { teacherView, canComment, shared, c })).join('');

  // banners
  let banner = '';
  if (!shared && mine) {
    if (h.status === 'none') {
      banner = `<div class="handin-bar">${ic('i-inbox')} When your work is ready, hand it in so ${esc(user(c.teacher).name)} knows.
        <span class="spacer"></span><button class="btn" id="btn-handin" ${locked ? 'disabled' : ''}>${ic('i-send')} Hand in</button></div>`;
    } else if (h.status === 'in') {
      banner = `<div class="handin-bar">${ic('i-tick')} Handed in ${fmtWhen(h.ts)} — waiting for feedback.
        <span class="spacer"></span><button class="btn ghost small" id="btn-unhand" ${locked ? 'disabled' : ''}>Take back</button></div>`;
    } else {
      banner = `<div class="handin-bar done">${ic('i-star')} Reviewed by your teacher${g && a.outOf ? ` — you got <span class="grade-chip" style="margin-left:4px">${g.score} / ${a.outOf}</span>` : ' — check the feedback below!'}</div>`;
    }
  } else if (!shared && teacherView) {
    const gradeBox = a.outOf ? `
      <span class="grade-box">${ic('i-grade')} <input type="number" id="grade-in" min="0" max="${a.outOf}" value="${g ? g.score : ''}" placeholder="–"> / ${a.outOf}
      <button class="btn small sec" id="grade-save">Save</button></span>` : '';
    if (h.status === 'in') {
      banner = `<div class="handin-bar">${ic('i-inbox')} ${esc(s.name)} handed this in ${fmtWhen(h.ts)}.
        <span class="spacer"></span>${gradeBox}<button class="btn" id="btn-review">${ic('i-tick')} Mark as reviewed</button></div>`;
    } else if (h.status === 'reviewed') {
      banner = `<div class="handin-bar done">${ic('i-tick')} Reviewed.
        <span class="spacer"></span>${gradeBox}<button class="btn ghost small" id="btn-unreview">Reopen</button></div>`;
    } else if (a.outOf) {
      banner = `<div class="handin-bar">${ic('i-grade')} Not handed in yet.<span class="spacer"></span>${gradeBox}</div>`;
    }
  } else if (!shared && parentView) {
    banner = h.status === 'none'
      ? `<div class="handin-bar">${ic('i-inbox')} Not handed in yet.</div>`
      : h.status === 'in'
        ? `<div class="handin-bar">${ic('i-tick')} Handed in ${fmtWhen(h.ts)} — waiting for feedback.</div>`
        : `<div class="handin-bar done">${ic('i-star')} Reviewed${g && a.outOf ? ` — grade: ${g.score} / ${a.outOf}` : ''}.</div>`;
  }

  const composer = canPost ? `
    <div class="composer mt">
      <h4>${teacherView ? (shared ? 'Post to the whole class' : 'Add feedback') : (shared ? 'Post to the shared folder' : 'Add your work')}</h4>
      <div id="rec-holder"></div>
      <div class="comp-tools">
        <button class="btn sec small" id="t-camera">${ic('i-camera')} Camera</button>
        <button class="btn sec small" id="t-file">${ic('i-clip')} File</button>
        <button class="btn sec small" id="t-canvas">${ic('i-canvas')} Canvas</button>
        <button class="btn sec small" id="t-voice">${ic('i-mic')} Voice note</button>
        <button class="btn sec small" id="t-link">${ic('i-link')} Link</button>
        ${teacherView && !shared ? `<button class="btn sec small" id="t-sticker">${ic('i-star')} Sticker</button>` : ''}
      </div>
      <div class="comp-send">
        <textarea id="post-text" placeholder="${teacherView && !shared ? 'Write a feedback note for ' + esc(s.name) + '…' : 'Write a note…'}"></textarea>
        <button class="btn" id="t-send">${ic('i-send')} Add</button>
      </div>
      <input type="file" id="file-in" class="sr-only" aria-hidden="true">
    </div>` : (!parentView && mine && locked ? `<div class="card empty mt">${ic('i-lock', 'big')}This task is locked — you can look but not add.</div>` : '');

  const sharedBtn = !shared && !teacherView
    ? `<button class="btn ghost small" id="btn-shared">${ic('i-people')} Shared folder</button>` : '';

  main.innerHTML = `
    <button class="crumb" id="crumb">${ic('i-back')} ${teacherView ? esc(a.title) : esc(c.name)}</button>
    <div class="page-head">
      <span class="avatar" style="width:46px;height:46px">${shared ? ic('i-people') : initials(s.name)}</span>
      <h2>${shared ? 'Shared folder' : (mine ? 'My folder' : esc(s.name))}</h2>
      <span class="spacer"></span>${sharedBtn}
      ${shared ? '' : (g && a.outOf ? `<span class="grade-chip">${ic('i-grade')} ${g.score} / ${a.outOf}</span>` : '') + statusChip(a.id, sid)}
    </div>
    <p class="page-sub">${esc(a.title)} · ${esc(c.name)} ${dueChip(a)}${shared ? ' · everyone in the class can see this folder' : ''}</p>
    ${banner}
    <div class="card" style="margin-bottom:16px">
      <h3>${ic('i-note')} Task from ${esc(user(c.teacher).name)}</h3>
      <div class="w-body">${esc(a.instructions || '—')}</div>
      ${renderAttachments(a, (at, idx) => {
        const btns = [];
        if (at.kind === 'canvas') {
          btns.push(`<button class="btn ghost small" data-att-open="${idx}">${ic('i-eye')} Open</button>`);
          if (canPost && !teacherView && !shared) btns.push(`<button class="btn sec small" data-att-copy="${idx}">${ic('i-canvas')} Work on my copy</button>`);
        } else if (((at.type && at.type.startsWith('image/')) || docKind(at.name, at.type)) && canPost && !shared) {
          btns.push(`<button class="btn sec small" data-att-annotate="${idx}">${ic('i-pencil')} Annotate</button>`);
        }
        return btns.join('');
      })}
      ${stickerHTML}
    </div>
    <div class="work-list">
      ${workHTML || `<div class="card empty">${ic('i-folder', 'big')}${shared ? 'Nothing shared yet.' : (mine ? 'Nothing here yet — add your work below.' : 'No work added yet.')}</div>`}
    </div>
    ${composer}`;

  $('#crumb').onclick = () => teacherView
    ? go({ page: 'assignment', studentId: null })
    : go({ page: 'class', classId: c.id, tab: 'tasks', assignmentId: null, studentId: null });
  const sb = $('#btn-shared');
  if (sb) sb.onclick = () => go({ studentId: SHARED });

  // banner actions
  const setStatus = (status) => { db.handins[handinKey(a.id, sid)] = { status, ts: Date.now() }; saveDB(); };
  const bh = $('#btn-handin'); if (bh) bh.onclick = () => {
    setStatus('in');
    notify(classTeachers(c), `${me().name} handed in “${a.title}” (${c.name})`, { page: 'folder', classId: c.id, assignmentId: a.id, studentId: sid });
    saveDB(); render(); toast('Handed in — nice work! 🎉');
  };
  const bu = $('#btn-unhand'); if (bu) bu.onclick = () => { setStatus('none'); render(); };
  const br = $('#btn-review'); if (br) br.onclick = () => {
    setStatus('reviewed');
    notify([sid, ...parentsOf(sid)], `${me().name} reviewed ${user(sid).name.split(' ')[0]}'s “${a.title}”`, { page: 'folder', classId: c.id, assignmentId: a.id, studentId: sid });
    saveDB(); render(); toast('Marked as reviewed');
  };
  const bx = $('#btn-unreview'); if (bx) bx.onclick = () => { setStatus('in'); render(); };
  const gs = $('#grade-save'); if (gs) gs.onclick = () => {
    const v = $('#grade-in').value.trim();
    if (v === '') { delete db.grades[handinKey(a.id, sid)]; saveDB(); render(); return; }
    const n = Math.max(0, Math.min(a.outOf, +v));
    db.grades[handinKey(a.id, sid)] = { score: n, ts: Date.now() };
    notify([sid, ...parentsOf(sid)], `${me().name} graded “${a.title}”: ${n}/${a.outOf}`, { page: 'folder', classId: c.id, assignmentId: a.id, studentId: sid });
    saveDB(); render(); toast(`Grade saved: ${n}/${a.outOf}`);
  };

  wireWorkItems(a, sid, c, { teacherView, canComment });

  // task attachment actions: open a canvas, copy it to work on, or annotate a picture
  document.querySelectorAll('[data-att-open]').forEach(b => b.onclick = () => {
    const at = a.attachments[+b.dataset.attOpen];
    openCanvasEditor({ name: at.name, canvas: at.canvas }, { readOnly: true });
  });
  document.querySelectorAll('[data-att-copy]').forEach(b => b.onclick = () => {
    const at = a.attachments[+b.dataset.attCopy];
    db.items.push({ id: uid(), assignmentId: a.id, studentId: sid, authorId: db.session, kind: 'canvas',
      name: at.name + ' — ' + me().name.split(' ')[0], canvas: JSON.parse(JSON.stringify(at.canvas)), data: at.data,
      ts: Date.now(), comments: [], star: false });
    saveDB(); render(); toast('Copied to your folder — open it to work on it');
  });
  document.querySelectorAll('[data-att-annotate]').forEach(b => b.onclick = () => {
    const at = a.attachments[+b.dataset.attAnnotate];
    const saveAnno = (canvas, preview, title) => {
      db.items.push({ id: uid(), assignmentId: a.id, studentId: sid, authorId: db.session, kind: 'canvas',
        name: title, canvas, data: preview, ts: Date.now(), comments: [], star: false });
      saveDB(); render(); toast('Annotation saved to the folder');
    };
    if (docKind(at.name, at.type)) openDocOnCanvas(at.data, at.name, at.type, { onSave: saveAnno });
    else annotateImageToCanvas(at.data, at.name, saveAnno);
  });

  if (!canPost) return;

  // composer actions
  const addItem = (extra, quiet) => {
    // hold student posts to the peer-visible SHARED folder if the class moderates or language is flagged
    const mod = shared ? modStamp(c, extra.text || '') : {};
    const item = Object.assign({ id: uid(), assignmentId: a.id, studentId: sid, authorId: db.session, ts: Date.now(), comments: [], star: false }, extra, mod);
    db.items.push(item);
    // if it won't fit in this device's storage, drop it now and say so — never
    // show work that would silently vanish on the next reload
    if (!saveDB()) {
      db.items.pop();
      render();
      toast("That was too big to keep on this device — try a shorter recording or a smaller file.", true);
      return;
    }
    if (teacherView && !shared) notify([sid, ...parentsOf(sid)], `${me().name} added ${extra.kind === 'audio' ? 'a voice note' : extra.kind === 'note' ? 'a note' : 'something'} to ${user(sid).name.split(' ')[0]}'s “${a.title}” folder`, { page: 'folder', classId: c.id, assignmentId: a.id, studentId: sid });
    if (item.pending) notify(classTeachers(c), `A shared-folder post from ${me().name} needs approval (${a.title})`, { page: 'folder', classId: c.id, assignmentId: a.id, studentId: SHARED });
    saveDB(); render();

/* one work item card with actions + its own comment thread */
function renderWorkItem(i, a, opts) {
  const au = user(i.authorId);
  let body = '';
  if (i.kind === 'note') body = `<div class="w-body">${esc(i.text)}</div>`;
  if (i.kind === 'file') body = i.type && i.type.startsWith('image/')
    ? `<img class="w-img" data-zoom src="${i.data}" alt="${esc(i.name)}">`
    : i.type && i.type.startsWith('video/')
      ? `<video class="w-vid" controls playsinline src="${mediaURL(i)}"></video>`
      : `<a class="w-file" download="${esc(i.name)}" href="${i.data}">${ic('i-clip')}<span>${esc(i.name)}</span></a>`;
  if (i.kind === 'drawing') body = `<img class="w-img" data-zoom src="${i.data}" alt="drawing">`;
  if (i.kind === 'canvas') {
    const np = i.canvas && i.canvas.pages ? i.canvas.pages.length : 1;
    body = `
    <span class="w-canvas" data-canvas-open="${i.id}">
      <img class="w-img" src="${i.data}" alt="${esc(i.name || 'canvas')}" style="cursor:pointer">
      <span class="cv-badge">${ic('i-canvas')} ${esc(i.name || 'Canvas')}${np > 1 ? ' · ' + np + ' pages' : ''} — tap to open</span>
    </span>`;
  }
  if (i.kind === 'audio') body = `<audio controls src="${mediaURL(i)}"></audio>`;
  if (i.kind === 'link') body = `<a class="w-file" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${ic('i-link')}<span>${esc(i.text || i.url)}</span></a>`;
  const isImage = (i.kind === 'drawing') || (i.kind === 'file' && i.type && i.type.startsWith('image/'));
  const isDoc = i.kind === 'file' && !!docKind(i.name, i.type);
  const canDel = !isParent() && (i.authorId === db.session || opts.teacherView);
  const canStar = feat('portfolios') && i.studentId !== SHARED && (opts.teacherView || i.studentId === db.session);
  const comments = i.comments || [];
  const commentsHTML = comments.map(cm => {
    const cu = user(cm.authorId);
    return `<div class="comment ${cm.authorId === db.session ? 'mine' : ''}">
      <span class="avatar">${initials(cu.name)}</span>
      <span class="c-bub"><b>${esc(cu.name)}${cu.role === 'teacher' ? ' · teacher' : ''}</b>${esc(cm.text)}<div class="muted" style="font-size:.72rem;margin-top:3px">${fmtWhen(cm.ts)}</div></span>
    </div>`;
  }).join('');
  const canReport = opts.shared && !isParent() && au.role === 'student' && i.authorId !== db.session && !i.pending;
  return `
  <div class="work-item ${au.role === 'teacher' ? 'teacher' : ''} ${i.pending ? 'pending' : ''}" data-item="${i.id}">
    <div class="w-head">
      <span class="avatar">${initials(au.name)}</span>
      <span><b>${esc(au.name)}</b>${au.role === 'teacher' ? ` <span class="chip brand" style="font-size:.66rem">teacher</span>` : ''} <small>· ${fmtWhen(i.ts)}${i.name && i.kind === 'file' ? ' · ' + esc(i.name) : ''}</small></span>
      <span class="spacer"></span>
      <span class="w-actions">
        ${canReport ? `<button class="iconbtn" data-report="${i.id}" title="Report to teacher" aria-label="report">${ic('i-flag')}</button>` : ''}
        ${canStar ? `<button class="iconbtn ${i.star ? 'on' : ''}" data-star="${i.id}" title="${i.star ? 'In portfolio — tap to remove' : 'Add to portfolio'}" aria-label="portfolio">${ic(i.star ? 'i-star' : 'i-star-o')}</button>` : (i.star ? `<span class="chip brand">${ic('i-star')} portfolio</span>` : '')}
        ${(isImage || isDoc) && !isParent() && (opts.teacherView || i.studentId === db.session || i.authorId === db.session) ? `<button class="iconbtn" data-annotate="${i.id}" title="${isDoc ? 'Open this document on a canvas to annotate it' : 'Annotate this on a canvas'}" aria-label="annotate">${ic('i-pencil')}</button>` : ''}
        ${canDel ? `<button class="iconbtn" data-del-item="${i.id}" title="Delete" aria-label="Delete">${ic('i-trash')}</button>` : ''}
      </span>
    </div>
    ${body}
    ${pendingBanner(i)}
    <div class="i-comments">
      ${commentsHTML}
      ${opts.canComment ? `
      <div class="c-compose">
        <span class="avatar" style="width:26px;height:26px;font-size:.68rem">${initials(me().name)}</span>
        <input data-cin="${i.id}" placeholder="Comment on this…">
        <button class="iconbtn" data-csend="${i.id}" aria-label="send comment">${ic('i-send')}</button>
      </div>` : ''}
    </div>
  </div>`;
}

function wireWorkItems(a, sid, c, opts) {
  // moderation: approve / remove / report a shared-folder post
  document.querySelectorAll('.work-item[data-item]').forEach(box => {
    const i = db.items.find(x => x.id === box.dataset.item); if (!i) return;
    const ok = box.querySelector('[data-modok]'); if (ok) ok.onclick = () => { delete i.pending; delete i.flagged; modLogAdd('approve', `shared post in “${a.title}”`); saveDB(); render(); toast('Approved'); };
    const no = box.querySelector('[data-modno]'); if (no) no.onclick = () => openConfirm('Remove this post?', 'It will be deleted from the shared folder.', () => { db.items = db.items.filter(x => x.id !== i.id); modLogAdd('remove', `shared post in “${a.title}”`); notify([i.authorId], `A shared-folder post you made in “${a.title}” was removed by your teacher`, { page: 'folder', classId: c.id, assignmentId: a.id, studentId: SHARED }); saveDB(); render(); toast('Removed'); });
    const rep = box.querySelector('[data-report]'); if (rep) rep.onclick = () => { i.pending = true; i.flagged = true; i.flagReason = 'Reported by a pupil'; modLogAdd('report', `shared post in “${a.title}”`); notify(classTeachers(c), `A shared-folder post in “${a.title}” was reported and needs review`, { page: 'folder', classId: c.id, assignmentId: a.id, studentId: SHARED }); saveDB(); render(); toast('Reported to your teacher — thank you'); };
  });
  // delete
  document.querySelectorAll('[data-del-item]').forEach(b => b.onclick = () =>
    openConfirm('Delete this item?', 'It will be removed from the folder.', () => {
      db.items = db.items.filter(i => i.id !== b.dataset.delItem);
      saveDB(); render();
    }));
  // zoom
  document.querySelectorAll('[data-zoom]').forEach(img => img.onclick = () => {
    const sc = document.createElement('div'); sc.className = 'zoom-scrim';
    const z = img.cloneNode(); z.className = 'zoomed'; z.removeAttribute('data-zoom');
    const close = () => { sc.remove(); z.remove(); };
    sc.onclick = close; z.onclick = close;
    document.body.append(sc, z);
  });
  // portfolio star
  document.querySelectorAll('[data-star]').forEach(b => b.onclick = () => {
    const i = db.items.find(x => x.id === b.dataset.star);
    i.star = !i.star;
    if (i.star && isTeacher()) notify([i.studentId, ...parentsOf(i.studentId)], `${me().name} added a piece of ${user(i.studentId).name.split(' ')[0]}'s work to their portfolio ⭐`, { page: 'folder', classId: c.id, assignmentId: a.id, studentId: i.studentId });
    saveDB(); render();
    toast(i.star ? 'Added to portfolio ⭐' : 'Removed from portfolio');
  });
  // open a canvas (author + teacher edit; everyone else views)
  document.querySelectorAll('[data-canvas-open]').forEach(el => el.onclick = () => {
    const i = db.items.find(x => x.id === el.dataset.canvasOpen);
    const canEdit = !isParent() && (isTeacher() || (i.authorId === db.session && !effLocked(a)) || (i.studentId === db.session && !effLocked(a)));
    openCanvasEditor(i, { readOnly: !canEdit,
      onRecording: !canEdit ? null : data => {
        db.items.push({ id: uid(), assignmentId: a.id, studentId: sid, authorId: db.session, kind: 'file',
          name: 'Presentation', type: 'video/webm', data, ts: Date.now(), comments: [], star: false });
        saveDB();
      },
      onSave: (canvas, preview, title) => {
      i.canvas = canvas; i.data = preview; i.name = title;
      if (isTeacher() && i.authorId !== db.session && sid !== SHARED)
        notify([sid, ...parentsOf(sid)], `${me().name} wrote on ${user(sid).name.split(' ')[0]}'s canvas in “${a.title}”`, { page: 'folder', classId: c.id, assignmentId: a.id, studentId: sid });
      saveDB(); render(); toast('Canvas saved');
    } });
  });
  // annotate an image or document on a canvas (teacher, or the folder's student)
  document.querySelectorAll('[data-annotate]').forEach(b => b.onclick = () => {
    const i = db.items.find(x => x.id === b.dataset.annotate);
    const saveAnno = (canvas, preview, title) => {
      db.items.push({ id: uid(), assignmentId: a.id, studentId: sid, authorId: db.session, kind: 'canvas',
        name: title, canvas, data: preview, ts: Date.now(), comments: [], star: false });
      if (sid !== SHARED && isTeacher()) notify([sid, ...parentsOf(sid)], `${me().name} annotated ${user(sid).name.split(' ')[0]}'s work in “${a.title}”`, { page: 'folder', classId: c.id, assignmentId: a.id, studentId: sid });
      saveDB(); render(); toast('Annotation saved');
    };
    if (docKind(i.name, i.type)) openDocOnCanvas(i.data, i.name, i.type, { onSave: saveAnno });
    else annotateImageToCanvas(i.data, i.name || 'work', saveAnno);
  });
  // per-item comments
  document.querySelectorAll('[data-csend]').forEach(b => {
    const send = () => {
      const inp = document.querySelector(`[data-cin="${b.dataset.csend}"]`);
      const t = inp.value.trim();
      if (!t) return;
      const i = db.items.find(x => x.id === b.dataset.csend);
      (i.comments = i.comments || []).push({ id: uid(), authorId: db.session, text: t, ts: Date.now() });
      const targets = sid === SHARED ? [...classTeachers(c), ...c.students] : [...classTeachers(c), i.studentId, ...parentsOf(i.studentId)];
      notify(targets, `${me().name} commented in “${a.title}”`, { page: 'folder', classId: c.id, assignmentId: a.id, studentId: sid });
      saveDB(); render();
    };
    b.onclick = send;
    const inp = document.querySelector(`[data-cin="${b.dataset.csend}"]`);
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  });
}

/* ---------- voice notes ---------- */
let recState = null;
async function startVoiceNote(addItem) {
  if (recState) return;
  const stream = await getMedia({ audio: true });
  if (!stream) return;
  if (!window.MediaRecorder) { stream.getTracks().forEach(t => t.stop()); toast("Voice notes aren't supported in this browser.", true); return; }
  const rec = new MediaRecorder(stream);
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const keep = recState && recState.keep;
    recState = null;
    if (!keep) { render(); return; }
    const blob = new Blob(chunks, { type: (rec.mimeType || 'audio/webm').split(';')[0] });
    if (blob.size > MAX_FILE) { toast('Recording too long for the demo.', true); render(); return; }
    const r = new FileReader();
    r.onload = () => addItem({ kind: 'audio', data: r.result });
    r.readAsDataURL(blob);
  };
  recState = { rec, keep: false, t0: Date.now() };
  rec.start();
  const holder = $('#rec-holder');
  holder.innerHTML = `
    <div class="rec-live"><span class="rec-dot"></span> Recording… <span id="rec-time">0s</span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn small" id="rec-done">${ic('i-tick')} Done</button>
      <button class="btn ghost small" id="rec-cancel">${ic('i-x')} Cancel</button>
    </div>`;
  const tick = setInterval(() => {
    if (!recState) { clearInterval(tick); return; }
    const el = $('#rec-time');
    if (el) el.textContent = Math.round((Date.now() - recState.t0) / 1000) + 's';
    if (Date.now() - recState.t0 > 120000) { recState.keep = true; rec.stop(); clearInterval(tick); } // 2 min cap
  }, 500);
  $('#rec-done').onclick = () => { recState.keep = true; rec.stop(); };
  $('#rec-cancel').onclick = () => { recState.keep = false; rec.stop(); };
}

/* ---------- modals ---------- */
function openModal(html) {
  const holder = $('#modal-holder') || document.body;
  const scrim = document.createElement('div');
  scrim.className = 'modal-scrim';
  scrim.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) scrim.remove(); });
  document.addEventListener('keydown', function esc2(e) { if (e.key === 'Escape') { scrim.remove(); document.removeEventListener('keydown', esc2); } });
  holder.appendChild(scrim);
  return scrim;
}

/* ---------- global search (classes / students / tasks) ---------- */
function searchScope() {
  let classes;
  if (isAdmin()) classes = db.classes.filter(c => c.schoolId === mySchool().id);
  else if (isParent()) classes = db.classes.filter(c => c.students.includes(me().childId));
  else classes = myClasses(true);
  const sids = [...new Set(classes.flatMap(c => c.students))];
  const aids = classes.map(c => c.id);
  const tasks = db.assignments.filter(a => aids.includes(a.classId));
  const staff = isAdmin() ? schoolStaff() : [];
  return { classes, students: sids.map(user), tasks, staff };
}
function openSearch() {
  const sc = searchScope();
  const m = openModal(`
    <h3>${ic('i-search')} Search</h3>
    <input id="gs-q" placeholder="Find a class, pupil${isAdmin() ? ', teacher' : ''} or task…" autocomplete="off">
    <div id="gs-results" style="margin-top:8px"></div>`);
  m.querySelector('.modal').classList.add('wide');
  const box = m.querySelector('#gs-results'), q = m.querySelector('#gs-q');
  const run = () => {
    const t = q.value.trim().toLowerCase();
    if (!t) { box.innerHTML = `<p class="muted small" style="padding:8px">Type a name to search.</p>`; return; }
    const hit = s => (s || '').toLowerCase().includes(t);
    const cls = sc.classes.filter(c => hit(c.name) || hit(c.subject)).slice(0, 8);
    const pupils = sc.students.filter(s => hit(s.name)).slice(0, 12);
    const staff = sc.staff.filter(s => hit(s.name)).slice(0, 8);
    const tasks = sc.tasks.filter(a => hit(a.title)).slice(0, 10);
    const sect = (label, items) => items.length ? `<div class="gs-cat">${label}</div>` + items.join('') : '';
    const row = (icon, title, sub, data) => `<div class="gs-result" ${data}><span class="gs-ico">${ic(icon)}</span><span><b>${esc(title)}</b><small>${esc(sub)}</small></span></div>`;
    box.innerHTML =
      sect('Classes', cls.map(c => row('i-class', c.name, c.subject || '', `data-goclass="${c.id}"`))) +
      sect('Pupils', pupils.map(s => row('i-child', s.name, 'reading record · portfolio', `data-gostudent="${s.id}"`))) +
      sect('Teachers', staff.map(s => row('i-teacher', s.name, 'staff', `data-gostaff="1"`))) +
      sect('Tasks', tasks.map(a => row('i-task', a.title, klass(a.classId) ? klass(a.classId).name : '', `data-gotask="${a.id}"`)))
      || `<p class="muted small" style="padding:8px">Nothing found for “${esc(q.value.trim())}”.</p>`;
    box.querySelectorAll('[data-goclass]').forEach(el => el.onclick = () => { m.remove(); go({ page: 'class', classId: el.dataset.goclass, tab: 'tasks' }); });
    box.querySelectorAll('[data-gostudent]').forEach(el => el.onclick = () => {
      m.remove();
      if ((isTeacher() || isAdmin()) && feat('reading')) go({ page: 'reading', studentId: el.dataset.gostudent });
      else go({ page: 'reading' });
    });
    box.querySelectorAll('[data-gostaff]').forEach(el => el.onclick = () => { m.remove(); go({ page: 'staff' }); });
    box.querySelectorAll('[data-gotask]').forEach(el => el.onclick = () => {
      const a = assignment(el.dataset.gotask); m.remove();
      if (isTeacher()) go({ page: 'assignment', classId: a.classId, assignmentId: a.id });
      else go({ page: 'folder', classId: a.classId, assignmentId: a.id, studentId: isParent() ? me().childId : me().id });
    });
  };
  q.addEventListener('input', run); run(); q.focus();
}

    saveDB(); m.remove(); render(); toast('Class updated');
  };
  const archBtn = m.querySelector('[data-arch]');
  if (archBtn) archBtn.onclick = () => {
    c.archived = !c.archived; saveDB(); m.remove();
    if (c.archived) { go({ page: 'dash', classId: null }); toast('Class archived — find it at the bottom of the sidebar'); }
    else { render(); toast('Class restored'); }
  };
  const delBtn = m.querySelector('[data-del]');
  if (delBtn) delBtn.onclick = () => {
    m.remove();
    openConfirm(`Delete ${c.name}?`, 'The class, its tasks and ALL student work in it will be removed. This cannot be undone.', () => {
      const aids = db.assignments.filter(a => a.classId === c.id).map(a => a.id);
      db.assignments = db.assignments.filter(a => a.classId !== c.id);
      db.items = db.items.filter(i => !aids.includes(i.assignmentId));
      db.discussions = db.discussions.filter(d => d.classId !== c.id);
      aids.forEach(aid => {
        Object.keys(db.handins).forEach(k => { if (k.startsWith(aid + '_')) delete db.handins[k]; });
        Object.keys(db.grades).forEach(k => { if (k.startsWith(aid + '_')) delete db.grades[k]; });
      });
      db.classes = db.classes.filter(x => x.id !== c.id);
      saveDB(); go({ page: 'dash', classId: null }); toast('Class deleted');
    });
  };
}

function openJoinClass() {
  const m = openModal(`
    <h3>${ic('i-key')} Join a class</h3>
    <p class="m-sub">Type the 5-letter code your teacher gave you.</p>
    <label>Join code</label><input id="jc-code" placeholder="e.g. JX4P7" maxlength="5" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800;text-align:center;font-size:1.2rem">
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-tick')} Join</button>
    </div>`);
  m.querySelector('[data-x]').onclick = () => m.remove();
  const goJoin = () => {
    const code = m.querySelector('#jc-code').value.trim().toUpperCase();
    const c = db.classes.find(x => x.code === code && !x.archived);
    if (!c) { toast("Hmm, that code doesn't match a class.", true); return; }
    if (c.students.includes(db.session)) { toast("You're already in that class!"); m.remove(); return; }
    c.students.push(db.session);
    notify(classTeachers(c), `${me().name} joined ${c.name}`, { page: 'class', classId: c.id, tab: 'students' });
    saveDB(); m.remove();
    go({ page: 'class', classId: c.id, tab: 'tasks' });
    toast(`Welcome to ${c.name}! 🎉`);
  };
  m.querySelector('[data-go]').onclick = goJoin;
  m.querySelector('#jc-code').addEventListener('keydown', e => { if (e.key === 'Enter') goJoin(); });
  m.querySelector('#jc-code').focus();
}

/* new task AND edit task */
/* template: prefill a NEW task from a snapshot (reuse / staff library / canvas) — saves as a fresh copy */
function openTaskModal(classId, existing, template) {
  const src = existing || template;
  let attachments = existing ? existing.attachments.slice() : template ? template.attachments : [];
  const m = openModal(`
    <h3>${ic('i-task')} ${existing ? 'Edit task' : template ? 'Reuse as a new task' : 'New task'}</h3>
    <p class="m-sub">${template ? `This copy is yours to change for ${esc(klass(classId).name)} — the original is untouched.`
      : `Every student gets their own private folder, plus there's a shared folder the whole class can see.`}</p>
    <label>Title</label><input id="nt-title" maxlength="80" placeholder="e.g. Design a game character" value="${src ? esc(src.title) : ''}">
    <label>Instructions</label><textarea id="nt-inst" placeholder="What should students do?">${src ? esc(src.instructions) : ''}</textarea>
    <div class="form-2col">
      <div><label>Publish</label>
        <select id="nt-pub">
          <option value="now" ${!existing || !existing.publishAt ? 'selected' : ''}>Straight away</option>
          <option value="later" ${existing && existing.publishAt ? 'selected' : ''}>Schedule for later…</option>
        </select></div>
      <div id="nt-pub-when" style="${existing && existing.publishAt ? '' : 'display:none'}">
        <label>Goes live on</label>
        <span style="display:flex;gap:8px">
          <input id="nt-pub-date" type="date" value="${existing && existing.publishAt ? new Date(existing.publishAt).toISOString().slice(0, 10) : ''}">
          <input id="nt-pub-time" type="time" style="max-width:120px" value="${existing && existing.publishAt ? ('0' + new Date(existing.publishAt).getHours()).slice(-2) + ':' + ('0' + new Date(existing.publishAt).getMinutes()).slice(-2) : '09:00'}">
        </span></div>
      <div><label>Due date (optional)</label><input id="nt-due" type="date" value="${src && src.due ? src.due : ''}"></div>
      <div><label>Due time (optional)</label><input id="nt-time" type="time" value="${src ? src.dueTime || '' : ''}"></div>
      <div><label>Points (optional — turns on grading)</label><input id="nt-outof" type="number" min="1" max="1000" placeholder="e.g. 10" value="${src && src.outOf ? src.outOf : ''}"></div>
      <div><label>Attach a resource (optional)</label>
        <span style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px">
          <button class="btn sec small" id="nt-att">${ic('i-clip')} Add file</button>
          <button class="btn sec small" id="nt-canvas">${ic('i-canvas')} New canvas</button>
        </span>
        <input type="file" id="nt-file" class="sr-only"></div>
    </div>
    <div id="nt-atts"></div>
    <label class="check-row" style="margin-top:12px"><input type="checkbox" id="nt-autolock" ${src && src.autoLock ? 'checked' : ''}> Lock automatically when the due date passes</label>
    <label class="check-row"><input type="checkbox" id="nt-shpost" ${src ? (src.sharedPosting ? 'checked' : '') : 'checked'}> Students can post in the shared folder</label>
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-send')} ${existing ? 'Save changes' : 'Set task'}</button>
    </div>`);
  /* while a canvas editor is open on top, hide this modal, restore after */
  const editorOpts = extra => Object.assign({ onExit: () => { m.style.display = ''; } }, extra);
  const drawAtts = () => {
    m.querySelector('#nt-atts').innerHTML = attachments.map((at, i) => `
      <div class="att-row">${at.kind === 'canvas' ? ic('i-canvas') : ic('i-clip')}<b>${esc(at.name)}</b>
        ${at.kind === 'canvas' ? `<button class="btn ghost small" data-edit="${i}">${ic('i-pencil')} Edit</button>`
          : (at.type && at.type.startsWith('image/')) || docKind(at.name, at.type) ? `<button class="btn ghost small" data-anno="${i}">${ic('i-pencil')} Annotate</button>` : ''}
        <button class="btn ghost small" data-rm="${i}">${ic('i-x')}</button>
      </div>`).join('');
    m.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { attachments.splice(+b.dataset.rm, 1); drawAtts(); });
    m.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      const at = attachments[+b.dataset.edit];
      m.style.display = 'none';
      openCanvasEditor({ name: at.name, canvas: at.canvas }, editorOpts({
        onSave: (canvas, preview, title) => { at.canvas = canvas; at.data = preview; at.name = title; drawAtts(); },
        onRecording: data => { attachments.push({ name: 'Presentation', type: 'video/webm', data }); drawAtts(); },
      }));
    });
    m.querySelectorAll('[data-anno]').forEach(b => b.onclick = () => {
      const idx = +b.dataset.anno, at = attachments[idx];
      m.style.display = 'none';
      if (docKind(at.name, at.type)) {
        // the annotated canvas REPLACES the original document — only ever one version
        openDocOnCanvas(at.data, at.name, at.type, editorOpts({
          onSave: (canvas, preview, title) => {
            const i = attachments.indexOf(at);
            const newAt = { kind: 'canvas', name: title, canvas, data: preview };
            if (i >= 0) attachments.splice(i, 1, newAt); else attachments.push(newAt);
            drawAtts();
          },
          onRecording: data => { attachments.push({ name: 'Presentation', type: 'video/webm', data }); drawAtts(); },
        }));
      } else {
        annotateImageToCanvas(at.data, at.name, (canvas, preview, title) => {
          attachments[idx] = { kind: 'canvas', name: title, canvas, data: preview };
          drawAtts();
        }, editorOpts({}));
      }
    });
  };
  drawAtts();
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('#nt-canvas').onclick = () => {
    m.style.display = 'none';
    openCanvasEditor(null, editorOpts({
      onSave: (canvas, preview, title) => { attachments.push({ kind: 'canvas', name: title, canvas, data: preview }); drawAtts(); },
      onRecording: data => { attachments.push({ name: 'Presentation', type: 'video/webm', data }); drawAtts(); },
    }));
  };
  m.querySelector('#nt-att').onclick = () => m.querySelector('#nt-file').click();
  m.querySelector('#nt-file').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > MAX_FILE) { toast('That file is too big for the demo (4MB max).', true); return; }
    const r = new FileReader();
    r.onload = () => { attachments.push({ name: f.name, type: f.type, data: r.result }); drawAtts(); };
    r.readAsDataURL(f);
  };
  m.querySelector('#nt-pub').onchange = e =>
    m.querySelector('#nt-pub-when').style.display = e.target.value === 'later' ? '' : 'none';
  m.querySelector('[data-go]').onclick = () => {
    const title = m.querySelector('#nt-title').value.trim();
    if (!title) { toast('Give the task a title', true); return; }
    let publishAt = null;
    if (m.querySelector('#nt-pub').value === 'later') {
      const pd = m.querySelector('#nt-pub-date').value;
      if (!pd) { toast('Pick a date for the task to go live', true); return; }
      publishAt = new Date(pd + 'T' + (m.querySelector('#nt-pub-time').value || '09:00')).getTime();
    }
    const vals = {
      title, instructions: m.querySelector('#nt-inst').value.trim(),
      due: m.querySelector('#nt-due').value || null, dueTime: m.querySelector('#nt-time').value || '',
      outOf: +m.querySelector('#nt-outof').value || null,
      autoLock: m.querySelector('#nt-autolock').checked,
      sharedPosting: m.querySelector('#nt-shpost').checked,
      attachments, publishAt,
      publishNotified: publishAt && publishAt > Date.now() ? false : (existing ? existing.publishNotified !== false : true),
    };
    if (existing) {
      Object.assign(existing, vals);
      saveDB(); m.remove(); render();
      toast(publishAt && publishAt > Date.now() ? 'Task updated — scheduled for ' + fmtDate(publishAt) : 'Task updated');
    } else {
      const a = Object.assign({ id: uid(), classId, createdAt: Date.now(), locked: false, archived: false }, vals);
      db.assignments.push(a);
      const c = klass(classId);
      if (isLive(a)) {
        a.publishNotified = true;
        notify(c.students, `New task in ${c.name}: “${title}”`, { page: 'folder', classId, assignmentId: a.id });
      }
      saveDB(); m.remove();
      go({ page: 'assignment', classId, assignmentId: a.id });
      toast(isLive(a) ? 'Task set — every student has a folder for it'
        : 'Task scheduled — students will see it on ' + fmtDate(a.publishAt));
    }
  };
  m.querySelector('#nt-title').focus();
}

/* ---------- reuse & staff sharing ----------
   a "template" is a plain snapshot of a task's settings (never its student work).
   Attachment objects are copied so later edits can't leak back into the source;
   the canvas data inside is safely shared because the editor deep-copies on open. */
function taskTemplate(a) {
  return { title: a.title, instructions: a.instructions, due: a.due || null, dueTime: a.dueTime || '',
    outOf: a.outOf || null, autoLock: !!a.autoLock, sharedPosting: a.sharedPosting !== false,
    attachments: (a.attachments || []).map(at => Object.assign({}, at)) };
}

function pickClass(title, sub, onPick) {
  const targets = db.classes.filter(c => classTeachers(c).includes(db.session) && !c.archived);
  if (!targets.length) { toast('You need a class first — create one from the sidebar.', true); return; }
  if (targets.length === 1) { onPick(targets[0].id); return; }
  const m = openModal(`
    <h3>${ic('i-class')} ${title}</h3>
    <p class="m-sub">${sub}</p>
    <label>Which class?</label>
    <select id="pc-sel">${targets.map(c => `<option value="${c.id}" ${c.id === view.classId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-tick')} Choose class</button>
    </div>`);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('[data-go]').onclick = () => { const cid = m.querySelector('#pc-sel').value; m.remove(); onPick(cid); };
}

function openReuseTask(a) {
  pickClass('Reuse this task', 'Makes a fresh copy you can edit before it goes out — student work is not copied.',
    cid => openTaskModal(cid, null, taskTemplate(a)));
}

function shareTaskWithStaff(a) {
  if (db.taskLibrary.some(t => t.sourceId === a.id)) { toast('Already in the staff library — colleagues can see it.'); return; }
  db.taskLibrary.push(Object.assign({ id: uid(), sourceId: a.id, ownerId: db.session, schoolId: me().schoolId, ts: Date.now() }, taskTemplate(a)));
  notify(schoolTeaching().map(t => t.id), `${me().name} shared a task with staff: “${a.title}”`, { page: 'tools' });
  saveDB(); render(); toast('Shared with staff — colleagues will find it in their Library');
}

/* ---------- teacher library: canvases that live outside any task ---------- */
function openLibraryCanvas(entry) { // entry from db.canvases, or null to start a new one
  openCanvasEditor(entry, {
    onSave: (canvas, preview, title) => {
      if (entry) Object.assign(entry, { canvas, data: preview, name: title, updated: Date.now() });
      else db.canvases.push({ id: uid(), ownerId: db.session, schoolId: me().schoolId, kind: 'canvas',
        name: title, canvas, data: preview, shared: false, ts: Date.now(), updated: Date.now() });
      saveDB(); render(); toast('Saved to your Library');
    },
    onRecording: data => { // presentations recorded here become library items too
      db.canvases.push({ id: uid(), ownerId: db.session, schoolId: me().schoolId, kind: 'file',
        name: (entry && entry.name ? entry.name + ' — ' : '') + 'Presentation', type: 'video/webm', data,
        shared: false, ts: Date.now(), updated: Date.now() });
      saveDB(); render(); // the library page sits behind the editor — keep it current
    },
  });
}

function useCanvasInTask(cv) {
  pickClass('Use this in a task', 'Starts a new task with it attached — you can edit everything before it goes out.', cid =>
    openTaskModal(cid, null, { title: cv.name, instructions: '', due: null, dueTime: '', outOf: null,
      autoLock: false, sharedPosting: true,
      attachments: [cv.kind === 'file' ? { name: cv.name, type: cv.type, data: cv.data }
                                       : { kind: 'canvas', name: cv.name, canvas: cv.canvas, data: cv.data }] }));
}

/* ---------- Tools: canvases, visual timetables, and the staff library ---------- */
function renderTools(main) {
  const toolTabs = [];
  if (feat('canvases')) toolTabs.push(['canvases', 'i-canvas', 'Canvases']);
  if (feat('timetables')) toolTabs.push(['timetables', 'i-timetable', 'Visual timetables']);
  if (feat('seating')) toolTabs.push(['seating', 'i-seating', 'Seating plans']);
  if (feat('staffshare')) toolTabs.push(['sharedtasks', 'i-task', 'Shared tasks']);
  if (!toolTabs.length) { go({ page: 'dash' }); return; }
  const tab = toolTabs.some(t => t[0] === view.tab) ? view.tab : toolTabs[0][0];
  const sortRecent = (a, b) => (b.updated || b.ts) - (a.updated || a.ts);
  const mine = db.canvases.filter(cv => cv.ownerId === db.session).sort(sortRecent);
  const shared = db.canvases.filter(cv => cv.shared && cv.ownerId !== db.session && cv.schoolId === me().schoolId).sort(sortRecent);
  const templates = db.taskLibrary.filter(t => t.schoolId === me().schoolId).sort((a, b) => b.ts - a.ts);
  const cvCard = (cv, own) => `
    <div class="lib-card">
      ${cv.kind === 'file'
        ? `<video class="lib-prev" src="${mediaURL(cv)}" controls preload="metadata" playsinline></video>`
        : `<button class="lib-prev" data-open="${cv.id}" title="${own ? 'Open and edit' : 'Open'}">${cv.data ? `<img src="${cv.data}" alt="">` : ic('i-canvas', 'big')}</button>`}
      <div class="lib-body"><b>${esc(cv.name)}</b>
        <small>${own ? (cv.shared ? `${ic('i-teacher')} shared with staff · ` : '') : `${ic('i-teacher')} ${esc(user(cv.ownerId).name)} · `}${fmtWhen(cv.updated || cv.ts)}</small></div>
      <div class="lib-actions">
        ${cv.kind === 'file' ? '' : `<button class="btn ghost small" data-open="${cv.id}">${own ? ic('i-pencil') + ' Edit' : ic('i-eye') + ' Open'}</button>`}
        <button class="btn ghost small" data-use="${cv.id}">${ic('i-task')} Use in a task</button>
        ${own ? `${feat('staffshare') ? `<button class="btn ghost small" data-share="${cv.id}">${cv.shared ? ic('i-x') + ' Unshare' : ic('i-teacher') + ' Share'}</button>` : ''}
                 <button class="btn ghost small" data-del="${cv.id}" aria-label="Delete">${ic('i-trash')}</button>`
              : `<button class="btn ghost small" data-copy="${cv.id}">${ic('i-copy')} Save a copy</button>`}

  const tplRow = t => `
    <div class="assign-row" style="cursor:default;transform:none">
      <span class="assign-ico">${ic('i-task')}</span>
      <span class="assign-body"><b>${esc(t.title)}</b>
        <small>${esc(user(t.ownerId).name)} · shared ${fmtWhen(t.ts)}${t.outOf ? ' · graded /' + t.outOf : ''}${t.attachments.length ? ` · ${t.attachments.length} attachment${t.attachments.length === 1 ? '' : 's'}` : ''}</small></span>
      <span class="assign-side">
        <button class="btn small" data-tpl-use="${t.id}">${ic('i-copy')} Use in my class</button>
        ${t.ownerId === db.session ? `<button class="btn ghost small" data-tpl-rm="${t.id}" aria-label="Remove">${ic('i-trash')}</button>` : ''}
      </span>
    </div>`;
  const myTTs = db.timetables.filter(t => t.ownerId === db.session).sort(sortRecent);
  const ttRow = t => {
    const cls = (t.classIds || []).map(id => klass(id)).filter(Boolean);
    const n = TT_DAYS.reduce((s, [k]) => s + ((t.days[k] || []).length), 0);
    return `
    <div class="assign-row" style="cursor:default;transform:none">
      <span class="assign-ico">${ic('i-timetable')}</span>
      <span class="assign-body"><b>${esc(t.name)}</b>
        <small>${n} activit${n === 1 ? 'y' : 'ies'} · ${cls.length ? 'shown to ' + cls.map(c => esc(c.name)).join(', ') : 'not sent to a class yet'} · ${fmtWhen(t.updated || t.ts)}</small></span>
      <span class="assign-side" style="flex-direction:row;gap:6px">
        <button class="btn small" data-tt-open="${t.id}">${ic('i-pencil')} Open</button>
        <button class="btn sec small" data-tt-display="${t.id}">${ic('i-laser')} Display</button>
        <button class="btn ghost small" data-tt-del="${t.id}" aria-label="Delete">${ic('i-trash')}</button>
      </span>
    </div>`;
  };
  const mySPs = db.seating.filter(p => p.ownerId === db.session && klass(p.classId)).sort(sortRecent);
  const spRow = p => {
    const cl = klass(p.classId), seatedN = p.desks.filter(d => d.sid).length;
    return `
    <div class="assign-row" style="cursor:default;transform:none">
      <span class="assign-ico">${ic('i-seating')}</span>
      <span class="assign-body"><b>${esc(p.name)}</b>
        <small>${esc(cl.name)} · ${seatedN}/${cl.students.length} seated · ${SP_LAYOUTS[p.layout] || 'custom'} · ${fmtWhen(p.updated || p.ts)}</small></span>
      <span class="assign-side" style="flex-direction:row;gap:6px">
        <button class="btn small" data-sp-open="${p.id}">${ic('i-pencil')} Open</button>
        <button class="btn sec small" data-sp-display="${p.id}">${ic('i-laser')} Display</button>
        <button class="btn ghost small" data-sp-del="${p.id}" aria-label="Delete">${ic('i-trash')}</button>
      </span>
    </div>`;
  };
  const bodies = {
    seating: mySPs.length ? mySPs.map(spRow).join('')
      : `<div class="card empty">${ic('i-seating', 'big')}Build a seating plan from your real class list — drag the desks, shuffle in a second, keep certain pupils apart, then put it on the board or print it. No more paper and PowerPoint.</div>`,
    canvases: `
      <h3 style="margin:0 0 12px">My canvases</h3>
      ${mine.length ? `<div class="lib-grid">${mine.map(cv => cvCard(cv, true)).join('')}</div>`
        : `<div class="card empty">${ic('i-canvas', 'big')}Nothing here yet — press “New canvas” to make one without setting a task, then use it in as many tasks as you like.</div>`}
