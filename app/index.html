<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClassDrop — Primary Coding League</title>
<meta name="description" content="ClassDrop — hand out work, hand it in, give feedback. A classroom workspace by Primary Coding League.">
<style>
/* ============================================================================
   ClassDrop — styled in the Primary Coding League design system
   (gold #ae853e on warm charcoal, Montserrat body)
   ========================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

:root{
  /* PCL brand */
  --gold:#ae853e; --gold-hi:#c99a4a; --gold-dk:#8a6a2f; --gold-soft:#f4ecdc; --gold-line:#e6d7b8;
  --ink:#33302b; --muted:#7a746a; --gray:#585555;
  --paper:#f6f2ea; --card:#ffffff; --line:#e7e0d3;
  --shell:#242220; --shell-2:#2e2b27; --shell-line:#3c3833; --shell-ink:#f3ede1; --shell-muted:#a89f90;

  /* semantic (warm-tuned) */
  --green:#1d8a5f; --green-soft:#e2f2ea; --red:#c0392b; --red-soft:#f8e7e4;
  --amber:#c98a1e; --amber-soft:#f8eed9; --blue:#3573a8; --blue-soft:#e7f0f8;

  --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius:14px; --shadow:0 2px 12px rgba(58,48,30,.07);
  font-size:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font); background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;
  text-size-adjust:100%; -webkit-text-size-adjust:100%}
button{font:inherit; -webkit-tap-highlight-color:transparent}
.btn,.nav-item,.seg button,.chip,.fcard,.assign-row,.class-card,.tabbar button,.disc-card,.notif,.iconbtn{touch-action:manipulation}
input,select,textarea{
  font:inherit; color:var(--ink); background:#fff; border:1.5px solid var(--line);
  border-radius:10px; padding:9px 12px; width:100%; max-width:100%;
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(174,133,62,.4); outline-offset:1px}
textarea{min-height:90px; resize:vertical}
label{display:block; font-size:.82rem; font-weight:700; color:var(--muted); margin:12px 0 4px; letter-spacing:.01em}
label:first-child{margin-top:0}
a{color:var(--gold-dk)}
h1,h2,h3,h4{letter-spacing:.005em}

/* custom icons */
.ic{width:1.15em; height:1.15em; display:inline-block; vertical-align:-.16em; fill:currentColor; flex:none}
.ic.big{width:2.1em; height:2.1em}
.nav-item .nico .ic{width:1.3em; height:1.3em; vertical-align:-.28em}
.btn .ic{width:1.15em; height:1.15em}
.empty .big.ic{color:var(--gold-line); margin:0 auto 8px; display:block; width:2.6em; height:2.6em}

/* brand mark (original ClassDrop artwork: gold folder + drop-in arrow) */
.mark{display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none}
.mark svg{width:100%; height:100%; display:block}
.side-brand .mark,.topbar .mark{background:#fff; border-radius:12px; padding:5px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1.5px solid var(--gold); border-radius:999px; padding:10px 18px; font-weight:800; cursor:pointer;
  background:var(--gold); color:#2b2211; min-height:42px; text-decoration:none; letter-spacing:.01em;
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{background:var(--gold-hi); border-color:var(--gold-hi)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--gold-soft); color:var(--gold-dk); border-color:var(--gold-line)}
.btn.sec:hover{background:#ecdfc4; border-color:var(--gold-line)}
.btn.ghost{background:transparent; color:var(--muted); border-color:var(--line)}
.btn.ghost:hover{color:var(--ink); border-color:var(--gold); background:#fff}
.btn.danger{background:var(--red-soft); color:#a13327; border-color:#eaccc6}
.btn.danger:hover{background:#f3dbd6}
.btn.small{padding:6px 13px; min-height:34px; font-size:.85rem}
.btn:disabled{opacity:.5; cursor:default}
.iconbtn{border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:9px; width:32px; height:32px;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none}
.iconbtn:hover{color:var(--gold-dk); border-color:var(--gold)}
.iconbtn.on{background:var(--gold-soft); color:var(--gold-dk); border-color:var(--gold)}

/* ---------- auth ---------- */
.auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(120% 120% at 50% 0%, #34302b 0%, #242220 55%, #1c1a18 100%)}
.auth-card{background:#fff; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  padding:34px 30px; width:100%; max-width:470px; border-top:5px solid var(--gold)}
.auth-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:6px; text-align:center}
.auth-logo .mark{width:82px; height:82px}
.auth-logo h1{font-weight:800; font-size:1.9rem; margin:0; color:var(--ink); letter-spacing:-.01em}
.auth-sub{color:var(--muted); margin:0 0 18px; font-size:.9rem; text-align:center}
.demo-note{background:var(--gold-soft); border:1.5px dashed var(--gold-line); border-radius:12px; padding:10px 14px;
  font-size:.82rem; color:var(--gold-dk); font-weight:600; text-align:center; margin-bottom:16px}
.auth-sec{font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:16px 0 8px}
.demo-user{display:flex; align-items:center; gap:12px; width:100%; background:#fff; border:1.5px solid var(--line);
  border-radius:12px; padding:9px 14px; cursor:pointer; margin-bottom:8px; text-align:left; transition:border-color .15s,transform .1s}
.demo-user:hover{border-color:var(--gold); transform:translateY(-1px)}
.demo-user b{display:block; font-size:.94rem}
.demo-user small{color:var(--muted); font-size:.74rem; text-transform:uppercase; letter-spacing:.08em; font-weight:700}
.auth-reset{text-align:center; margin-top:14px}
.parent-join{display:flex; gap:8px; margin-top:4px}
.parent-join input{text-transform:uppercase; letter-spacing:.12em; font-weight:800; text-align:center}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:256px 1fr; min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--shell) 0%,#1f1d1b 100%); color:var(--shell-ink);
  border-right:1px solid #000; padding:18px 14px; display:flex; flex-direction:column; gap:3px;
  position:sticky; top:0; height:100vh; overflow-y:auto}
.side-brand{display:flex; align-items:center; gap:11px; padding:4px 8px 16px}
.side-brand .mark{width:46px; height:46px}
.side-brand b{font-weight:800; font-size:1.25rem; line-height:1.05; display:block; color:#fff; letter-spacing:-.01em}
.side-brand small{color:var(--gold); font-size:.64rem; display:block; letter-spacing:.13em; text-transform:uppercase; margin-top:3px}
.nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; cursor:pointer;
  color:var(--shell-muted); font-weight:700; font-size:.93rem; border:none; background:none; width:100%; text-align:left; position:relative}
.nav-item:hover{background:var(--shell-2); color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(174,133,62,.22),rgba(174,133,62,.06)); color:#fff; box-shadow:inset 3px 0 0 var(--gold)}
.nav-item .nico{width:22px; text-align:center; font-size:1.05rem}
.nav-badge{position:absolute; right:10px; background:var(--red); color:#fff; border-radius:99px; font-size:.7rem; padding:2px 7px; font-weight:800}
.nav-sep{height:1px; background:var(--shell-line); margin:10px 6px}
.nav-head{color:var(--shell-muted); font-size:.66rem; letter-spacing:.13em; text-transform:uppercase; font-weight:800; padding:10px 12px 4px}
.side-user{margin-top:auto; padding:12px 8px 4px; border-top:1px solid var(--shell-line)}
.side-user .who{font-weight:800; font-size:.9rem; color:#fff}
.side-user .role{color:var(--gold); font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; margin-bottom:8px}
.side-user .btn.ghost{color:var(--shell-muted); border-color:var(--shell-line); width:100%}
.side-user .btn.ghost:hover{color:#fff; background:var(--shell-2); border-color:var(--gold)}

.main{padding:26px 32px 60px; min-width:0}
.page-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px}
.page-head h2{margin:0; font-size:1.55rem; font-weight:800}
.page-head .spacer{flex:1}
.page-sub{color:var(--muted); margin:-14px 0 20px; font-size:.92rem}
.crumb{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-weight:700; font-size:.85rem;
  border:none; background:none; cursor:pointer; padding:0; margin-bottom:10px}
.crumb:hover{color:var(--gold-dk)}

/* mobile top bar */
.topbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed; z-index:60; left:0; top:0; bottom:0; width:264px; transform:translateX(-105%);
    transition:transform .18s ease; box-shadow:0 0 40px rgba(0,0,0,.4); height:100dvh}
  .sidebar.open{transform:none}
  .topbar{display:flex; align-items:center; gap:12px; background:var(--shell); color:#fff;
    padding:12px 16px; position:sticky; top:0; z-index:40}
  .topbar .mark{width:34px; height:34px}
  .topbar b{flex:1; font-weight:800; font-size:1.15rem; letter-spacing:-.01em}
  .topbar .btn.ghost{color:#fff; border-color:var(--shell-line)}
  .main{padding:18px 14px 60px}
  .scrim{position:fixed; inset:0; background:rgba(15,12,8,.45); z-index:55}
}

/* ---------- cards / stats ---------- */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; border:1px solid var(--line)}
.card h3{margin:0 0 12px; font-size:1.05rem; font-weight:800}
.grid{display:grid; gap:16px}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:20px}
.stat{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); border-top:3px solid var(--gold)}
.stat .n{font-size:1.75rem; font-weight:800; color:var(--gold-dk)}
.stat .l{color:var(--muted); font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em}
.stat.hot{border-top-color:var(--red)} .stat.hot .n{color:var(--red)}
.stat.amber{border-top-color:var(--amber)} .stat.amber .n{color:var(--amber)}
.stat.green{border-top-color:var(--green)} .stat.green .n{color:var(--green)}

/* chips */
.chip{display:inline-flex; align-items:center; gap:5px; border-radius:99px; padding:3px 11px; font-size:.77rem; font-weight:800; white-space:nowrap}
.chip.green{background:var(--green-soft); color:var(--green)}
.chip.red{background:var(--red-soft); color:#a13327}
.chip.amber{background:var(--amber-soft); color:var(--amber)}
.chip.blue{background:var(--blue-soft); color:var(--blue)}
.chip.grey{background:#efece5; color:var(--muted)}
.chip.brand{background:var(--gold-soft); color:var(--gold-dk)}

/* ---------- class cards ---------- */
.class-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px}
.class-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  cursor:pointer; overflow:hidden; transition:border-color .15s,transform .1s; text-align:left; padding:0}
.class-card:hover{border-color:var(--gold); transform:translateY(-2px)}
.class-band{height:64px; display:flex; align-items:flex-end; padding:10px 16px;
  background:linear-gradient(120deg,var(--shell) 0%,var(--shell-2) 100%)}
.class-band .ic{width:1.7em; height:1.7em; color:var(--gold)}
.class-card .cbody{padding:14px 16px 16px}
.class-card .cbody b{display:block; font-size:1.02rem; margin-bottom:3px}
.class-card .cbody small{color:var(--muted); font-size:.82rem}
.class-card .cfoot{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}

/* join code pill */
.code-pill{background:var(--gold-soft); border:1.5px dashed var(--gold); border-radius:12px; padding:12px 16px; text-align:center}
.code-pill code{font-size:1.35rem; font-weight:800; letter-spacing:.18em; color:var(--gold-dk)}
.code-pill small{display:block; color:var(--muted); font-weight:700; font-size:.74rem; margin-top:2px; letter-spacing:.05em}

/* ---------- tab bar ---------- */
.tabbar{display:flex; gap:6px; border-bottom:2px solid var(--gold-line); margin-bottom:18px; flex-wrap:wrap}
.tabbar button{border:none; background:none; padding:9px 15px; font-weight:800; font-size:.92rem; color:var(--muted);
  cursor:pointer; border-radius:10px 10px 0 0; display:inline-flex; align-items:center; gap:7px}
.tabbar button:hover{color:var(--ink); background:var(--gold-soft)}
.tabbar button.on{color:var(--gold-dk); background:var(--gold-soft); box-shadow:inset 0 -3px 0 var(--gold)}
@media (max-width:860px){
  .tabbar{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar button{flex:none; white-space:nowrap}
}

/* ---------- assignment rows ---------- */
.assign-row{display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 18px; box-shadow:var(--shadow); cursor:pointer; margin-bottom:12px; transition:border-color .15s,transform .1s; width:100%; text-align:left}
.assign-row:hover{border-color:var(--gold); transform:translateY(-2px)}
.assign-row.dim{opacity:.65}
.assign-ico{width:44px; height:44px; border-radius:12px; background:var(--gold-soft); color:var(--gold-dk);
  display:flex; align-items:center; justify-content:center; flex:none}
.assign-ico .ic{width:1.45em; height:1.45em}
.assign-body{flex:1; min-width:0}
.assign-body b{display:block; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.assign-body small{color:var(--muted); font-size:.82rem}
.assign-side{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none}
@media (max-width:560px){
  .assign-row{flex-wrap:wrap}
  .assign-body{flex:1 1 calc(100% - 58px)}
  .assign-body b{white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .assign-side{flex-direction:row; flex-wrap:wrap; width:100%; justify-content:flex-start; padding-left:58px; row-gap:6px}
}

/* ---------- folder grid (teacher view of a task) ---------- */
.folder-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:14px}
.fcard{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 14px; text-align:center;
  box-shadow:var(--shadow); cursor:pointer; transition:border-color .15s,transform .1s}
.fcard:hover{border-color:var(--gold); transform:translateY(-2px)}
.fcard .avatar{width:52px; height:52px; font-size:1.1rem; margin:0 auto 9px}
.fcard b{display:block; font-size:.93rem; margin-bottom:7px}
.fcard.shared{border:1.5px solid var(--gold-line); background:var(--gold-soft)}
.fcard.shared .avatar{background:var(--gold); color:#2b2211}
/* teacher library cards */
.lib-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:14px}
.lib-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  display:flex; flex-direction:column; transition:border-color .12s}
.lib-card:hover{border-color:var(--gold)}
.lib-prev{display:block; width:100%; height:128px; background:#fbf9f4; border:none; border-bottom:1px solid var(--line);
  cursor:pointer; padding:0; position:relative}
.lib-prev img{width:100%; height:100%; object-fit:cover; display:block}
.lib-prev .ic.big{position:absolute; inset:0; margin:auto; opacity:.35}
video.lib-prev{object-fit:cover; cursor:default}
.lib-body{padding:10px 12px 2px}
.lib-body b{display:block; font-size:.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lib-body small{color:var(--muted); font-size:.75rem; display:flex; align-items:center; gap:4px; flex-wrap:wrap}
.lib-actions{display:flex; gap:6px; flex-wrap:wrap; padding:8px 10px 10px; margin-top:auto}
/* visual timetable */
.tt-row{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 14px; margin-bottom:8px}
.tt-row .tt-emoji{font-size:1.7rem; flex:none; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  background:var(--gold-soft); border-radius:12px}
.tt-row b{font-size:1rem}
.tt-row .tt-time{color:var(--muted); font-weight:700; font-size:.85rem}
.tt-row .tt-acts{margin-left:auto; display:flex; gap:4px; flex:none}
.tt-preset-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:7px; margin:6px 0 4px}
.tt-preset-grid button{border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:8px 6px; cursor:pointer;
  font-family:var(--font); font-weight:700; font-size:.78rem; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:3px}
.tt-preset-grid button span{font-size:1.5rem}
.tt-preset-grid button:hover{border-color:var(--gold); background:var(--gold-soft)}
/* today strip on student / parent dashboards */
.tt-strip{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 10px; -webkit-overflow-scrolling:touch}
.tt-card{flex:none; width:108px; background:#fff; border:1.5px solid var(--gold-line); border-radius:14px; padding:12px 8px;
  text-align:center; box-shadow:var(--shadow)}
.tt-card .e{font-size:2rem; line-height:1.2}
.tt-card b{display:block; font-size:.8rem; margin-top:4px}
.tt-card small{color:var(--muted); font-weight:700; font-size:.72rem}
.tt-card.now{border-color:var(--gold); background:var(--gold-soft); box-shadow:0 0 0 2px var(--gold-line)}
/* full-screen display mode (classroom screen) + print */
.tt-wrap{position:fixed; inset:0; z-index:150; background:var(--paper); display:flex; flex-direction:column}
.tt-bar{background:linear-gradient(180deg,var(--shell) 0%,#1f1d1b 100%); color:#fff; display:flex; align-items:center; gap:12px; padding:12px 16px; flex-wrap:wrap}
.tt-bar .mark{width:30px; height:30px}
.tt-scroll{flex:1; overflow-y:auto; padding:26px}
.tt-big{max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px}
.tt-big .tt-bigcard{background:#fff; border:2px solid var(--line); border-radius:18px; padding:22px 14px; text-align:center; position:relative}
.tt-big .tt-bigcard .e{font-size:3.4rem; line-height:1.2}
.tt-big .tt-bigcard b{display:block; font-size:1.15rem; margin-top:8px}
.tt-big .tt-bigcard small{color:var(--muted); font-weight:800; font-size:.9rem}
.tt-big .tt-bigcard .n{position:absolute; top:8px; left:12px; font-weight:800; color:var(--gold-dk); opacity:.55}
.tt-big .tt-bigcard.now{border-color:var(--gold); background:var(--gold-soft); box-shadow:0 0 0 3px var(--gold-line)}
.tt-big .tt-bigcard.done{opacity:.45}
.tt-title-input{font-family:var(--font); font-weight:800; font-size:1.4rem; color:var(--ink); border:none; background:none;
  border-bottom:2px dashed var(--gold-line); padding:2px 4px; min-width:0; flex:1}
.tt-title-input:focus{outline:none; border-bottom-color:var(--gold)}
/* safeguarding: body map + record views */
.bm-wrap{display:flex; gap:18px; justify-content:flex-start; margin:6px 0 4px}
.bm-fig{text-align:center}
.bm-svg{width:128px; height:auto; background:#fbf9f4; border:1.5px solid var(--line); border-radius:12px; display:block}
.bm-svg.edit{cursor:crosshair}
.bm-svg.edit:hover{border-color:var(--gold)}
.bm-lab{font-size:.75rem; font-weight:800; color:var(--muted); margin-top:4px}
.bm-row{display:flex; align-items:center; gap:8px; margin-top:8px}
.bm-row .bm-note{flex:1}
.bm-num{width:24px; height:24px; border-radius:50%; background:var(--red); color:#fff; font-size:.78rem; font-weight:800;
  display:inline-flex; align-items:center; justify-content:center; flex:none}
.bm-notes{font-size:.88rem; margin:8px 0 0; padding-left:20px}
.sg-note{background:var(--paper); border-radius:10px; padding:12px; white-space:pre-wrap; font-size:.92rem}
.sg-conf{background:var(--gold-soft); border:1.5px dashed var(--gold-line); border-radius:12px; padding:10px 14px;
  font-size:.85rem; color:var(--gold-dk); font-weight:700; display:flex; gap:8px; align-items:center; margin-bottom:14px}
.sgp-wrap{position:fixed; inset:0; z-index:150; background:var(--paper); display:flex; flex-direction:column}
.sgp-bar{background:linear-gradient(180deg,var(--shell) 0%,#1f1d1b 100%); color:#fff; display:flex; align-items:center; gap:12px; padding:12px 16px}
.sgp-scroll{flex:1; overflow-y:auto; padding:26px}
.sgp-page{max-width:820px; margin:0 auto 22px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px 32px}
.sgp-page h4{margin:14px 0 4px}
.sgp-page .meta{color:var(--muted); font-size:.85rem; font-weight:700}
/* seating plans */
.sp-room{position:relative; width:100%; aspect-ratio:1000/600; background:#fbf9f4; border:1.5px solid var(--line);
  border-radius:16px; overflow:hidden; container-type:inline-size; touch-action:none; user-select:none}
.sp-room .sp-scale{position:absolute; inset:0; width:1000px; height:600px; transform-origin:0 0}
.sp-board{position:absolute; left:290px; top:14px; width:420px; height:34px; border-radius:8px; background:var(--shell);
  color:#fff; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; letter-spacing:.06em}
.sp-room.flip .sp-scale{transform-origin:center; }
.sp-desk{position:absolute; width:126px; height:70px; border-radius:12px; background:#fff; border:2px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:grab; padding:4px 6px;
  box-shadow:0 1px 4px rgba(58,48,30,.10); text-align:center}
.sp-desk.drag{cursor:grabbing; box-shadow:0 10px 26px rgba(58,48,30,.3); z-index:5}
.sp-desk.filled{border-color:var(--gold-line); background:var(--gold-soft)}
.sp-desk.empty{border-style:dashed; color:var(--muted)}
.sp-desk b{font-size:15px; line-height:1.15; max-width:112px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sp-desk .sp-init{width:26px; height:26px; border-radius:50%; background:var(--gold); color:#2b2211; font-size:11px;
  font-weight:800; display:flex; align-items:center; justify-content:center}
.sp-desk .sp-pin{position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; background:var(--gold-dk);
  color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center}
.sp-desk .sp-pin .ic{width:.85em; height:.85em}
.sp-desk.warn{border-color:var(--red); background:var(--red-soft)}
.sp-flipwrap{transform:rotate(180deg)}
.sp-flipwrap .sp-desk, .sp-flipwrap .sp-board{transform:rotate(180deg)}
.sp-side{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 4px}
.sp-chip{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:#fff; border-radius:99px;
  padding:5px 12px; font-weight:700; font-size:.84rem; cursor:pointer}
.sp-chip:hover{border-color:var(--gold); background:var(--gold-soft)}
.sp-apart{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:.9rem}
/* full-screen display / print */
.sp-wrap{position:fixed; inset:0; z-index:150; background:var(--paper); display:flex; flex-direction:column}
.sp-bar{background:linear-gradient(180deg,var(--shell) 0%,#1f1d1b 100%); color:#fff; display:flex; align-items:center;
  gap:12px; padding:12px 16px; flex-wrap:wrap}
.sp-bar .mark{width:30px; height:30px}
.sp-scroll{flex:1; overflow:auto; padding:22px}
.sp-scroll .sp-room{max-width:1180px; margin:0 auto}
/* feature switchboard */
.feat-list{display:flex; flex-direction:column; gap:10px}
.feat-row{display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line);
  border-radius:var(--radius); padding:14px 16px; transition:opacity .12s}
.feat-row.off{opacity:.62; background:var(--paper)}
.feat-ico{flex:none; width:42px; height:42px; border-radius:12px; background:var(--gold-soft); color:var(--gold-dk);
  display:flex; align-items:center; justify-content:center}
.feat-ico .ic{width:1.3em; height:1.3em}
.feat-body{flex:1; min-width:0}
.feat-body b{display:block; font-size:.98rem}
.feat-body small{color:var(--muted); font-size:.84rem}
.feat-body .feat-warn{display:block; margin-top:4px; color:var(--amber); font-weight:700}
.toggle{flex:none; width:52px; height:30px; border-radius:99px; border:none; background:#cfc7b8; cursor:pointer;
  padding:3px; display:flex; transition:background .15s}
.toggle span{width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.28); transition:transform .15s}
.toggle.on{background:var(--green)}
.toggle.on span{transform:translateX(22px)}
/* dual-role chips + hat switcher */
.role-chips{display:inline-flex; gap:6px; flex-wrap:wrap}
.rchip{border:1.5px solid var(--line); background:#fff; color:var(--muted); border-radius:99px; padding:5px 12px;
  font-family:var(--font); font-weight:800; font-size:.78rem; cursor:pointer; display:inline-flex; align-items:center; gap:5px}
.rchip .ic{width:1em; height:1em}
.rchip.on{border-color:var(--gold); background:var(--gold-soft); color:var(--gold-dk)}
.rchip:disabled{cursor:not-allowed; opacity:.55}
.hat-switch{display:flex; gap:4px; background:var(--shell-2); border:1px solid var(--shell-line); border-radius:99px;
  padding:3px; margin-bottom:10px}
.hat-switch button{flex:1; border:none; background:none; color:var(--shell-muted); font-family:var(--font); font-weight:800;
  font-size:.74rem; padding:6px 4px; border-radius:99px; cursor:pointer; display:inline-flex; align-items:center;
  justify-content:center; gap:4px; white-space:nowrap}
.hat-switch button .ic{width:1em; height:1em}
.hat-switch button.on{background:var(--gold); color:#2b2211}

/* ---------- work items (folders) ---------- */
.work-list{display:flex; flex-direction:column; gap:12px}
.work-item{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px}
.work-item.teacher{border-left:4px solid var(--gold)}
.work-item .w-head{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.work-item .w-head .avatar{width:32px; height:32px; font-size:.78rem}
.work-item .w-head b{font-size:.9rem}
.work-item .w-head small{color:var(--muted); font-size:.76rem}
.work-item .w-head .spacer{flex:1}
.w-body{font-size:.94rem; white-space:pre-wrap; word-break:break-word}
.w-img{max-width:min(340px,100%); border-radius:10px; border:1px solid var(--line); display:block; cursor:zoom-in}
.w-file{display:inline-flex; align-items:center; gap:9px; background:var(--gold-soft); border:1px solid var(--gold-line);
  border-radius:11px; padding:9px 14px; font-weight:700; font-size:.88rem; color:var(--gold-dk); text-decoration:none; max-width:100%}
.w-file span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
audio{width:100%; max-width:340px; display:block}
.w-actions{display:flex; gap:6px; align-items:center}
.sticker-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
.sticker{display:inline-flex; align-items:center; gap:5px; background:var(--gold-soft); border:1px solid var(--gold-line);
  border-radius:99px; padding:4px 11px; font-size:.78rem; font-weight:800; color:var(--gold-dk)}
.sticker .ic{width:1em; height:1em}
.sticker.green{background:var(--green-soft); border-color:#cbe6d8; color:var(--green)}
.sticker.red{background:var(--red-soft); border-color:#eed3ce; color:#a13327}
.grade-chip{display:inline-flex; align-items:center; gap:6px; background:var(--green-soft); border:1.5px solid #cbe6d8;
  color:var(--green); border-radius:12px; padding:6px 14px; font-weight:800; font-size:1rem}

/* per-item comments */
.i-comments{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; display:flex; flex-direction:column; gap:8px}
.comment{display:flex; gap:9px; align-items:flex-start}
.comment .avatar{width:26px; height:26px; font-size:.68rem; margin-top:1px}
.comment .c-bub{background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:7px 11px; font-size:.88rem; flex:1}
.comment .c-bub b{font-size:.78rem; display:block; color:var(--gold-dk)}
.comment.mine .c-bub{background:var(--gold-soft); border-color:var(--gold-line)}
.c-compose{display:flex; gap:8px; align-items:center}
.c-compose input{padding:7px 11px; font-size:.88rem; border-radius:99px}
.c-toggle{border:none; background:none; color:var(--muted); font-weight:700; font-size:.8rem; cursor:pointer; padding:2px 0}
.c-toggle:hover{color:var(--gold-dk)}

/* ---------- composer ---------- */
.composer{background:#fff; border:1.5px solid var(--gold-line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow)}
.composer h4{margin:0 0 10px; font-size:.85rem; text-transform:uppercase; letter-spacing:.06em; color:var(--gold-dk)}
.comp-tools{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.comp-send{display:flex; gap:10px; align-items:flex-end}
.comp-send textarea{min-height:52px; flex:1}
.rec-live{display:flex; align-items:center; gap:10px; background:var(--red-soft); border:1.5px solid #eaccc6;
  border-radius:12px; padding:10px 14px; margin-bottom:10px; font-weight:700; color:#a13327}
.rec-dot{width:12px; height:12px; border-radius:50%; background:var(--red); animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- hand-in / grade banners ---------- */
.handin-bar{display:flex; align-items:center; gap:12px; background:var(--gold-soft); border:1.5px solid var(--gold-line);
  border-radius:var(--radius); padding:13px 16px; margin-bottom:16px; font-weight:700; font-size:.92rem; flex-wrap:wrap}
.handin-bar .spacer{flex:1}
.handin-bar.done{background:var(--green-soft); border-color:#cbe6d8; color:var(--green)}
.grade-box{display:flex; align-items:center; gap:8px}
.grade-box input{width:74px; text-align:center; font-weight:800}

/* ---------- discussions ---------- */
.disc-card{display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 18px; box-shadow:var(--shadow); cursor:pointer; margin-bottom:12px; transition:border-color .15s,transform .1s; width:100%; text-align:left}
.disc-card:hover{border-color:var(--gold); transform:translateY(-2px)}
.msg-thread{display:flex; flex-direction:column; gap:10px; padding:6px 0 14px; max-height:56vh; overflow-y:auto}
.msg{max-width:75%; padding:10px 14px; border-radius:14px; font-size:.93rem; white-space:pre-wrap}
.msg.mine{align-self:flex-end; background:var(--gold); color:#2b2211; border-bottom-right-radius:4px}
.msg.theirs{align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px}
.msg .meta{display:block; font-size:.7rem; opacity:.75; margin-top:4px}
.msg-compose{display:flex; gap:10px}
.msg-compose textarea{min-height:46px; flex:1}

/* ---------- notifications ---------- */
.notif{display:flex; gap:12px; align-items:flex-start; background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:13px 16px; box-shadow:var(--shadow); cursor:pointer; margin-bottom:10px; width:100%; text-align:left}
.notif:hover{border-color:var(--gold)}
.notif.unread{border-left:4px solid var(--gold); background:#fffdf8}
.notif .n-body{flex:1; font-size:.92rem}
.notif .n-body small{display:block; color:var(--muted); font-size:.76rem; margin-top:2px}

/* ---------- portfolio ---------- */
.port-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px}
.port-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; cursor:pointer}
.port-card:hover{border-color:var(--gold)}
.port-card .w-img{max-width:100%; margin-bottom:8px}
.port-card small{color:var(--muted); font-size:.78rem; display:block; margin-top:6px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
table{border-collapse:collapse; width:100%; font-size:.93rem}
th{padding:12px 14px; text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); border-bottom:1.5px solid var(--line); white-space:nowrap; background:var(--gold-soft)}
td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
tr:last-child td{border-bottom:none}
.empty{padding:34px; text-align:center; color:var(--muted)}
.gb-cell{text-align:center; font-weight:800; white-space:nowrap}
.gb-cell .chip{font-size:.68rem}

/* ---------- times tables ---------- */
.xt-hero{background:linear-gradient(135deg, var(--shell) 0%, #35312b 100%); color:#f3ede1; border-radius:var(--radius);
  padding:24px 26px; box-shadow:var(--shadow); margin-bottom:16px}
.xt-hero h3{margin:0 0 6px; color:#fff; font-size:1.25rem}
.xt-hero p{margin:0 0 16px; color:#b9b0a1; font-size:.92rem; max-width:46em}
.xt-hero .row{display:flex; gap:10px; flex-wrap:wrap}
.xt-hero .btn.ghost{border-color:rgba(243,237,225,.32); color:#f3ede1}
.xt-hero .btn.ghost:hover{background:rgba(243,237,225,.1)}
.xt-tabchips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px}
.xt-tabchips button{border:1px solid var(--line); background:#fff; border-radius:99px; padding:6px 14px;
  font-family:var(--font); font-weight:800; font-size:.82rem; color:var(--muted); cursor:pointer}
.xt-tabchips button.on{background:var(--gold); border-color:var(--gold); color:#fff}

/* the 12 × 12 recall grid */
.xt-gridwrap{overflow-x:auto; padding-bottom:4px}
.xt-grid{display:inline-grid; gap:3px; background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; box-shadow:var(--shadow)}
.xt-cell{width:38px; height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-size:.72rem; font-weight:800; color:#fff; background:var(--line)}
.xt-cell.hd{background:none; color:var(--muted); font-size:.7rem}
.xt-cell.off{background:#f0ece4; color:#c9c2b5}
.xt-cell.s-new{background:#e6e1d6; color:#8d8577}
.xt-cell.s-learning{background:#c9603f}
.xt-cell.s-nearly{background:#d8a13c}
.xt-cell.s-fluent{background:#4b8a5e}
.xt-key{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin:10px 0 0; font-size:.78rem; color:var(--muted)}
.xt-key i{display:inline-block; width:13px; height:13px; border-radius:4px; margin-right:5px; vertical-align:-2px}
.xt-hot{display:flex; gap:8px; flex-wrap:wrap}
.xt-hot span{background:var(--gold-soft); border:1px solid var(--gold-line); border-radius:10px; padding:7px 12px;
  font-weight:800; font-size:.86rem; color:var(--gold-dk)}
.xt-hot span small{display:block; font-weight:700; font-size:.68rem; color:var(--muted)}
.xt-bar{height:7px; border-radius:99px; background:var(--line); overflow:hidden; min-width:78px}
.xt-bar i{display:block; height:100%; background:var(--green)}
.xt-lead{counter-reset:pos}
.xt-lead .assign-ico{background:var(--gold-soft); color:var(--gold-dk); font-weight:800; font-size:.9rem}

/* full-screen game */
.xt-play{position:fixed; inset:0; z-index:70; background:var(--shell); color:#f3ede1; display:flex; flex-direction:column;
  font-family:var(--font)}
.xt-top{display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--shell-line)}
.xt-top .mark{width:30px; height:30px}
.xt-top b{font-size:.95rem}
.xt-top .spacer{flex:1}
.xt-pill{background:rgba(243,237,225,.1); border:1px solid var(--shell-line); border-radius:99px; padding:5px 13px;
  font-weight:800; font-size:.86rem; white-space:nowrap}
.xt-pill.hot{background:rgba(201,96,63,.22); border-color:rgba(201,96,63,.5); color:#f0b09a}
.xt-pill.go{background:rgba(75,138,94,.2); border-color:rgba(75,138,94,.5); color:#a7d8b6}
.xt-clock{height:5px; background:rgba(243,237,225,.14)}
.xt-clock i{display:block; height:100%; background:var(--gold); transition:width .25s linear}
.xt-stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:20px}
.xt-q{font-size:clamp(2.6rem, 9vw, 5.4rem); font-weight:800; letter-spacing:-.02em; line-height:1}
.xt-q em{font-style:normal; color:var(--gold-hi)}
.xt-ans{min-width:210px; min-height:78px; padding:8px 26px; border-radius:18px; border:2.5px solid var(--shell-line);
  background:rgba(243,237,225,.06); font-size:3rem; font-weight:800; display:flex; align-items:center; justify-content:center;
  letter-spacing:.04em}
.xt-ans.ok{border-color:#4b8a5e; background:rgba(75,138,94,.22); color:#c6e9d0}
.xt-ans.no{border-color:#c9603f; background:rgba(201,96,63,.22); color:#f4bda9}
.xt-ans .ghost{opacity:.32}
.xt-pad{display:grid; grid-template-columns:repeat(3, 84px); gap:10px}
.xt-pad button{height:64px; border-radius:16px; border:1px solid var(--shell-line); background:rgba(243,237,225,.08);
  color:#f3ede1; font-family:var(--font); font-weight:800; font-size:1.5rem; cursor:pointer}
.xt-pad button:hover{background:rgba(243,237,225,.16)}
.xt-pad button:active{transform:scale(.95)}
.xt-pad button.wide{grid-column:span 2}
.xt-hint{color:#b9b0a1; font-size:.9rem; min-height:1.4em; text-align:center}
.xt-hint b{color:var(--gold-hi)}
.xt-end{max-width:520px; text-align:center}
.xt-end h2{color:#fff; font-size:2rem; margin:0 0 6px}
.xt-end p{color:#b9b0a1; margin:0 0 18px}
.xt-score{font-size:4.6rem; font-weight:800; color:var(--gold-hi); line-height:1}
.xt-end .stat-row{margin:18px 0}
.xt-end .stat{background:rgba(243,237,225,.07); border-color:var(--shell-line)}
.xt-end .stat .n{color:#fff}
.xt-end .stat .l{color:#b9b0a1}
.xt-pad button.ok{background:rgba(75,138,94,.28); border-color:rgba(75,138,94,.6); color:#c6e9d0}
.xt-pad button.ok:hover{background:rgba(75,138,94,.42)}

/* the check: quieter than the game, and re-skinnable for access arrangements */
.xt-check .xt-gap{font-size:2rem; font-weight:800; opacity:.72}
.xt-check.xt-large .xt-q{font-size:clamp(3.4rem, 12vw, 7rem)}
.xt-check.xt-large .xt-ans{font-size:4rem; min-height:96px}
.xt-check.xt-large .xt-pad button{height:78px; font-size:1.9rem}
.xt-check.ct-yb{background:#000; color:#ff0}
.xt-check.ct-bb{background:#4a90d9; color:#000}
.xt-check.ct-bp{background:#ffd9b3; color:#000}
.xt-check.ct-bc{background:#fffbe8; color:#00c}
.xt-check[class*="ct-"] .xt-q em{color:inherit; opacity:.7}
.xt-check[class*="ct-"] .xt-top,
.xt-check[class*="ct-"] .xt-pill,
.xt-check[class*="ct-"] .xt-ans,
.xt-check[class*="ct-"] .xt-pad button{border-color:currentColor; color:inherit; background:transparent}
.xt-check[class*="ct-"] .xt-pad button:hover{background:rgba(128,128,128,.22)}
.xt-check[class*="ct-"] .xt-clock{background:rgba(128,128,128,.3)}
.xt-check[class*="ct-"] .xt-clock i{background:currentColor}
.xt-check[class*="ct-"] .mark{display:none}
.xt-access{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:9px; margin:6px 0 4px}
.xt-access label{display:flex; gap:8px; align-items:flex-start; font-weight:600; font-size:.88rem;
  background:var(--gold-soft); border:1px solid var(--gold-line); border-radius:12px; padding:9px 12px; margin:0}
.xt-access label input{width:auto; margin-top:2px}
@media (max-width:560px){
  .xt-pad{grid-template-columns:repeat(3, 72px)}
  .xt-cell{width:30px; height:27px; font-size:.64rem}
}

/* ---------- markbook ---------- */
.mb-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.mb-wrap{overflow:auto; max-height:72vh; background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
table.mb{border-collapse:separate; border-spacing:0; font-size:.86rem; width:100%}
table.mb th, table.mb td{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:7px 9px; white-space:nowrap; vertical-align:middle}
.mb thead .mb-col{position:sticky; top:0; z-index:2; background:var(--gold-soft); text-align:left; vertical-align:bottom; min-width:118px}
.mb .mb-col .mb-grp{display:block; color:var(--gold-dk); font-weight:800; font-size:.64rem; text-transform:uppercase; letter-spacing:.05em; opacity:.85}
.mb .mb-col .mb-cn{font-weight:800; cursor:pointer}
.mb .mb-col .mb-cn:hover{color:var(--gold-dk); text-decoration:underline}
.mb .mb-col .mb-cmeta{display:flex; align-items:center; gap:6px; color:var(--muted); font-weight:600; font-size:.68rem; margin-top:2px}
.mb-colbtn{border:none; background:none; cursor:pointer; color:var(--muted); font-size:.95rem; line-height:1; margin-left:auto; padding:0 2px}
.mb-colbtn:hover{color:var(--red)}
.mb .mb-name{position:sticky; left:0; z-index:1; background:#fff; font-weight:700; box-shadow:1px 0 0 var(--line); min-width:148px; text-align:left}
.mb thead .mb-corner{position:sticky; left:0; top:0; z-index:3; background:var(--gold-soft); text-align:left; min-width:148px}
.mb tbody tr:nth-child(even) .mb-name{background:#faf7f1}
.mb-cell{text-align:center}
.mb-cell input, .mb-cell select{width:100%; min-width:82px; padding:5px 6px; font-size:.84rem; border-radius:7px; text-align:center; border-color:transparent; background:transparent}
.mb-cell input:hover, .mb-cell select:hover{border-color:var(--line); background:#fff}
.mb-cell input:focus, .mb-cell select:focus{background:#fff}
.mb-cell.comment input{text-align:left; min-width:150px}
.mb-cell.linked{color:var(--gold-dk); font-weight:800; background:var(--gold-soft)}
.mb-total{position:sticky; right:0; background:var(--gold-soft); text-align:center; font-weight:800; color:var(--gold-dk); min-width:58px; z-index:1}
.mb thead .mb-total{z-index:3; top:0}
.mb tfoot td{background:#f3efe6; font-weight:800}
.mb tfoot .mb-name{background:#f3efe6}
.mb-legend{display:flex; gap:6px; flex-wrap:wrap}
/* school grade-scale management */
.scale-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px}
.lvl-chip{display:inline-flex; flex-direction:column; align-items:flex-start; border-radius:9px; padding:5px 10px; font-weight:800; font-size:.82rem; line-height:1.1}
.lvl-chip small{font-weight:600; font-size:.68rem; opacity:.85}
.lvl-row{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap}
.lvl-swatches{display:inline-flex; gap:4px; flex-wrap:wrap}
.lvl-sw{width:24px; height:24px; border-radius:50%; border:2px solid; cursor:pointer; padding:0; flex:none}
.lvl-sw.on{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--gold)}
/* report builder */
.rb-el{display:flex; gap:12px; align-items:flex-start; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px}
.rb-el .rb-tag{min-width:70px; color:var(--gold-dk); font-weight:800; font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; padding-top:9px}
.rb-el .rb-body{flex:1; min-width:0}
.rb-el .rb-ctrls{display:flex; gap:4px}
.rb-add{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
/* report run + print */
.rp-wrap{position:fixed; inset:0; z-index:150; background:var(--paper); display:flex; flex-direction:column}
.rp-bar{background:linear-gradient(180deg,var(--shell) 0%,#1f1d1b 100%); color:#fff; display:flex; align-items:center; gap:12px; padding:12px 16px}
.rp-bar .mark{width:32px; height:32px; background:#fff; border-radius:9px; padding:4px}
.rp-bar b{flex:1; font-weight:800}
.rp-bar .btn.ghost{color:var(--shell-muted); border-color:var(--shell-line)}
.rp-bar .btn.ghost:hover{color:#fff; background:var(--shell-2)}
.rp-scroll{flex:1; overflow:auto; padding:24px; display:flex; flex-direction:column; align-items:center; gap:22px}
.rp-page,.rpb-page{--rp-primary:#ae853e; --rp-accent:#1d8a5f}
.rp-page{position:relative; background:#fff; width:100%; max-width:800px; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:40px 46px}
.rp-page.pos{width:760px; max-width:760px; min-height:1074px; padding:0; flex:none}
.rp-page.pos > div{overflow:hidden}
.rp-page .rp-brand{display:flex; align-items:center; gap:10px; justify-content:center; color:var(--muted); font-weight:700; font-size:.8rem; margin-bottom:6px}
.rp-h{font-size:1.5rem; font-weight:800; margin:0 0 4px; text-align:center; color:color-mix(in srgb,var(--rp-primary) 78%,#000)}
.rp-t{font-size:.96rem; line-height:1.55; margin:8px 0}
.rp-field{font-size:.95rem; margin:3px 0}
.rp-field b{color:var(--muted); font-weight:700}
.rp-subj{border-top:1.5px solid color-mix(in srgb,var(--rp-primary) 45%,#fff); padding:12px 0 4px; margin-top:12px}
.rp-subj-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.rp-subj-head b{font-size:1.06rem}
.rp-grade{margin-left:auto; font-weight:800; color:color-mix(in srgb,var(--rp-accent) 80%,#000); background:color-mix(in srgb,var(--rp-accent) 15%,#fff); border-radius:8px; padding:2px 11px; font-size:.85rem}
.rp-c{font-size:.95rem; line-height:1.55; margin:6px 0 0; white-space:pre-wrap}
.rp-empty{color:var(--muted); font-style:italic; font-size:.9rem}
.rp-lh{display:flex; align-items:center; gap:14px; border-bottom:2px solid var(--rp-primary); padding-bottom:12px; margin-bottom:12px}
.rp-logo{width:56px; height:56px; object-fit:contain; border-radius:10px; flex:none}
.rp-lh-name{font-weight:800; font-size:1.3rem; color:var(--ink)}
.rp-lh-sub{color:var(--muted); font-size:.85rem; font-weight:600}
.rp-att{font-size:.95rem; margin:10px 0; background:color-mix(in srgb,var(--rp-primary) 12%,#fff); border:1px solid color-mix(in srgb,var(--rp-primary) 30%,#fff); border-radius:8px; padding:8px 13px; display:inline-block}
.rp-pills{margin-left:auto; display:flex; gap:10px}
.rp-pill-wrap{display:flex; flex-direction:column; align-items:center; gap:2px}
.rp-pill-wrap small{color:var(--muted); font-weight:700; font-size:.6rem; text-transform:uppercase; letter-spacing:.04em}
.rp-effort{color:var(--blue); background:var(--blue-soft)}
.rp-gt{width:100%; border-collapse:collapse; font-size:.92rem; margin-top:4px}
.rp-gt th{background:color-mix(in srgb,var(--rp-primary) 15%,#fff); color:color-mix(in srgb,var(--rp-primary) 78%,#000); text-align:left; padding:7px 11px; font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; border-bottom:1.5px solid color-mix(in srgb,var(--rp-primary) 32%,#fff)}
.rp-gt td{padding:7px 11px; border-bottom:1px solid var(--line)}
.rp-gt tr:last-child td{border-bottom:none}
.rp-gt th:not(:first-child), .rp-gt td:not(:first-child){text-align:center; width:130px}
.gt-row{display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap}
.gt-row input{flex:1; min-width:120px}
.att-in{max-width:92px; text-align:center}
.sd-swatches{display:inline-flex; gap:4px; flex-wrap:wrap}
.sd-sw{width:22px; height:22px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--line); cursor:pointer; padding:0; flex:none}
.sd-sw:hover{box-shadow:0 0 0 2px var(--gold)}
/* reading record */
.rr-summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:18px}
.rr-entry{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:12px; border-left:4px solid var(--gold-line)}
.rr-entry.by-teacher{border-left-color:var(--gold)}
.rr-entry.by-parent{border-left-color:var(--green)}
.rr-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px}
.rr-head b{font-size:1.02rem}
.rr-head .rr-author{margin-left:auto; font-size:.76rem; color:var(--muted); font-weight:700}
.rr-meta{color:var(--muted); font-size:.82rem; margin-bottom:6px}
.rr-note{font-size:.94rem; white-space:pre-wrap; line-height:1.5}
.rr-stars{color:var(--gold); letter-spacing:2px}
.rr-stars .off{color:var(--line)}
.rr-actions{display:flex; gap:6px; margin-top:8px}
.star-pick{display:inline-flex; gap:3px; font-size:1.5rem; cursor:pointer}
.star-pick .s{color:var(--line); cursor:pointer}
.star-pick .s.on{color:var(--gold)}
/* moderation */
.pending-flag{background:var(--amber-soft); border:1px solid #eddcb5; border-radius:10px; padding:6px 10px; font-size:.8rem; font-weight:700; color:var(--amber); margin-top:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.pending-flag .spacer{flex:1}
.flagged{background:var(--red-soft); border:1px solid #eed3ce; border-radius:10px; padding:6px 10px; font-size:.8rem; font-weight:700; color:#a13327; margin-top:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.msg.pending, .work-item.pending, .comment.pending{opacity:.7}
.mod-btn{border:none; background:none; color:var(--muted); cursor:pointer; font-size:.78rem; font-weight:700; padding:2px 4px}
.mod-btn:hover{color:var(--gold-dk)}
.mod-btn.report:hover{color:var(--red)}
/* global search */
.search-launch{display:flex; align-items:center; gap:8px; background:var(--shell-2); border:1px solid var(--shell-line); border-radius:10px; padding:8px 12px; color:var(--shell-muted); cursor:pointer; width:100%; margin-bottom:6px; font-size:.9rem}
.search-launch:hover{color:#fff; border-color:var(--gold)}
.search-launch .ic{width:1.1em; height:1.1em}
.gs-result{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; cursor:pointer; border:1px solid transparent}
.gs-result:hover{background:var(--gold-soft); border-color:var(--gold-line)}
.gs-result .gs-ico{width:34px; height:34px; border-radius:9px; background:var(--gold-soft); color:var(--gold-dk); display:flex; align-items:center; justify-content:center; flex:none}
.gs-result b{display:block; font-size:.94rem}
.gs-result small{color:var(--muted); font-size:.78rem}
.gs-cat{font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:12px 4px 4px}
/* comment bank */
.cb-chips{display:flex; flex-direction:column; gap:6px; max-height:200px; overflow:auto; margin-top:6px}
.cb-chip{display:flex; align-items:center; gap:8px; background:var(--gold-soft); border:1px solid var(--gold-line); border-radius:10px; padding:7px 11px; font-size:.86rem; cursor:pointer; text-align:left}
.cb-chip:hover{background:#ecdfc4}
.cb-chip span{flex:1}
.cb-chip .cb-del{border:none; background:none; color:var(--muted); cursor:pointer; padding:0 2px}
.cb-chip .cb-del:hover{color:var(--red)}
/* behaviour points (dojo-style) */
.pts-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.pts-total{background:var(--shell); color:#fff; border-radius:14px; padding:10px 18px; font-weight:800; display:flex; align-items:center; gap:9px}
.pts-total .n{font-size:1.4rem; color:var(--gold)}
.pts-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:14px}
.pts-card{background:#fff; border:1.5px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:14px 10px; text-align:center;
  cursor:pointer; transition:transform .1s,border-color .12s; position:relative; user-select:none}
.pts-card:hover{border-color:var(--gold); transform:translateY(-2px)}
.pts-card.sel{border-color:var(--gold); box-shadow:0 0 0 3px rgba(174,133,62,.25)}
.pts-card .avatar{width:56px; height:56px; font-size:1.2rem; margin:0 auto 8px}
.pts-card b{display:block; font-size:.9rem; line-height:1.15; min-height:2.1em}
.pts-score{display:inline-flex; align-items:center; gap:5px; margin-top:7px; font-weight:800; font-size:1.05rem;
  background:var(--green-soft); color:var(--green); border-radius:99px; padding:3px 13px}
.pts-score.neg{background:var(--red-soft); color:#a13327}
.pts-card .sel-tick{position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%; background:var(--gold); color:#fff;
  display:none; align-items:center; justify-content:center}
.pts-card.sel .sel-tick{display:inline-flex}
.pop-pts{animation:popPts .5s ease}
@keyframes popPts{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.award-bar{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:120; background:var(--shell); color:#fff;
  border-radius:14px; padding:10px 16px; display:flex; gap:10px; align-items:center; box-shadow:0 10px 40px rgba(0,0,0,.4); font-weight:700}
.beh-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
.beh-opt{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; cursor:pointer; background:#fff; text-align:left; font-weight:700}
.beh-opt:hover{border-color:var(--gold); background:var(--gold-soft)}
.beh-opt.needs:hover{border-color:var(--red); background:var(--red-soft)}
.beh-emoji{font-size:1.5rem; line-height:1}
.beh-opt .bp{margin-left:auto; font-weight:800; color:var(--green)}
.beh-opt.needs .bp{color:#a13327}
.pts-feed{display:flex; flex-direction:column; gap:8px}
.pts-frow{display:flex; align-items:center; gap:11px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:9px 13px}
.pts-frow .beh-emoji{font-size:1.35rem}
.pts-frow b{font-size:.92rem}
.pts-frow small{color:var(--muted); font-size:.78rem}
.pts-frow .bp{margin-left:auto; font-weight:800}
.pts-frow .bp.pos{color:var(--green)} .pts-frow .bp.neg{color:#a13327}
/* markbook comment cell (opens a writing window) */
.mb-commentcell{cursor:pointer; text-align:left; min-width:150px; max-width:240px; white-space:normal; font-size:.82rem; line-height:1.35; color:var(--ink)}
.mb-commentcell:hover{background:var(--gold-soft)}
.mb-commentcell .mb-cadd{color:var(--gold-dk); font-weight:700}
.cm-count{font-size:.75rem; color:var(--muted); text-align:right; margin-top:4px}
/* WYSIWYG report designer */
.rpb-wrap{display:flex; gap:16px; align-items:flex-start}
.rpb-main{flex:1; min-width:0}
.rpb-side{width:290px; flex:none; position:sticky; top:14px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:var(--shadow); max-height:82vh; overflow:auto}
.rpb-side h4{margin:0 0 8px; font-size:.82rem; text-transform:uppercase; letter-spacing:.05em; color:var(--gold-dk)}
@media(max-width:900px){ .rpb-wrap{flex-direction:column-reverse} .rpb-side{width:100%; position:static; max-height:none} }
.rpb-palette{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px}
.rpb-canvas{overflow:auto; background:#e9e3d6; border-radius:12px; padding:20px; display:flex; justify-content:center}
.rpb-page{position:relative; width:760px; min-height:1074px; background:#fff; box-shadow:0 3px 18px rgba(0,0,0,.18); flex:none}
.rpb-el{position:absolute; box-sizing:border-box; padding:4px 6px; border:1.5px solid transparent; border-radius:6px; overflow:hidden; cursor:grab; touch-action:none}
.rpb-el:hover{border-color:var(--gold-line)}
.rpb-el.sel{border-color:var(--gold); box-shadow:0 0 0 2px rgba(174,133,62,.22); cursor:grabbing}
.rpb-el .rpb-rs{position:absolute; right:-2px; bottom:-2px; width:15px; height:15px; background:var(--gold); border:2px solid #fff; border-radius:4px; cursor:nwse-resize}
.rpb-el .rpb-eldel{position:absolute; right:2px; top:2px; width:22px; height:22px; border-radius:6px; border:none; background:rgba(192,57,43,.9); color:#fff; cursor:pointer; display:none; align-items:center; justify-content:center; padding:0}
.rpb-el.sel .rpb-eldel{display:inline-flex}
.rpb-el .rpb-eldel .ic{width:.9em; height:.9em}
.rpb-hint{font-size:.8rem; color:var(--muted); margin:0 0 10px}
.rpb-side .muted.small{display:block; line-height:1.5}
@media print {
  #app, #toast-holder, #modal-holder, .modal-scrim { display:none !important; }
  .tt-wrap{position:static}
  .tt-bar{display:none !important}
  .tt-scroll{padding:0; overflow:visible}
  .tt-print-head{display:block !important; font-size:1.4rem; font-weight:800; margin:0 0 14px}
  .tt-big .tt-bigcard{break-inside:avoid; box-shadow:none}
  .tt-big .tt-bigcard.now{border-color:var(--line); background:#fff; box-shadow:none}
  .tt-big .tt-bigcard.done{opacity:1}
  .sgp-wrap{position:static}
  .sgp-bar{display:none !important}
  .sgp-scroll{padding:0; overflow:visible}
  .sgp-page{border:none; border-radius:0; max-width:100%; padding:12px 4px; page-break-after:always}
  .sp-wrap{position:static}
  .sp-bar{display:none !important}
  .sp-scroll{padding:0; overflow:visible}
  .sp-print-head{display:block !important; font-size:1.3rem; font-weight:800; margin:0 0 12px}
  .sp-room{break-inside:avoid; box-shadow:none}
  .rp-wrap{position:static}
  .rp-bar{display:none !important}
  .rp-scroll{padding:0; display:block; overflow:visible}
  .rp-page{max-width:100%; box-shadow:none; border:none; border-radius:0; padding:16px 8px; page-break-after:always}
  .rp-page.pos{width:760px; max-width:760px; padding:0; margin:0 auto}
}

/* ---------- modal ---------- */
.modal-scrim{position:fixed; inset:0; background:rgba(20,15,8,.5); z-index:400; display:flex; align-items:center; justify-content:center; padding:16px}
.modal{background:#fff; border-radius:18px; width:100%; max-width:560px; max-height:92dvh; overflow-y:auto;
  padding:24px; box-shadow:0 22px 70px rgba(0,0,0,.3); border-top:5px solid var(--gold)}
.modal.wide{max-width:780px}
.modal h3{margin:0 0 4px; font-size:1.2rem; font-weight:800; display:flex; align-items:center; gap:8px}
.modal .m-sub{color:var(--muted); font-size:.88rem; margin:0 0 12px}
.m-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:22px; flex-wrap:wrap}
.form-2col{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
@media (max-width:560px){.form-2col{grid-template-columns:1fr}}
.att-row{display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--line);
  border-radius:10px; margin-top:7px; font-size:.9rem}
.att-row b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
.check-row{display:flex; align-items:center; gap:9px; padding:7px 2px; font-weight:600; font-size:.92rem; cursor:pointer}
.check-row input{width:auto; accent-color:var(--gold); transform:scale(1.25)}

/* drawing / annotation pad */
.draw-tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.draw-tools .swatch{width:30px; height:30px; border-radius:50%; border:2.5px solid #fff; box-shadow:0 0 0 1.5px var(--line); cursor:pointer; padding:0}
.draw-tools .swatch.on{box-shadow:0 0 0 3px var(--gold)}
#draw-canvas{border:1.5px solid var(--line); border-radius:12px; background:#fff; touch-action:none; width:100%;
  background-image:linear-gradient(45deg,#f7f4ee 25%,transparent 25%,transparent 75%,#f7f4ee 75%),linear-gradient(45deg,#f7f4ee 25%,transparent 25%,transparent 75%,#f7f4ee 75%);
  background-size:20px 20px; background-position:0 0,10px 10px}

/* sticker picker */
.sticker-pick{display:flex; gap:8px; flex-wrap:wrap}
.sticker-pick button{border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:8px 15px;
  font-weight:800; font-size:.88rem; cursor:pointer; display:inline-flex; gap:7px; align-items:center; color:var(--gold-dk)}
.sticker-pick button:hover{border-color:var(--gold); background:var(--gold-soft)}

/* ---------- canvas editor (full-screen board) ---------- */
.cv-wrap{position:fixed; inset:0; z-index:150; display:flex; flex-direction:column; background:var(--paper)}
.cv-head{background:linear-gradient(180deg,var(--shell) 0%,#1f1d1b 100%); color:#fff; display:flex; align-items:center;
  gap:12px; padding:10px 16px}
.cv-head .mark{width:34px; height:34px; background:#fff; border-radius:10px; padding:4px}
.cv-title{flex:1; max-width:420px; margin:0 auto; background:transparent; border:1.5px solid transparent; color:#fff;
  font-weight:800; font-size:1.05rem; text-align:center; border-radius:10px; padding:7px 12px}
.cv-title:hover,.cv-title:focus{border-color:var(--shell-line); background:var(--shell-2)}
.cv-title:disabled{color:#fff; opacity:1}
.cv-head .btn.ghost{color:var(--shell-muted); border-color:var(--shell-line)}
.cv-head .btn.ghost:hover{color:#fff; background:var(--shell-2)}
.cv-toolbar{display:flex; align-items:center; gap:6px; padding:8px 14px; background:#fff; border-bottom:1.5px solid var(--line); flex-wrap:wrap}
.cv-tool{border:1.5px solid transparent; background:none; color:var(--muted); border-radius:10px; width:40px; height:40px;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-weight:800}
.cv-tool .ic{width:1.35em; height:1.35em}
.cv-tool:hover{background:var(--gold-soft); color:var(--gold-dk)}
.cv-tool.on{background:var(--gold-soft); color:var(--gold-dk); border-color:var(--gold)}
.cv-tool:disabled{opacity:.4; cursor:default}
.cv-sep{width:1.5px; height:26px; background:var(--line); margin:0 4px}
.cv-swatch{width:24px; height:24px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--line); cursor:pointer; padding:0; flex:none}
.cv-swatch.on{box-shadow:0 0 0 3px var(--gold)}
.cv-size{width:auto; padding:6px 8px; font-size:.85rem}
.cv-body{flex:1; position:relative; min-height:0}
#cv-main{position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block}
.cv-zoom{position:absolute; right:18px; bottom:18px; background:#fff; border:1px solid var(--line); border-radius:999px;
  box-shadow:var(--shadow); display:flex; align-items:center; gap:2px; padding:4px}
.cv-zoom button{border:none; background:none; width:38px; height:38px; border-radius:50%; cursor:pointer; color:var(--muted);
  font-weight:800; font-size:1.1rem; display:inline-flex; align-items:center; justify-content:center}
.cv-zoom button:hover{background:var(--gold-soft); color:var(--gold-dk)}
.cv-zoom .pct{font-size:.78rem; font-weight:800; color:var(--muted); min-width:44px; text-align:center}
.cv-hint{position:absolute; left:18px; bottom:18px; background:rgba(255,255,255,.92); border:1px solid var(--line);
  border-radius:99px; padding:7px 14px; font-size:.78rem; font-weight:700; color:var(--muted); box-shadow:var(--shadow)}
.cv-ctx{position:fixed; z-index:410; background:#fff; border:1px solid var(--line); border-radius:12px;
  box-shadow:0 14px 44px rgba(0,0,0,.26); padding:6px; min-width:174px; display:flex; flex-direction:column}
.cv-ctx button{display:flex; align-items:center; gap:11px; border:none; background:none; text-align:left; padding:10px 12px;
  border-radius:8px; cursor:pointer; font-weight:700; font-size:.9rem; color:var(--ink)}
.cv-ctx button:hover{background:var(--gold-soft); color:var(--gold-dk)}
.cv-ctx button.danger:hover{background:var(--red-soft); color:#a13327}
.cv-ctx .ic{width:1.1em; height:1.1em}
.cv-ctx .sep{height:1px; background:var(--line); margin:4px 6px}
.w-canvas{position:relative; display:inline-block; cursor:pointer}
.w-canvas .w-img{cursor:pointer}
.w-canvas .cv-badge{position:absolute; top:8px; left:8px; background:rgba(36,34,32,.85); color:#fff; border-radius:99px;
  padding:3px 11px; font-size:.72rem; font-weight:800; display:inline-flex; align-items:center; gap:5px}
.cv-wrap.present .cv-toolbar,.cv-wrap.present .cv-hint{display:none}
#cv-present.on{background:var(--gold); color:#2b2211; border-color:var(--gold)}
#cv-present.on:hover{background:var(--gold-hi)}
/* page strip (right edge, like a mini page rail) */
.cv-pages{position:absolute; top:12px; right:12px; max-height:calc(100% - 24px); width:66px; display:flex; flex-direction:column;
  gap:7px; align-items:center; overflow-y:auto; padding:8px 6px; background:rgba(255,255,255,.94); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow); z-index:2}
.cv-page{width:48px; height:38px; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-weight:800;
  color:var(--muted); cursor:pointer; flex:none}
.cv-page.on{border-color:var(--gold); background:var(--gold-soft); color:var(--gold-dk)}
.cv-page-btn{width:48px; height:30px; border-radius:9px; border:1.5px dashed var(--line); background:#fff; color:var(--muted);
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; flex:none}
.cv-page-btn:hover{border-color:var(--gold); color:var(--gold-dk)}
.cv-zoom{right:92px}
/* spectrum + stamps */
#cv-spec{width:140px; height:26px; border-radius:8px; cursor:crosshair; border:1.5px solid var(--line); flex:none}
.cv-stamp{border:1.5px solid transparent; background:none; font-size:1.25rem; border-radius:8px; cursor:pointer; padding:1px 4px; line-height:1}
.cv-stamp.on{border-color:var(--gold); background:var(--gold-soft)}
/* video items, camera window, text-format modal, attachment cards */
.w-vid{max-width:min(420px,100%); border-radius:10px; border:1px solid var(--line); display:block; background:#000}
.cam-stage{position:relative; background:#111; border-radius:12px; overflow:hidden}
.cam-stage video{width:100%; display:block; max-height:52vh; object-fit:contain}
.att-card{border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:10px; background:#fff}
.att-card .w-img{max-width:min(300px,100%)}
.att-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.tx-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px}
.tgl{border:1.5px solid var(--line); background:#fff; border-radius:9px; min-width:40px; height:40px; font-weight:800; cursor:pointer; padding:0 10px}
.tgl.on{border-color:var(--gold); background:var(--gold-soft); color:var(--gold-dk)}
@media (max-width:640px){ .cv-title{max-width:150px} .cv-toolbar{gap:4px} .cv-tool{width:36px; height:36px} }

/* ---------- toast ---------- */
#toast-holder{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center}
.toast{background:var(--shell); color:#fff; border-radius:12px; padding:12px 20px; font-weight:700; font-size:.92rem;
  box-shadow:0 8px 30px rgba(0,0,0,.35); animation:pop .18s ease; border-left:4px solid var(--gold)}
.toast.err{border-left-color:var(--red)}
@keyframes pop{from{transform:translateY(8px); opacity:0}}

/* ---------- misc ---------- */
.muted{color:var(--muted)} .small{font-size:.85rem} .mt{margin-top:16px}
.avatar{width:38px; height:38px; border-radius:50%; background:var(--gold-soft); color:var(--gold-dk);
  display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:.9rem; flex:none}
.row{display:flex; align-items:center; gap:10px}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
img.zoomed{position:fixed; inset:0; margin:auto; max-width:94vw; max-height:94vh; z-index:300; cursor:zoom-out;
  box-shadow:0 20px 80px rgba(0,0,0,.6); border-radius:12px; background:#fff}
.zoom-scrim{position:fixed; inset:0; background:rgba(15,12,8,.7); z-index:299; cursor:zoom-out}
details.arch{margin-top:18px}
details.arch summary{cursor:pointer; font-weight:800; color:var(--muted); padding:6px 0}
</style>
</head>

const DAY = 86400000;
function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const opts = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('en-GB', opts);
}
function fmtWhen(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.round(diff / 60000) + ' min ago';
  if (diff < DAY) return Math.round(diff / 3600000) + ' hr ago';
  return fmtDate(ts);
}
function dueEnd(a) { return a.due ? new Date(a.due + 'T' + (a.dueTime || '23:59') + ':59').getTime() : null; }
function dueChip(a) {
  if (!a.due) return '';
  const t = a.dueTime ? ' ' + a.dueTime : '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((new Date(a.due + 'T00:00:00') - today) / DAY);
  if (days < 0 || dueEnd(a) < Date.now()) return `<span class="chip red">${ic('i-cal')} was due ${fmtDate(dueEnd(a))}${t}</span>`;
  if (days === 0) return `<span class="chip amber">${ic('i-cal')} due today${t}</span>`;
  if (days === 1) return `<span class="chip amber">${ic('i-cal')} due tomorrow${t}</span>`;
  return `<span class="chip grey">${ic('i-cal')} due ${fmtDate(dueEnd(a))}${t}</span>`;
}

}

function publishSweep() {
  const now = Date.now();

  db.assignments.forEach(a => {
    if (a.publishAt && a.publishAt <= now && !a.publishNotified) {

      }

}

/* ---------- persistent storage ----------

   outgrows localStorage's quota — Safari file:// pages get only ~2–3MB.
   localStorage remains the fallback and the migration source for old demos. */
let _idb = null;
const idbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function idbOpen() {
  const q = indexedDB.open('classdrop', 1);
  q.onupgradeneeded = () => q.result.createObjectStore('kv');
  return idbReq(q);
}
const idbGet = k => idbReq(_idb.transaction('kv').objectStore('kv').get(k));
const idbPut = (k, v) => idbReq(_idb.transaction('kv', 'readwrite').objectStore('kv').put(v, k));
const idbDel = k => idbReq(_idb.transaction('kv', 'readwrite').objectStore('kv').delete(k));

async function bootDB() {
  try { _idb = await idbOpen(); } catch (e) { _idb = null; }
  let stored = null;
  if (_idb) { try { stored = await idbGet(DB_KEY); } catch (e) {} }
  if (!stored) {
    try { stored = JSON.parse(localStorage.getItem(DB_KEY)); } catch (e) {}
    if (stored && _idb) { try { await idbPut(DB_KEY, stored); localStorage.removeItem(DB_KEY); } catch (e) {} }
  }
  db = stored && stored.users ? stored : seedDemo();
  migrateDB();
}

function loadDB() { // sync path, used only where IndexedDB is unavailable
  try { db = JSON.parse(localStorage.getItem(DB_KEY)); } catch (e) { db = null; }
  if (!db || !db.users) db = seedDemo();
  migrateDB();
}

/* bring older saved demos up to date (co-teachers, second demo teacher, the school layer) */
function migrateDB() {
  let changed = false;
  db.classes.forEach(c => { if (!c.teachers || !c.teachers.length) { c.teachers = [c.teacher]; changed = true; } });
  if (!db.users.some(u => u.role === 'teacher' && u.id !== 'u-tay')) {
    db.users.push({ id: 'u-ose', name: 'Mr Osei', role: 'teacher' });
    const c2 = db.classes.find(c => c.id === 'c2');
    if (c2 && !c2.teachers.includes('u-ose')) c2.teachers.push('u-ose');
    changed = true;

/* Safari won't play <video>/<audio> from a data: URL, so serve each stored item's
   bytes through a blob: URL instead (also enables seeking); cached per object */
const _mediaURL = new WeakMap();
const _mediaBlobs = new Map(); // blob URL -> Blob, for stall recovery below
function mediaURL(o) {
  let u = _mediaURL.get(o);
  if (!u) {
    try {
      // split at ';base64,' — recorder mime types can contain commas
      // (e.g. video/mp4; codecs=avc1.42000a,mp4a.40.2), so splitting on the
      // first comma would grab codec soup instead of the payload
      const cut = o.data.indexOf(';base64,');
      if (cut < 0) throw new Error('not base64');
      const head = o.data.slice(0, cut);
      const b64 = o.data.slice(cut + 8);
      const mime = (head.match(/^data:([^;]*)/) || [])[1] || '';
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      const blob = new Blob([bytes], { type: mime });
      u = URL.createObjectURL(blob);
      _mediaBlobs.set(u, blob);
    } catch (e) { u = o.data; }
    _mediaURL.set(o, u);
  }
  return u;
}

/* WebKit's media loader can wedge for the rest of the page's life after
   MediaRecorder has been used (players sit at readyState 0 with a crossed-out
   play button, even though the recording itself is fine, and no amount of
   load() retries recovers them). A fresh page load always plays, so: watch
   just-rendered players, try one gentle retry, and if a player is still stuck
   reload the page once — boot restores the current screen from history.state. */
function nudgeStalledMedia() {
  document.querySelectorAll('video[src^="blob:"],audio[src^="blob:"]').forEach(el => {
    if (el.dataset.nudge) return;
    el.dataset.nudge = '1';
    setTimeout(() => {
      if (!document.contains(el) || el.readyState > 0) return;
      const blob = _mediaBlobs.get(el.src);
      if (blob) { el.src = URL.createObjectURL(blob); _mediaBlobs.set(el.src, blob); el.load(); }
      setTimeout(() => {
        if (!document.contains(el) || el.readyState > 0) return;
        if (document.querySelector('.modal-scrim, .cv-wrap')) return; // never mid-dialog or mid-edit
        if (saveDB.failed) return; // something is unsaved — a reload would lose it
        const last = +sessionStorage.getItem('cd-media-reload') || 0;
        if (Date.now() - last < 15000) return; // one shot — no reload loops
        sessionStorage.setItem('cd-media-reload', String(Date.now()));
        history.replaceState({ view }, '');
        location.reload();
      }, 2000);
    }, 2500);
  });
}

function classCode() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 5; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

/* a little demo "screenshot" drawn at seed time so annotation can be tried */
function makeDemoImage() {
  const cv = document.createElement('canvas'); cv.width = 420; cv.height = 300;
  const x = cv.getContext('2d');
  x.fillStyle = '#1b2a4a'; x.fillRect(0, 0, 420, 300);
  x.strokeStyle = '#e8c15a'; x.lineWidth = 14; x.lineCap = 'square';
  [[30,30,390,30],[30,30,30,270],[30,270,390,270],[390,30,390,150],[110,110,300,110],[110,110,110,210],[200,190,200,270],[300,110,300,220]]
    .forEach(([a,b,c,d]) => { x.beginPath(); x.moveTo(a,b); x.lineTo(c,d); x.stroke(); });
  x.fillStyle = '#f0a331'; x.beginPath(); x.arc(70, 240, 16, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#5fca7a'; x.fillRect(350, 55, 26, 26);
  return cv.toDataURL('image/png');
}

/* a simple demo school crest (gold shield + monogram) so the letterhead has something */
function makeDemoLogo() {
  const cv = document.createElement('canvas'); cv.width = 120; cv.height = 120;
  const x = cv.getContext('2d');
  x.fillStyle = '#8a6a2f';
  x.beginPath(); x.moveTo(60, 8); x.lineTo(108, 26); x.lineTo(108, 62);
  x.quadraticCurveTo(108, 100, 60, 114); x.quadraticCurveTo(12, 100, 12, 62);
  x.lineTo(12, 26); x.closePath(); x.fill();
  x.fillStyle = '#ae853e';
  x.beginPath(); x.moveTo(60, 18); x.lineTo(99, 33); x.lineTo(99, 62);
  x.quadraticCurveTo(99, 92, 60, 104); x.quadraticCurveTo(21, 92, 21, 62);
  x.lineTo(21, 33); x.closePath(); x.fill();
  x.fillStyle = '#fff'; x.font = '800 42px Montserrat, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('OP', 60, 60);
  return cv.toDataURL('image/png');
}

/* ---------- accessors ---------- */
const me = () => db.users.find(u => u.id === db.session);
/* staff can hold two hats: classroom teaching and the school office. `role` is the
   primary one; alsoAdmin / alsoTeacher add the second. Dual-role staff switch hats
   from the sidebar, and every screen keeps branching on isTeacher()/isAdmin(). */
const canTeach = u => !!u && (u.role === 'teacher' || u.alsoTeacher);
const canOffice = u => !!u && (u.role === 'admin' || u.alsoAdmin);
const dualRole = u => canTeach(u) && canOffice(u);
function activeHat() {
  const u = me();
  if (!dualRole(u)) return canOffice(u) ? 'office' : 'teaching';
  return db.hat === 'office' || db.hat === 'teaching' ? db.hat : (u.role === 'admin' ? 'office' : 'teaching');
}
const isTeacher = () => canTeach(me()) && activeHat() === 'teaching';
const isParent = () => me() && me().role === 'parent';
const isAdmin = () => canOffice(me()) && activeHat() === 'office';
const mySchool = () => db.schools.find(s => s.id === me().schoolId) || db.schools[0];
const schoolUsers = role => db.users.filter(u => u.role === role && u.schoolId === mySchool().id);
/* everyone who teaches / everyone with office access, dual-role staff included */
const schoolTeaching = () => db.users.filter(u => canTeach(u) && u.schoolId === mySchool().id);
const schoolOffice = () => db.users.filter(u => canOffice(u) && u.schoolId === mySchool().id);
const schoolStaff = () => db.users.filter(u => (canTeach(u) || canOffice(u)) && u.schoolId === mySchool().id);

const feat = k => { const s = me() ? mySchool() : null; return !s || !s.features || s.features[k] !== false; };
const user = id => db.users.find(u => u.id === id) || { name: 'Unknown', role: 'student' };
const klass = id => db.classes.find(c => c.id === id);
const classTeachers = c => (c.teachers && c.teachers.length ? c.teachers : [c.teacher]);
const assignment = id => db.assignments.find(a => a.id === id);
function myClasses(includeArchived) {
  const u = me();
  let list;
  if (canTeach(u)) list = db.classes.filter(c => classTeachers(c).includes(u.id));
  else if (u.role === 'parent') list = db.classes.filter(c => c.students.includes(u.childId));
  else list = db.classes.filter(c => c.students.includes(u.id));
  return includeArchived ? list : list.filter(c => !c.archived);
}
const handinKey = (aid, sid) => aid + '_' + sid;
const handin = (aid, sid) => db.handins[handinKey(aid, sid)] || { status: 'none' };
const gradeOf = (aid, sid) => db.grades[handinKey(aid, sid)] || null;
const folderItems = (aid, sid) => db.items
  .filter(i => i.assignmentId === aid && i.studentId === sid)
  .sort((a, b) => a.ts - b.ts);
const parentsOf = sid => db.users.filter(u => u.role === 'parent' && u.childId === sid).map(u => u.id);
const teachesStudent = sid => myClasses(true).some(c => c.students.includes(sid));
const readingOf = sid => (db.reading && db.reading[sid]) || [];
const canEditReading = sid => (isParent() && me().childId === sid) || (canTeach(me()) && teachesStudent(sid));
const canViewReading = sid => canEditReading(sid) || (isStudent() && me().id === sid) || (isAdmin() && user(sid).schoolId === mySchool().id);
const isStudent = () => me() && me().role === 'student';

function statusChip(aid, sid) {
  const h = handin(aid, sid);
  if (h.status === 'reviewed') return `<span class="chip green">${ic('i-tick')} Reviewed</span>`;
  if (h.status === 'in') return `<span class="chip amber">${ic('i-inbox')} Handed in</span>`;
  if (folderItems(aid, sid).some(i => i.authorId === sid && i.kind !== 'sticker')) return `<span class="chip blue">Started</span>`;
  return `<span class="chip grey">Waiting</span>`;
}
function toReviewCount(aid) {
  const c = klass(assignment(aid).classId);
  return c.students.filter(s => handin(aid, s).status === 'in').length;
}

/* ---------- notifications ---------- */
function notify(userIds, text, link) {
  const ts = Date.now();
  [...new Set(userIds)].filter(u => u && u !== db.session).forEach(userId =>
    db.notifications.unshift({ id: uid(), userId, text, ts, read: false, link }));

}
