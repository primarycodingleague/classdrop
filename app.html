/* new task AND edit task */
/* template: prefill a NEW task from a snapshot (reuse / staff library / canvas) — saves as a fresh copy */
function openTaskModal(classId, existing, template) {
  const src = existing || template;
  let attachments = existing ? existing.attachments.slice() : template ? template.attachments : [];
  const m = openModal(`
    <h3>${ic('i-task')} ${existing ? 'Edit task' : template ? 'Reuse as a new task' : 'New task'}</h3>
    <p class="m-sub">${template ? `This copy is yours to change for ${esc(klass(classId).name)} — the original is untouched.`
      : `Every student gets their own private folder, plus there's a shared folder the whole class can see.`}</p>
    <label>Title</label><input id="nt-title" maxlength="80" placeholder="e.g. Design a game character" value="${src ? esc(src.title) : ''}">
    <label>Instructions</label><textarea id="nt-inst" placeholder="What should students do?">${src ? esc(src.instructions) : ''}</textarea>
    <div class="form-2col">
      <div><label>Publish</label>
        <select id="nt-pub">
          <option value="now" ${!existing || !existing.publishAt ? 'selected' : ''}>Straight away</option>
          <option value="later" ${existing && existing.publishAt ? 'selected' : ''}>Schedule for later…</option>
        </select></div>
      <div id="nt-pub-when" style="${existing && existing.publishAt ? '' : 'display:none'}">
        <label>Goes live on</label>
        <span style="display:flex;gap:8px">
          <input id="nt-pub-date" type="date" value="${existing && existing.publishAt ? new Date(existing.publishAt).toISOString().slice(0, 10) : ''}">
          <input id="nt-pub-time" type="time" style="max-width:120px" value="${existing && existing.publishAt ? ('0' + new Date(existing.publishAt).getHours()).slice(-2) + ':' + ('0' + new Date(existing.publishAt).getMinutes()).slice(-2) : '09:00'}">
        </span></div>
      <div><label>Due date (optional)</label><input id="nt-due" type="date" value="${src && src.due ? src.due : ''}"></div>
      <div><label>Due time (optional)</label><input id="nt-time" type="time" value="${src ? src.dueTime || '' : ''}"></div>
      <div><label>Points (optional — turns on grading)</label><input id="nt-outof" type="number" min="1" max="1000" placeholder="e.g. 10" value="${src && src.outOf ? src.outOf : ''}"></div>
      <div><label>Attach a resource (optional)</label>
        <span style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px">
          <button class="btn sec small" id="nt-att">${ic('i-clip')} Add file</button>
          <button class="btn sec small" id="nt-canvas">${ic('i-canvas')} New canvas</button>
        </span>
        <input type="file" id="nt-file" class="sr-only"></div>
    </div>
    <div id="nt-atts"></div>
    <label class="check-row" style="margin-top:12px"><input type="checkbox" id="nt-autolock" ${src && src.autoLock ? 'checked' : ''}> Lock automatically when the due date passes</label>
    <label class="check-row"><input type="checkbox" id="nt-shpost" ${src ? (src.sharedPosting ? 'checked' : '') : 'checked'}> Students can post in the shared folder</label>
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-send')} ${existing ? 'Save changes' : 'Set task'}</button>
    </div>`);
  /* while a canvas editor is open on top, hide this modal, restore after */
  const editorOpts = extra => Object.assign({ onExit: () => { m.style.display = ''; } }, extra);
  const drawAtts = () => {
    m.querySelector('#nt-atts').innerHTML = attachments.map((at, i) => `
      <div class="att-row">${at.kind === 'canvas' ? ic('i-canvas') : ic('i-clip')}<b>${esc(at.name)}</b>
        ${at.kind === 'canvas' ? `<button class="btn ghost small" data-edit="${i}">${ic('i-pencil')} Edit</button>`
          : (at.type && at.type.startsWith('image/')) || docKind(at.name, at.type) ? `<button class="btn ghost small" data-anno="${i}">${ic('i-pencil')} Annotate</button>` : ''}
        <button class="btn ghost small" data-rm="${i}">${ic('i-x')}</button>
      </div>`).join('');
    m.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { attachments.splice(+b.dataset.rm, 1); drawAtts(); });
    m.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      const at = attachments[+b.dataset.edit];
      m.style.display = 'none';
      openCanvasEditor({ name: at.name, canvas: at.canvas }, editorOpts({
        onSave: (canvas, preview, title) => { at.canvas = canvas; at.data = preview; at.name = title; drawAtts(); },
        onRecording: data => { attachments.push({ name: 'Presentation', type: 'video/webm', data }); drawAtts(); },
      }));
    });
    m.querySelectorAll('[data-anno]').forEach(b => b.onclick = () => {
      const idx = +b.dataset.anno, at = attachments[idx];
      m.style.display = 'none';
      if (docKind(at.name, at.type)) {
        // the annotated canvas REPLACES the original document — only ever one version
        openDocOnCanvas(at.data, at.name, at.type, editorOpts({
          onSave: (canvas, preview, title) => {
            const i = attachments.indexOf(at);
            const newAt = { kind: 'canvas', name: title, canvas, data: preview };
            if (i >= 0) attachments.splice(i, 1, newAt); else attachments.push(newAt);
            drawAtts();
          },
          onRecording: data => { attachments.push({ name: 'Presentation', type: 'video/webm', data }); drawAtts(); },
        }));
      } else {
        annotateImageToCanvas(at.data, at.name, (canvas, preview, title) => {
          attachments[idx] = { kind: 'canvas', name: title, canvas, data: preview };
          drawAtts();
        }, editorOpts({}));
      }
    });
  };
  drawAtts();
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('#nt-canvas').onclick = () => {
    m.style.display = 'none';
    openCanvasEditor(null, editorOpts({
      onSave: (canvas, preview, title) => { attachments.push({ kind: 'canvas', name: title, canvas, data: preview }); drawAtts(); },
      onRecording: data => { attachments.push({ name: 'Presentation', type: 'video/webm', data }); drawAtts(); },
    }));
  };
  m.querySelector('#nt-att').onclick = () => m.querySelector('#nt-file').click();
  m.querySelector('#nt-file').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > MAX_FILE) { toast('That file is too big for the demo (4MB max).', true); return; }
    const r = new FileReader();
    r.onload = () => { attachments.push({ name: f.name, type: f.type, data: r.result }); drawAtts(); };
    r.readAsDataURL(f);
  };
  m.querySelector('#nt-pub').onchange = e =>
    m.querySelector('#nt-pub-when').style.display = e.target.value === 'later' ? '' : 'none';
  m.querySelector('[data-go]').onclick = () => {
    const title = m.querySelector('#nt-title').value.trim();
    if (!title) { toast('Give the task a title', true); return; }
    let publishAt = null;
    if (m.querySelector('#nt-pub').value === 'later') {
      const pd = m.querySelector('#nt-pub-date').value;
      if (!pd) { toast('Pick a date for the task to go live', true); return; }
      publishAt = new Date(pd + 'T' + (m.querySelector('#nt-pub-time').value || '09:00')).getTime();
    }
    const vals = {
      title, instructions: m.querySelector('#nt-inst').value.trim(),
      due: m.querySelector('#nt-due').value || null, dueTime: m.querySelector('#nt-time').value || '',
      outOf: +m.querySelector('#nt-outof').value || null,
      autoLock: m.querySelector('#nt-autolock').checked,
      sharedPosting: m.querySelector('#nt-shpost').checked,
      attachments, publishAt,
      publishNotified: publishAt && publishAt > Date.now() ? false : (existing ? existing.publishNotified !== false : true),
    };
    if (existing) {
      Object.assign(existing, vals);
      saveDB(); m.remove(); render();
      toast(publishAt && publishAt > Date.now() ? 'Task updated — scheduled for ' + fmtDate(publishAt) : 'Task updated');
    } else {
      const a = Object.assign({ id: uid(), classId, createdAt: Date.now(), locked: false, archived: false }, vals);
      db.assignments.push(a);
      const c = klass(classId);
      if (isLive(a)) {
        a.publishNotified = true;
        notify(c.students, `New task in ${c.name}: “${title}”`, { page: 'folder', classId, assignmentId: a.id });
      }
      saveDB(); m.remove();
      go({ page: 'assignment', classId, assignmentId: a.id });
      toast(isLive(a) ? 'Task set — every student has a folder for it'
        : 'Task scheduled — students will see it on ' + fmtDate(a.publishAt));
    }
  };
  m.querySelector('#nt-title').focus();
}

/* ---------- reuse & staff sharing ----------
   a "template" is a plain snapshot of a task's settings (never its student work).
   Attachment objects are copied so later edits can't leak back into the source;
   the canvas data inside is safely shared because the editor deep-copies on open. */
function taskTemplate(a) {
  return { title: a.title, instructions: a.instructions, due: a.due || null, dueTime: a.dueTime || '',
    outOf: a.outOf || null, autoLock: !!a.autoLock, sharedPosting: a.sharedPosting !== false,
    attachments: (a.attachments || []).map(at => Object.assign({}, at)) };
}

function pickClass(title, sub, onPick) {
  const targets = db.classes.filter(c => classTeachers(c).includes(db.session) && !c.archived);
  if (!targets.length) { toast('You need a class first — create one from the sidebar.', true); return; }
  if (targets.length === 1) { onPick(targets[0].id); return; }
  const m = openModal(`
    <h3>${ic('i-class')} ${title}</h3>
    <p class="m-sub">${sub}</p>
    <label>Which class?</label>
    <select id="pc-sel">${targets.map(c => `<option value="${c.id}" ${c.id === view.classId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-tick')} Choose class</button>
    </div>`);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('[data-go]').onclick = () => { const cid = m.querySelector('#pc-sel').value; m.remove(); onPick(cid); };
}

function openReuseTask(a) {
  pickClass('Reuse this task', 'Makes a fresh copy you can edit before it goes out — student work is not copied.',
    cid => openTaskModal(cid, null, taskTemplate(a)));
}

function shareTaskWithStaff(a) {
  if (db.taskLibrary.some(t => t.sourceId === a.id)) { toast('Already in the staff library — colleagues can see it.'); return; }
  db.taskLibrary.push(Object.assign({ id: uid(), sourceId: a.id, ownerId: db.session, schoolId: me().schoolId, ts: Date.now() }, taskTemplate(a)));
  notify(schoolUsers('teacher').map(t => t.id), `${me().name} shared a task with staff: “${a.title}”`, { page: 'library' });
  saveDB(); render(); toast('Shared with staff — colleagues will find it in their Library');
}

/* ---------- teacher library: canvases that live outside any task ---------- */
function openLibraryCanvas(entry) { // entry from db.canvases, or null to start a new one
  openCanvasEditor(entry, {
    onSave: (canvas, preview, title) => {
      if (entry) Object.assign(entry, { canvas, data: preview, name: title, updated: Date.now() });
      else db.canvases.push({ id: uid(), ownerId: db.session, schoolId: me().schoolId, kind: 'canvas',
        name: title, canvas, data: preview, shared: false, ts: Date.now(), updated: Date.now() });
      saveDB(); render(); toast('Saved to your Library');
    },
    onRecording: data => { // presentations recorded here become library items too
      db.canvases.push({ id: uid(), ownerId: db.session, schoolId: me().schoolId, kind: 'file',
        name: (entry && entry.name ? entry.name + ' — ' : '') + 'Presentation', type: 'video/webm', data,
        shared: false, ts: Date.now(), updated: Date.now() });
      saveDB(); render(); // the library page sits behind the editor — keep it current
    },
  });
}

function useCanvasInTask(cv) {
  pickClass('Use this in a task', 'Starts a new task with it attached — you can edit everything before it goes out.', cid =>
    openTaskModal(cid, null, { title: cv.name, instructions: '', due: null, dueTime: '', outOf: null,
      autoLock: false, sharedPosting: true,
      attachments: [cv.kind === 'file' ? { name: cv.name, type: cv.type, data: cv.data }
                                       : { kind: 'canvas', name: cv.name, canvas: cv.canvas, data: cv.data }] }));
}

function renderLibrary(main) {
  const sortRecent = (a, b) => (b.updated || b.ts) - (a.updated || a.ts);
  const mine = db.canvases.filter(cv => cv.ownerId === db.session).sort(sortRecent);
  const shared = db.canvases.filter(cv => cv.shared && cv.ownerId !== db.session && cv.schoolId === me().schoolId).sort(sortRecent);
  const templates = db.taskLibrary.filter(t => t.schoolId === me().schoolId).sort((a, b) => b.ts - a.ts);
  const cvCard = (cv, own) => `
    <div class="lib-card">
      ${cv.kind === 'file'
        ? `<video class="lib-prev" src="${mediaURL(cv)}" controls preload="metadata" playsinline></video>`
        : `<button class="lib-prev" data-open="${cv.id}" title="${own ? 'Open and edit' : 'Open'}">${cv.data ? `<img src="${cv.data}" alt="">` : ic('i-canvas', 'big')}</button>`}
      <div class="lib-body"><b>${esc(cv.name)}</b>

        ${t.ownerId === db.session ? `<button class="btn ghost small" data-tpl-rm="${t.id}" aria-label="Remove">${ic('i-trash')}</button>` : ''}
      </span>
    </div>`;
  main.innerHTML = `
    <div class="page-head"><h2>Library</h2><span class="spacer"></span>
      <button class="btn" id="lib-new">${ic('i-canvas')} New canvas</button></div>
    <p class="page-sub">Canvases and tasks to use again and again — and share with other staff at ${esc(mySchool().name)}.</p>
    <h3 style="margin:0 0 12px">My canvases</h3>
    ${mine.length ? `<div class="lib-grid">${mine.map(cv => cvCard(cv, true)).join('')}</div>`
      : `<div class="card empty">${ic('i-canvas', 'big')}Nothing here yet — press “New canvas” to make one without setting a task, then use it in as many tasks as you like.</div>`}
    <h3 style="margin:22px 0 12px">Shared by colleagues</h3>

  main.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {

  main.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    db.canvases.push(Object.assign({}, find(b.dataset.copy), { id: uid(), ownerId: db.session, shared: false, ts: Date.now(), updated: Date.now() }));
    saveDB(); render(); toast('Copied into your Library');
  });
  main.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const cv = find(b.dataset.del);
    openConfirm(`Delete “${esc(cv.name)}”?`, (cv.shared ? 'Colleagues will lose it too. ' : '') + 'Tasks that already use it keep their own copy.', () => {
      db.canvases = db.canvases.filter(x => x.id !== cv.id); saveDB(); render(); toast('Deleted');
    });
  });
  main.querySelectorAll('[data-tpl-use]').forEach(b => b.onclick = () => {
    const t = db.taskLibrary.find(x => x.id === b.dataset.tplUse);
    pickClass('Use this task', 'Makes your own copy to edit before it goes out.', cid => openTaskModal(cid, null, taskTemplate(t)));
  });
  main.querySelectorAll('[data-tpl-rm]').forEach(b => b.onclick = () =>
    openConfirm('Remove this shared task?', 'It disappears from the staff library. Tasks already set from it are not affected.', () => {
      db.taskLibrary = db.taskLibrary.filter(x => x.id !== b.dataset.tplRm); saveDB(); render(); toast('Removed');
    }));
}

function openLinkModal(onGo) {
  const m = openModal(`
    <h3>${ic('i-link')} Add a link</h3>
    <label>Web address</label><input id="lk-url" placeholder="https://…" inputmode="url">
    <label>What is it? (optional)</label><input id="lk-label" placeholder="e.g. My Scratch project" maxlength="80">
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-tick')} Add link</button>
    </div>`);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('[data-go]').onclick = () => {
    let url = m.querySelector('#lk-url').value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch (e) { toast("That doesn't look like a web address.", true); return; }
    const label = m.querySelector('#lk-label').value.trim();
    m.remove(); onGo(url, label);
  };
  m.querySelector('#lk-url').focus();
}

function openStickerPicker(onPick) {
  const m = openModal(`

}

/* ---------- canvas editor (freeform board: pen, shapes, text, notes, images) ----------
   existing: a canvas item to reopen, or null for a new board.
   opts: { readOnly, onSave(canvasData, previewPNG, title) } */
const CV_COLORS = ['#33302b', '#c0392b', '#e67e22', '#ae853e', '#1d8a5f', '#3573a8', '#8e44ad'];
let cvClip = null; // canvas copy/paste clipboard (persists across editor sessions)
function openCanvasEditor(existing, opts) {
  const RO = !!opts.readOnly;
  const BLANK_BG = () => ({ pat: 'dots', col: '#fbf9f4' });
  let pages = existing && existing.canvas
    ? (existing.canvas.pages
        ? JSON.parse(JSON.stringify(existing.canvas.pages))
        : [{ objects: JSON.parse(JSON.stringify(existing.canvas.objects || [])), bg: BLANK_BG() }])
    : [{ objects: [], bg: BLANK_BG() }];
  pages.forEach(p => { p.objects = p.objects || []; p.bg = p.bg || BLANK_BG(); });
  let pageIdx = 0;
  let objects = pages[0].objects;
  const setObjects = arr => { objects = arr; pages[pageIdx].objects = arr; };
  let view = { x: 0, y: 0, scale: 1 };
  let tool = RO ? 'select' : 'pen', shape = 'rect', color = CV_COLORS[0], size = 4;
  let penKind = 'marker', stampChar = '⭐';
  let selId = null, drag = null, draft = null, dirty = false, presRec = null, ctxMenu = null, longPress = null;
  const undoStack = [], redoStack = [];
  const imgCache = {};

  const wrap = document.createElement('div');
  wrap.className = 'cv-wrap';
  wrap.innerHTML = `
    <div class="cv-head">
      <span class="mark">${MARK}</span>
      <input class="cv-title" id="cv-title" maxlength="60" value="${esc(existing && existing.name ? existing.name : 'Untitled canvas')}" ${RO ? 'disabled' : ''}>
      ${RO ? `<span class="chip grey">${ic('i-eye')} view only</span>` : `
      <button class="btn ghost small" id="cv-recbtn" title="Record yourself presenting this canvas — your voice, and your face if you want">${ic('i-record')} Record</button>`}
      <button class="btn ghost small" id="cv-present" title="Presentation mode — big view + laser pointer">${ic('i-laser')} Present</button>
      ${RO ? `<button class="btn ghost small" id="cv-close">${ic('i-x')} Close</button>`
           : `<button class="btn ghost small" id="cv-close">${ic('i-x')}<span class="sr-only">Discard</span></button>
              <button class="btn small" id="cv-done">${ic('i-tick')} Done</button>`}
    </div>
    <div class="cv-toolbar">
      <button class="cv-tool ${RO ? 'on' : ''}" data-tool="select" title="${RO ? 'Pan around' : 'Select, move & resize'}">${ic('i-select')}</button>
      ${RO ? '' : `
      <button class="cv-tool on" data-tool="pen" title="Draw">${ic('i-pencil')}</button>
      <button class="cv-tool" data-tool="eraser" title="Eraser — rub things out">${ic('i-eraser')}</button>
      <button class="cv-tool" data-tool="shape" title="Shape">${ic('i-shape')}</button>
      <button class="cv-tool" data-tool="text" title="Text">${ic('i-note')}</button>
      <button class="cv-tool" data-tool="note" title="Sticky note">${ic('i-sticky')}</button>
      <button class="cv-tool" data-tool="stamp" title="Stamps">${ic('i-stamp')}</button>
      <button class="cv-tool" data-tool="image" title="Add a picture">${ic('i-camera')}</button>
      <button class="cv-tool" id="cv-mic" title="Record a voice note onto the board">${ic('i-mic')}</button>`}
      <button class="cv-tool" data-tool="laser" title="Laser pointer — the trail fades, nothing is saved">${ic('i-laser')}</button>
      ${RO ? '' : `
      <span class="cv-sep"></span>
      <span id="cv-pens" style="display:none">
        <select class="cv-size" id="cv-pen-sel">
          <option value="marker" selected>Marker</option><option value="pencil">Pencil</option>
          <option value="highlighter">Highlighter</option><option value="rainbow">Rainbow pen</option>
        </select>
      </span>
      <span id="cv-shapes" style="display:none">
        <select class="cv-size" id="cv-shape-sel">
          <option value="rect">Rectangle</option><option value="ellipse">Circle</option>
          <option value="line">Line</option><option value="arrow">Arrow</option>
        </select>
      </span>
      <span id="cv-stamps" style="display:none">${['⭐','❤️','😀','👍','🎉','✅','🌈','🚀','⚽','🦄'].map((s, i) =>
        `<button class="cv-stamp ${i === 0 ? 'on' : ''}" data-stamp="${s}">${s}</button>`).join('')}</span>
      <canvas id="cv-spec" width="140" height="26" title="Pick any colour"></canvas>
      ${CV_COLORS.map((c, i) => `<button class="cv-swatch ${i === 0 ? 'on' : ''}" data-col="${c}" style="background:${c}" aria-label="colour"></button>`).join('')}
      <select class="cv-size" id="cv-size"><option value="2">Thin</option><option value="4" selected>Medium</option><option value="9">Thick</option></select>
      <span class="cv-sep"></span>
      <button class="cv-tool" id="cv-bg" title="Page background">${ic('i-bg')}</button>
      <button class="cv-tool" id="cv-undo" title="Undo">${ic('i-undo')}</button>
      <button class="cv-tool" id="cv-redo" title="Redo">${ic('i-redo')}</button>
      <button class="cv-tool" id="cv-del" title="Delete selected" style="display:none">${ic('i-trash')}</button>
      <input type="file" id="cv-file" accept="image/*" class="sr-only">`}
    </div>
    <div class="cv-body">
      <canvas id="cv-main"></canvas>
      <div class="cv-pages" id="cv-pages"></div>
      <div id="cv-rec-holder" style="position:absolute;top:12px;left:12px;right:90px;z-index:3"></div>
      <div class="cv-zoom">
        <button id="cv-zout" title="Zoom out">−</button>
        <span class="pct" id="cv-pct">100%</span>
        <button id="cv-zfit" title="Fit to work">${ic('i-fit')}</button>
        <button id="cv-zin" title="Zoom in">+</button>
      </div>
      ${RO ? '' : `<div class="cv-hint" id="cv-hint">Draw with the pen — or drag with Select to move things</div>`}
    </div>`;
  document.body.appendChild(wrap);

  const cv = wrap.querySelector('#cv-main'), ctx = cv.getContext('2d');
  const q = s => wrap.querySelector(s);

  /* ----- coords ----- */
  const toWorld = (sx, sy) => ({ x: sx / view.scale + view.x, y: sy / view.scale + view.y });
  const evPos = e => {
    const r = cv.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { sx: p.clientX - r.left, sy: p.clientY - r.top };
  };

  /* ----- object geometry ----- */
  function bbox(o) {
    if (o.type === 'stroke') {
      let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
      o.pts.forEach(p => { x1 = Math.min(x1, p[0]); y1 = Math.min(y1, p[1]); x2 = Math.max(x2, p[0]); y2 = Math.max(y2, p[1]); });
      return { x: x1 - o.size, y: y1 - o.size, w: x2 - x1 + o.size * 2, h: y2 - y1 + o.size * 2 };
    }
    if (o.type === 'line' || o.type === 'arrow')
      return { x: Math.min(o.x1, o.x2) - 6, y: Math.min(o.y1, o.y2) - 6, w: Math.abs(o.x2 - o.x1) + 12, h: Math.abs(o.y2 - o.y1) + 12 };
    if (o.type === 'text') {
      ctx.font = `${o.italic ? 'italic ' : ''}${o.bold === false ? '600' : '800'} ${o.fs}px ${o.font || 'Montserrat, sans-serif'}`;
      const lines = String(o.text).split('\n');
      const w = Math.max(...lines.map(l => ctx.measureText(l).width));
      return { x: o.x, y: o.y - o.fs, w, h: o.fs * 1.3 * lines.length };
    }
    if (o.type === 'stamp') return { x: o.x - 4, y: o.y - o.fs, w: o.fs * 1.25, h: o.fs * 1.25 };
    return { x: o.x, y: o.y, w: o.w, h: o.h };
  }
  function moveObj(o, dx, dy) {
    if (o.type === 'stroke') o.pts.forEach(p => { p[0] += dx; p[1] += dy; });
    else if (o.type === 'line' || o.type === 'arrow') { o.x1 += dx; o.y1 += dy; o.x2 += dx; o.y2 += dy; }
    else { o.x += dx; o.y += dy; }
  }
  /* ----- rotation ----- */
  const rotPoint = (x, y, cx, cy, ang) => {
    const cos = Math.cos(ang), sin = Math.sin(ang), dx = x - cx, dy = y - cy;
    return { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
  };
  const objCenter = o => { const b = bbox(o); return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; };
  /* map a world point into an object's unrotated space */
  const toObjSpace = (o, wx, wy) => {
    if (!o.rot) return { x: wx, y: wy };
    const c = objCenter(o);
    return rotPoint(wx, wy, c.x, c.y, -o.rot);
  };
  function drawObjR(c2, o) {
    if (!o.rot) { drawObject(c2, o); return; }
    const c = objCenter(o);
    c2.save(); c2.translate(c.x, c.y); c2.rotate(o.rot); c2.translate(-c.x, -c.y);
    drawObject(c2, o);
    c2.restore();
  }
  function hitTest(wx, wy) {
    for (let i = objects.length - 1; i >= 0; i--) {
      const o = objects[i], b = bbox(o), p = toObjSpace(o, wx, wy);
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return o.id;
    }
    return null;
  }
  function eraseAt(w) {
    const id = hitTest(w.x, w.y);
    if (!id) return;
    if (drag && !drag.snapped) { snap(); drag.snapped = true; }
    setObjects(objects.filter(o => o.id !== id));
    renderCV();
  }
  /* uniform scale about the selection's top-left, from the original object */
  function applyScale(o, orig, ax, ay, f) {
    const px = v => ax + (v - ax) * f, py = v => ay + (v - ay) * f;
    if (o.type === 'stroke') { o.pts = orig.pts.map(p => [px(p[0]), py(p[1])]); o.size = Math.max(1, orig.size * f); }
    else if (o.type === 'line' || o.type === 'arrow') {
      o.x1 = px(orig.x1); o.y1 = py(orig.y1); o.x2 = px(orig.x2); o.y2 = py(orig.y2);
      o.size = Math.max(1, orig.size * f);
    }
    else if (o.type === 'text') { o.x = px(orig.x); o.y = py(orig.y); o.fs = Math.max(9, orig.fs * f); }
    else if (o.type === 'stamp') { o.x = px(orig.x); o.y = py(orig.y); o.fs = Math.max(14, orig.fs * f); }
    else if (o.type === 'note') { o.x = px(orig.x); o.y = py(orig.y); o.w = Math.max(90, orig.w * f); }
    else { o.x = px(orig.x); o.y = py(orig.y); o.w = Math.max(8, orig.w * f); o.h = Math.max(8, orig.h * f); }
  }

  /* ----- drawing ----- */
  function noteLines(c2, o) {
    c2.font = '700 16px Montserrat, sans-serif';
    const words = String(o.text).split(/\s+/), lines = []; let cur = '';
    words.forEach(w => {
      if (c2.measureText(cur + (cur ? ' ' : '') + w).width > o.w - 24 && cur) { lines.push(cur); cur = w; }
      else cur += (cur ? ' ' : '') + w;
    });
    if (cur) lines.push(cur);
    return lines;
  }
  function drawObject(c2, o) {
    if (o.type === 'stroke') {
      const m = o.mode || 'marker';
      c2.save();
      c2.lineCap = 'round'; c2.lineJoin = 'round';
      if (m === 'rainbow') {
        for (let i = 1; i < o.pts.length; i++) {
          c2.strokeStyle = `hsl(${(i * 9) % 360},85%,55%)`; c2.lineWidth = o.size * 1.4;
          c2.beginPath(); c2.moveTo(o.pts[i - 1][0], o.pts[i - 1][1]); c2.lineTo(o.pts[i][0], o.pts[i][1]); c2.stroke();
        }
        c2.restore(); return;
      }
      if (m === 'highlighter') { c2.globalAlpha = .35; c2.lineWidth = o.size * 3.4; }
      else if (m === 'pencil') { c2.globalAlpha = .9; c2.lineWidth = Math.max(1, o.size * .55); }
      else c2.lineWidth = o.size;
      c2.strokeStyle = o.color;
      c2.beginPath();
      o.pts.forEach((p, i) => i ? c2.lineTo(p[0], p[1]) : c2.moveTo(p[0], p[1]));
      c2.stroke();
      c2.restore();
    } else if (o.type === 'stamp') {
      c2.font = `${o.fs}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      c2.fillText(o.text, o.x, o.y);
    } else if (o.type === 'audio') {
      c2.fillStyle = '#f4ecdc'; c2.strokeStyle = '#ae853e'; c2.lineWidth = 1.8;
      const rr = 14;
      c2.beginPath();
      c2.moveTo(o.x + rr, o.y); c2.arcTo(o.x + o.w, o.y, o.x + o.w, o.y + o.h, rr);
      c2.arcTo(o.x + o.w, o.y + o.h, o.x, o.y + o.h, rr); c2.arcTo(o.x, o.y + o.h, o.x, o.y, rr);
      c2.arcTo(o.x, o.y, o.x + o.w, o.y, rr); c2.closePath();
      c2.fill(); c2.stroke();
      c2.fillStyle = '#8a6a2f';
      c2.beginPath(); c2.moveTo(o.x + 16, o.y + 12); c2.lineTo(o.x + 16, o.y + o.h - 12); c2.lineTo(o.x + 34, o.y + o.h / 2); c2.closePath(); c2.fill();
      c2.font = '800 15px Montserrat, sans-serif';
      c2.fillText('Voice note', o.x + 44, o.y + o.h / 2 + 5);
    } else if (o.type === 'rect') {
      c2.strokeStyle = o.color; c2.lineWidth = o.size;
      c2.strokeRect(o.x, o.y, o.w, o.h);
    } else if (o.type === 'ellipse') {
      c2.strokeStyle = o.color; c2.lineWidth = o.size;
      c2.beginPath(); c2.ellipse(o.x + o.w / 2, o.y + o.h / 2, Math.abs(o.w / 2), Math.abs(o.h / 2), 0, 0, Math.PI * 2); c2.stroke();
    } else if (o.type === 'line' || o.type === 'arrow') {
      c2.strokeStyle = o.color; c2.lineWidth = o.size; c2.lineCap = 'round';
      c2.beginPath(); c2.moveTo(o.x1, o.y1); c2.lineTo(o.x2, o.y2); c2.stroke();
      if (o.type === 'arrow') {
        const ang = Math.atan2(o.y2 - o.y1, o.x2 - o.x1), L = 10 + o.size * 2;
        c2.beginPath();
        c2.moveTo(o.x2, o.y2);
        c2.lineTo(o.x2 - L * Math.cos(ang - .45), o.y2 - L * Math.sin(ang - .45));
        c2.moveTo(o.x2, o.y2);
        c2.lineTo(o.x2 - L * Math.cos(ang + .45), o.y2 - L * Math.sin(ang + .45));
        c2.stroke();
      }
    } else if (o.type === 'text') {
      c2.fillStyle = o.color;
      c2.font = `${o.italic ? 'italic ' : ''}${o.bold === false ? '600' : '800'} ${o.fs}px ${o.font || 'Montserrat, sans-serif'}`;
      const lines = String(o.text).split('\n');
      const ws = lines.map(l => c2.measureText(l).width);
      const bw = Math.max(...ws);
      lines.forEach((l, li) => {
        const dx = o.align === 'center' ? (bw - ws[li]) / 2 : o.align === 'right' ? bw - ws[li] : 0;
        c2.fillText(l, o.x + dx, o.y + li * o.fs * 1.3);
      });
    } else if (o.type === 'note') {
      const lines = noteLines(c2, o);
      o.h = Math.max(90, 34 + lines.length * 22);

      const loop = () => { if (!presRec) return; renderCV(); presRec.raf = requestAnimationFrame(loop); };
      loop();
      rec.start(1000);
      q('#cv-rec-holder').innerHTML = `
        <div class="rec-live"><span class="rec-dot"></span> Recording your presentation… <span id="cv-prec-time">0s</span>
          <span style="flex:1"></span>
          ${hasFace ? `<button class="btn ghost small" id="cv-prec-face">${ic('i-video')} Hide my face</button>` : ''}
          <button class="btn small" id="cv-prec-done">${ic('i-tick')} Finish</button>
          <button class="btn ghost small" id="cv-prec-cancel">${ic('i-x')}</button>
        </div>`;
      const ptick = setInterval(() => {
        if (!presRec) { clearInterval(ptick); return; }
        const el = q('#cv-prec-time');
        if (el) el.textContent = Math.round((Date.now() - presRec.t0) / 1000) + 's';
        if (Date.now() - presRec.t0 > 120000) { presRec.keep = true; presRec.rec.stop(); clearInterval(ptick); } // 2 min cap
      }, 500);
      const fb = q('#cv-prec-face');
      if (fb) fb.onclick = () => { presRec.face = !presRec.face; fb.innerHTML = presRec.face ? `${ic('i-video')} Hide my face` : `${ic('i-video')} Show my face`; };
      q('#cv-prec-done').onclick = () => { presRec.keep = true; presRec.rec.stop(); };
      q('#cv-prec-cancel').onclick = () => { presRec.keep = false; presRec.rec.stop(); };
    };
    // record a voice note straight onto the board
    q('#cv-mic').onclick = async () => {
      if (wrap.querySelector('.rec-live')) return;
      const stream = await getMedia({ audio: true });
      if (!stream) return;
      if (!window.MediaRecorder) { stream.getTracks().forEach(t => t.stop()); toast("Voice notes aren't supported in this browser.", true); return; }
      const rec = new MediaRecorder(stream);
      const chunks = [];
      let keep = false;
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        q('#cv-rec-holder').innerHTML = '';
        if (!keep) return;
        const blob = new Blob(chunks, { type: (rec.mimeType || 'audio/webm').split(';')[0] });
        if (blob.size > MAX_FILE) { toast('Recording too long for the demo.', true); return; }
        const r = new FileReader();
        r.onload = () => {
          snap();
          const c0 = toWorld(cv.clientWidth / 2, cv.clientHeight / 2);
          objects.push({ id: uid(), type: 'audio', x: c0.x - 85, y: c0.y - 24, w: 170, h: 48, data: r.result });
          renderCV();
          toast('Voice note pinned — double-tap it to play');
        };
        r.readAsDataURL(blob);
      };
      rec.start();
      const t0 = Date.now();
      q('#cv-rec-holder').innerHTML = `
        <div class="rec-live"><span class="rec-dot"></span> Recording… <span id="cv-rec-time">0s</span>
          <span style="flex:1"></span>
          <button class="btn small" id="cv-rec-done">${ic('i-tick')} Pin to board</button>
          <button class="btn ghost small" id="cv-rec-cancel">${ic('i-x')} Cancel</button>
        </div>`;
      const tick = setInterval(() => {
        const el = q('#cv-rec-time');
        if (!el) { clearInterval(tick); return; }
        el.textContent = Math.round((Date.now() - t0) / 1000) + 's';
        if (Date.now() - t0 > 60000) { keep = true; rec.stop(); clearInterval(tick); } // 1 min cap on the board
      }, 500);
      q('#cv-rec-done').onclick = () => { keep = true; rec.stop(); };
      q('#cv-rec-cancel').onclick = () => { keep = false; rec.stop(); };
    };
    q('#cv-undo').onclick = undo;
    q('#cv-redo').onclick = redo;
    q('#cv-del').onclick = () => { if (!selId) return; snap(); setObjects(objects.filter(o => o.id !== selId)); selId = null; renderCV(); };
    q('#cv-file').onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      if (f.size > MAX_FILE) { toast('That picture is too big for the demo (4MB max).', true); return; }
      const r = new FileReader();
      r.onload = () => {
        const el = new Image();
        el.onload = () => {
          const sc = Math.min(1, 320 / el.naturalWidth, 320 / el.naturalHeight);
          const pos = pendingImagePos || toWorld(cv.clientWidth / 2, cv.clientHeight / 2);
          snap();
          const o = { id: uid(), type: 'image', x: pos.x, y: pos.y, w: el.naturalWidth * sc, h: el.naturalHeight * sc, data: r.result };
          imgCache[o.id] = el;
          objects.push(o); renderCV();
        };
        el.src = r.result;
      };
      r.readAsDataURL(f);
      e.target.value = '';
    };
  }
  /* ----- copy / cut / paste / duplicate ----- */
  const cloneObj = o => JSON.parse(JSON.stringify(o));
  const selObj = () => objects.find(o => o.id === selId);
  function copySel(quiet) { const o = selObj(); if (!o) return false; cvClip = cloneObj(o); if (!quiet) toast('Copied'); return true; }
  function deleteSel() { if (!selId) return; snap(); setObjects(objects.filter(o => o.id !== selId)); selId = null; renderCV(); }
  function cutSel() { if (copySel(true)) { deleteSel(); toast('Cut'); } }
  function pasteClip(wx, wy) {
    if (!cvClip) return;
    const o = cloneObj(cvClip); o.id = uid();
    const b = bbox(o);
    if (wx != null) moveObj(o, wx - (b.x + b.w / 2), wy - (b.y + b.h / 2)); // drop centred on the point
    else moveObj(o, 24, 24); // paste with a small offset
    if (o.type === 'image') { const el = new Image(); el.onload = renderCV; el.src = o.data; imgCache[o.id] = el; }
    snap(); objects.push(o); selId = o.id; renderCV(); toast('Pasted');
  }
  function duplicateSel() { if (copySel(true)) pasteClip(); }
  function reorderSel(toFront) { const o = selObj(); if (!o) return; snap(); const arr = objects.filter(x => x.id !== o.id); toFront ? arr.push(o) : arr.unshift(o); setObjects(arr); renderCV(); }

  /* ----- right-click / long-press context menu ----- */
  function closeCtxMenu() { if (ctxMenu) { ctxMenu.remove(); ctxMenu = null; document.removeEventListener('pointerdown', ctxOutside, true); } }
  function ctxOutside(e) { if (ctxMenu && !ctxMenu.contains(e.target)) closeCtxMenu(); }
  function showCtxMenu(clientX, clientY, wp) {
    if (RO) return;
    closeCtxMenu();
    const o = selObj(), items = [];
    if (o) {
      items.push(['Copy', 'i-copy', () => copySel()]);
      items.push(['Cut', 'i-x', cutSel]);
      items.push(['Duplicate', 'i-copy', duplicateSel]);
      if (cvClip) items.push(['Paste here', 'i-clip', () => pasteClip(wp.x, wp.y)]);
      items.push(['sep']);
      items.push(['Bring to front', 'i-up', () => reorderSel(true)]);
      items.push(['Send to back', 'i-down', () => reorderSel(false)]);
      items.push(['Delete', 'i-trash', deleteSel, true]);
    } else if (cvClip) {
      items.push(['Paste here', 'i-clip', () => pasteClip(wp.x, wp.y)]);
    } else return;
    const menu = document.createElement('div');
    menu.className = 'cv-ctx';
    menu.innerHTML = items.map((it, i) => it[0] === 'sep' ? '<div class="sep"></div>'
      : `<button data-ci="${i}" class="${it[3] ? 'danger' : ''}">${ic(it[1])} ${it[0]}</button>`).join('');
    document.body.appendChild(menu);
    const r = menu.getBoundingClientRect();
    menu.style.left = Math.min(clientX, window.innerWidth - r.width - 8) + 'px';
    menu.style.top = Math.min(clientY, window.innerHeight - r.height - 8) + 'px';
    menu.querySelectorAll('[data-ci]').forEach(b => b.onclick = () => { const it = items[+b.dataset.ci]; closeCtxMenu(); it[2](); });
    ctxMenu = menu;
    setTimeout(() => document.addEventListener('pointerdown', ctxOutside, true), 0);
  }

  function keyHandler(e) {
    if (e.key === 'Escape') { if (ctxMenu) { closeCtxMenu(); return; } if (present) { togglePresent(false); return; } }
    if (RO || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && selId) { snap(); setObjects(objects.filter(o => o.id !== selId)); selId = null; renderCV(); return; }
    if (e.metaKey || e.ctrlKey) {
      const k = e.key.toLowerCase();
      if (k === 'z') { e.shiftKey ? redo() : undo(); e.preventDefault(); return; }
      if (k === 'y') { redo(); e.preventDefault(); return; }
      if (k === 'c' && selId) { copySel(); e.preventDefault(); return; }
      if (k === 'x' && selId) { cutSel(); e.preventDefault(); return; }
      if (k === 'd' && selId) { duplicateSel(); e.preventDefault(); return; }
      if (k === 'v' && cvClip) { pasteClip(); e.preventDefault(); return; } // else let the native paste event add an OS-clipboard image
    }
  }
  /* paste a picture straight from the system clipboard */
  function pasteHandler(e) {
    if (RO) return;
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (const it of items) {
      if (it.type && it.type.startsWith('image/')) {
        const file = it.getAsFile(); if (!file) continue;
        const r = new FileReader();
        r.onload = () => { const el = new Image(); el.onload = () => {
          const sc = Math.min(1, 320 / el.naturalWidth, 320 / el.naturalHeight);
          const c0 = toWorld(cv.clientWidth / 2, cv.clientHeight / 2);
          const o = { id: uid(), type: 'image', x: c0.x - el.naturalWidth * sc / 2, y: c0.y - el.naturalHeight * sc / 2, w: el.naturalWidth * sc, h: el.naturalHeight * sc, data: r.result };
          imgCache[o.id] = el; snap(); objects.push(o); selId = o.id; renderCV(); toast('Pasted picture');
        }; el.src = r.result; };
        r.readAsDataURL(file);
        e.preventDefault(); return;
      }
    }
  }

  /* ----- pages (Seesaw-style page rail) ----- */
  function renderPages() {
    const holder = q('#cv-pages');
    holder.innerHTML = pages.map((p, i) =>
      `<button class="cv-page ${i === pageIdx ? 'on' : ''}" data-page="${i}" title="Page ${i + 1}">${i + 1}</button>`).join('') +
      (RO ? '' : `
      <button class="cv-page-btn" id="cv-page-add" title="Add a page">${ic('i-plus')}</button>
      <button class="cv-page-btn" id="cv-page-dup" title="Duplicate this page">${ic('i-copy')}</button>
      ${pages.length > 1 ? `<button class="cv-page-btn" id="cv-page-del" title="Delete this page">${ic('i-trash')}</button>` : ''}`);
    holder.querySelectorAll('[data-page]').forEach(b => b.onclick = () => switchPage(+b.dataset.page));
    const ad = q('#cv-page-add');
    if (ad) ad.onclick = () => {
      pages.push({ objects: [], bg: { pat: pages[pageIdx].bg.pat, col: pages[pageIdx].bg.col } });
      dirty = true; switchPage(pages.length - 1);
    };
    const dp = q('#cv-page-dup');
    if (dp) dp.onclick = () => {
      pages.splice(pageIdx + 1, 0, JSON.parse(JSON.stringify(pages[pageIdx])));
      dirty = true; switchPage(pageIdx + 1);
    };
    const dl = q('#cv-page-del');
    if (dl) dl.onclick = () => openConfirm('Delete this page?', 'Everything on it will be removed.', () => {
      pages.splice(pageIdx, 1);
      dirty = true; switchPage(Math.min(pageIdx, pages.length - 1));
    });
  }
  function switchPage(i) {
    pageIdx = i;
    objects = pages[i].objects;
    selId = null; draft = null; drag = null;
    undoStack.length = 0; redoStack.length = 0;
    objects.filter(o => o.type === 'image' && !imgCache[o.id]).forEach(o => { const el = new Image(); el.onload = renderCV; el.src = o.data; imgCache[o.id] = el; });
    renderPages(); renderCV();
  }

  /* ----- zoom controls ----- */
  const zoomAt = f => {
    const cx = cv.clientWidth / 2, cy = cv.clientHeight / 2, before = toWorld(cx, cy);
    view.scale = Math.min(4, Math.max(.2, view.scale * f));
    const after = toWorld(cx, cy);
    view.x += before.x - after.x; view.y += before.y - after.y;
    renderCV();
  };
  q('#cv-zin').onclick = () => zoomAt(1.25);
  q('#cv-zout').onclick = () => zoomAt(1 / 1.25);
  const contentBounds = (arr = objects) => {
    if (!arr.length) return null;
    let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    arr.forEach(o => { const b = bbox(o); x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h); });
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  };
  const fit = () => {
    const b = contentBounds();
    if (!b) { view = { x: 0, y: 0, scale: 1 }; renderCV(); return; }
    const pad = 60;
    view.scale = Math.min(2, Math.max(.2, Math.min(cv.clientWidth / (b.w + pad * 2), cv.clientHeight / (b.h + pad * 2))));
    view.x = b.x + b.w / 2 - cv.clientWidth / 2 / view.scale;
    view.y = b.y + b.h / 2 - cv.clientHeight / 2 / view.scale;
    renderCV();
  };
  q('#cv-zfit').onclick = fit;

  /* ----- preview + close ----- */
  function makePreview() {
    const objs = pages[0].objects;
    const b = contentBounds(objs) || { x: 0, y: 0, w: 480, h: 320 };
    const pad = 30, W = 640;
    const sc = Math.min(1.4, W / (b.w + pad * 2));
    const H = Math.max(160, Math.round((b.h + pad * 2) * sc));
    const pc = document.createElement('canvas'); pc.width = W; pc.height = H;
    const px = pc.getContext('2d');
    px.fillStyle = pages[0].bg.col || '#fbf9f4'; px.fillRect(0, 0, W, H);
    px.scale(sc, sc);
    px.translate(-(b.x - pad) + (W / sc - (b.w + pad * 2)) / 2, -(b.y - pad));
    objs.forEach(o => drawObjR(px, o));
    return pc.toDataURL('image/png');
  }
  const close = () => {
    if (presRec) { presRec.keep = false; try { presRec.rec.stop(); } catch (e) {} }
    if (laserRAF) cancelAnimationFrame(laserRAF);
    closeCtxMenu();
    if (longPress) clearTimeout(longPress.timer);
    document.removeEventListener('keydown', keyHandler);
    document.removeEventListener('paste', pasteHandler);
    window.removeEventListener('resize', renderCV);
    wrap.remove();
    if (opts.onExit) opts.onExit();
  };
  q('#cv-close').onclick = () => {
    if (!RO && dirty) openConfirm('Close without saving?', "Your changes to this canvas will be lost.", close);
    else close();
  };
  const done = q('#cv-done');
  if (done) done.onclick = () => {
    const title = q('#cv-title').value.trim() || 'Untitled canvas';
    const preview = makePreview();
    close();
    opts.onSave({ pages }, preview, title);
  };

  window.addEventListener('resize', renderCV);
  // preload page-1 images, then first paint (+ fit when reopening existing work)
  objects.filter(o => o.type === 'image').forEach(o => { const el = new Image(); el.onload = renderCV; el.src = o.data; imgCache[o.id] = el; });
  renderPages();
  renderCV();
  if (existing && objects.length) fit();
}

/* ---------- media helpers (mic / camera, with clear permission errors) ---------- */
async function getMedia(constraints) {
  if (!window.isSecureContext) { toast('Recording needs a secure page \u2014 open ClassDrop at https:// or http://localhost.', true); return null; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast("This browser can't access the microphone or camera here.", true); return null; }
  try {
    const p = navigator.mediaDevices.getUserMedia(constraints);
    let settled = false;
    p.then(() => settled = true, () => settled = true);
    // some embedded views swallow the permission pop-up entirely \u2014 don't fail silently
    const hint = setTimeout(() => {
      if (!settled) toast("Waiting for the permission pop-up\u2026 if nothing appears, this window is blocking it \u2014 open ClassDrop in its own browser tab and try again.", true);
    }, 5000);
    const stream = await p;
    clearTimeout(hint);
    return stream;
  }
  catch (e) {
    if (['NotAllowedError', 'NotFoundError', 'NotReadableError', 'SecurityError'].includes(e.name)) {
      openMediaHelp(constraints.video ? 'camera' : 'microphone', e.name);
    } else {
      toast('Recording failed: ' + (e.name || e.message), true);
    }
    return null;
  }
}

/* step-by-step help when the camera/mic permission doesn't appear or is blocked */
function openMediaHelp(kind, errName) {
  const embedded = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  const isMac = /Mac/i.test(navigator.platform || '');
  const steps = [];
  if (embedded) steps.push(`<b>You're viewing ClassDrop inside another app's window</b>, which usually blocks permission pop-ups.
    Open <b>${esc(location.origin)}</b> in Chrome or Safari directly, then try again.`);
  if (errName === 'NotReadableError') steps.push(`Another app may be using the ${kind} right now (Zoom, Teams, FaceTime\u2026). Quit it and try again.`);
  steps.push(`Look at the <b>right-hand end of the address bar</b> for a small camera/microphone icon \u2014 click it and choose <b>Allow</b>.`);
  if (isMac) steps.push(`On a Mac the <b>browser itself</b> also needs permission: open <b>System Settings \u2192 Privacy &amp; Security \u2192 ${kind === 'camera' ? 'Camera' : 'Microphone'}</b>,
    switch on your browser (Chrome, Safari, Edge\u2026), then <b>quit and reopen the browser</b>.`);
  steps.push(`Then press the ${kind} button in ClassDrop again.`);
  const m = openModal(`
    <h3>${ic(kind === 'camera' ? 'i-camera' : 'i-mic')} Let's switch the ${kind} on</h3>
    <p class="m-sub">${errName === 'NotFoundError' ? `No ${kind} was found \u2014 if this device has one, it may be switched off for the browser.` : `The ${kind} is blocked at the moment. This usually takes one minute to fix:`}</p>
    <ol style="margin:0 0 4px 18px; padding:0; font-size:.93rem; line-height:1.55">
      ${steps.map(s => `<li style="margin-bottom:9px">${s}</li>`).join('')}
    </ol>
    <div class="m-actions"><button class="btn" data-x>${ic('i-tick')} Got it</button></div>`);
  m.querySelector('[data-x]').onclick = () => m.remove();
}

/* ---------- camera window: take a photo OR record a webcam video ---------- */
function openCameraModal(onCapture) {
  (async () => {
    let stream = await getMedia({ video: true, audio: true });
    if (!stream) stream = await getMedia({ video: true });
    if (!stream) return;
    const m = openModal(`
      <h3>${ic('i-camera')} Camera</h3>
      <div class="cam-stage"><video id="cam-v" autoplay muted playsinline></video></div>
      <div class="tx-row">
        <button class="tgl on" id="cam-mode-photo">${ic('i-camera')} Photo</button>
        <button class="tgl" id="cam-mode-video">${ic('i-video')} Video</button>
        <span id="cam-note" class="muted small"></span>
        <span style="flex:1"></span>
        <button class="btn ghost" data-x>Cancel</button>
        <button class="btn" id="cam-go">${ic('i-camera')} Take photo</button>
      </div>`);
    m.querySelector('.modal').classList.add('wide');
    const vEl = m.querySelector('#cam-v');
    vEl.srcObject = stream;
    const stopAll = () => stream.getTracks().forEach(t => t.stop());
    // if the dialog is dismissed any way at all, release the camera
    const holder = $('#modal-holder') || document.body;
    const obs = new MutationObserver(() => { if (!document.contains(m)) { stopAll(); obs.disconnect(); } });
    obs.observe(holder, { childList: true });
    let mode = 'photo', rec = null, chunks = [], t0 = 0, timer = null;
    const goBtn = m.querySelector('#cam-go');
    const setMode = mo => {
      if (rec) return; // not while recording
      mode = mo;
      m.querySelector('#cam-mode-photo').classList.toggle('on', mo === 'photo');
      m.querySelector('#cam-mode-video').classList.toggle('on', mo === 'video');
      goBtn.innerHTML = mo === 'photo' ? `${ic('i-camera')} Take photo` : `${ic('i-record')} Start recording`;
      m.querySelector('#cam-note').textContent = mo === 'video' && !stream.getAudioTracks().length ? 'No mic \u2014 video will be silent' : '';
    };
    m.querySelector('#cam-mode-photo').onclick = () => setMode('photo');
    m.querySelector('#cam-mode-video').onclick = () => setMode('video');
    m.querySelector('[data-x]').onclick = () => { if (rec) { try { rec.stop(); } catch (e) {} rec = null; } m.remove(); };
    goBtn.onclick = () => {
      if (mode === 'photo') {
        const c = document.createElement('canvas');
        c.width = vEl.videoWidth || 640; c.height = vEl.videoHeight || 480;
        c.getContext('2d').drawImage(vEl, 0, 0);
        const data = c.toDataURL('image/jpeg', .85);
        m.remove();
        onCapture({ kind: 'photo', data });
        return;
      }
      if (!rec) { // start video recording
        if (!window.MediaRecorder) { toast("This browser can't record video.", true); return; }
        chunks = [];
        try { rec = new MediaRecorder(stream, { videoBitsPerSecond: 900000 }); }
        catch (e) { rec = new MediaRecorder(stream); }
        rec.ondataavailable = ev => chunks.push(ev.data);
        rec.onstop = () => {
          clearInterval(timer);
          const blob = new Blob(chunks, { type: (rec.mimeType || 'video/webm').split(';')[0] });
          rec = null;
          if (blob.size > 8 * 1024 * 1024) { toast('That video is too big for the demo \u2014 keep it under ~1 minute.', true); m.remove(); return; }
          const r = new FileReader();
          r.onload = () => { m.remove(); onCapture({ kind: 'video', data: r.result }); };
          r.readAsDataURL(blob);
        };
        rec.start(1000);
        t0 = Date.now();
        goBtn.innerHTML = `${ic('i-tick')} Stop & add`;
        timer = setInterval(() => {
          m.querySelector('#cam-note').textContent = 'Recording\u2026 ' + Math.round((Date.now() - t0) / 1000) + 's';
          if (Date.now() - t0 > 60000 && rec) rec.stop(); // ~60s cap
        }, 500);
        return;
      }
      rec.stop();
    };
  })();
}

/* ---------- rich text editor for canvas text (font / size / style / align / colour) ---------- */
const CV_FONTS = [
  ['Montserrat, sans-serif', 'Montserrat'],
  ['Georgia, serif', 'Serif'],
  ['"Comic Sans MS", "Comic Sans", cursive', 'Fun'],
  ['"Courier New", monospace', 'Typewriter'],
  ['"Bradley Hand", "Segoe Script", "Comic Sans MS", cursive', 'Handwriting'],
];
function openTextModal(existing, penColor, onGo) {
  const st = {
    text: existing ? existing.text : '',
    font: existing && existing.font ? existing.font : CV_FONTS[0][0],
    fs: existing ? existing.fs : 26,
    bold: existing ? existing.bold !== false : true,
    italic: existing ? !!existing.italic : false,
    align: existing && existing.align ? existing.align : 'left',
    color: existing ? existing.color : penColor,
  };
  const m = openModal(`
    <h3>${ic('i-note')} ${existing ? 'Edit text' : 'Add text'}</h3>
    <textarea id="tx-in" placeholder="Type here \u2014 press Enter for a new line">${esc(st.text)}</textarea>
    <div class="tx-row">
      <select id="tx-font" style="width:auto">${CV_FONTS.map(([v, l]) => `<option value="${esc(v)}" ${v === st.font ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select id="tx-size" style="width:auto">${[[18, 'Small'], [26, 'Medium'], [38, 'Large'], [54, 'Huge']].map(([v, l]) => `<option value="${v}" ${v === st.fs ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button class="tgl ${st.bold ? 'on' : ''}" id="tx-b" title="Bold"><b>B</b></button>
      <button class="tgl ${st.italic ? 'on' : ''}" id="tx-i" title="Italic"><i>I</i></button>
      ${[['left', 'Left'], ['center', 'Middle'], ['right', 'Right']].map(([v, l]) =>
        `<button class="tgl tx-al ${st.align === v ? 'on' : ''}" data-al="${v}">${l}</button>`).join('')}
    </div>
    <div class="tx-row">${CV_COLORS.map(c2 => `<button class="cv-swatch ${c2 === st.color ? 'on' : ''}" data-tcol="${c2}" style="background:${c2}" aria-label="colour"></button>`).join('')}</div>
    <div class="m-actions">
      <button class="btn ghost" data-x>Cancel</button>
      <button class="btn" data-go>${ic('i-tick')} ${existing ? 'Save' : 'Add text'}</button>
    </div>`);
  m.querySelector('#tx-b').onclick = e => { st.bold = !st.bold; e.currentTarget.classList.toggle('on', st.bold); };
  m.querySelector('#tx-i').onclick = e => { st.italic = !st.italic; e.currentTarget.classList.toggle('on', st.italic); };
  m.querySelectorAll('.tx-al').forEach(b => b.onclick = () => {
    st.align = b.dataset.al;
    m.querySelectorAll('.tx-al').forEach(x => x.classList.toggle('on', x === b));
  });
  m.querySelectorAll('[data-tcol]').forEach(b => b.onclick = () => {
    st.color = b.dataset.tcol;
    m.querySelectorAll('[data-tcol]').forEach(x => x.classList.toggle('on', x === b));
  });
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('[data-go]').onclick = () => {
    const text = m.querySelector('#tx-in').value.replace(/\s+$/, '');
    if (!text.trim()) { toast('Type something first', true); return; }
    st.text = text;
    st.font = m.querySelector('#tx-font').value;
    st.fs = +m.querySelector('#tx-size').value;
    m.remove();
    onGo({ text: st.text, color: st.color, fs: st.fs, font: st.font, bold: st.bold, italic: st.italic, align: st.align });
  };
  m.querySelector('#tx-in').focus();
}

/* ---------- open the canvas editor seeded with an image (annotation) ---------- */
function annotateImageToCanvas(data, name, onSave, extraOpts) {
  const el = new Image();
  el.onload = () => {
    const sc = Math.min(1, 640 / el.naturalWidth, 480 / el.naturalHeight);
    const seed = { name: 'Notes on ' + (name || 'work'), canvas: { pages: [{
      objects: [{ id: uid(), type: 'image', x: 0, y: 0, w: el.naturalWidth * sc, h: el.naturalHeight * sc, data }],
      bg: { pat: 'plain', col: '#ffffff' } }] } };
    openCanvasEditor(seed, Object.assign({ onSave }, extraOpts || {}));
  };
  el.onerror = () => toast("Couldn't open that picture.", true);
  el.src = data;
}

/* ==========================================================================
   Document import — PDF / Word (.docx) / PowerPoint (.pptx) onto the canvas.
   Libraries lazy-load from a CDN on first use (needs the internet once).
   ========================================================================== */
const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const MAMMOTH_URL = 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';
const JSZIP_URL = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';

const _scriptCache = {};
function loadScript(src) {
  if (!_scriptCache[src]) _scriptCache[src] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = res;
    s.onerror = () => { delete _scriptCache[src]; rej(new Error('could not load a helper library — check the internet connection')); };
    document.head.appendChild(s);
  });
  return _scriptCache[src];
}

function docKind(name, type) {
  const n = (name || '').toLowerCase();
  if (type === 'application/pdf' || n.endsWith('.pdf')) return 'pdf';
  if (n.endsWith('.docx') || type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') return 'docx';
  if (n.endsWith('.pptx') || type === 'application/vnd.openxmlformats-officedocument.presentationml.presentation') return 'pptx';
  return null;
}

function dataToBuf(dataURL) {
  const b = atob(dataURL.split(',')[1]);
  const u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u.buffer;
}

/* one canvas page holding a full-page image */
function pageFromImage(data, w, h) {
  return { objects: [{ id: uid(), type: 'image', x: 0, y: 0, w, h, data }], bg: { pat: 'plain', col: '#f0ede6' } };
}

async function pdfToPages(buf) {
  await loadScript(PDFJS_URL);
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const n = Math.min(pdf.numPages, 15);
  const pages = [];
  for (let p = 1; p <= n; p++) {
    const page = await pdf.getPage(p);
    const vp0 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 1000 / vp0.width });
    const c = document.createElement('canvas');
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const cx = c.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
    // 'print' intent renders synchronously (no requestAnimationFrame loop),
    // which also survives throttled/background tabs
    await page.render({ canvasContext: cx, viewport: vp, intent: 'print' }).promise;
    pages.push(pageFromImage(c.toDataURL('image/jpeg', .85), c.width, c.height));
  }
  if (pdf.numPages > n) toast(`Long document — showing the first ${n} pages`);
  return pages;
}

/* word-wrap plain text onto A4-ish white pages (fallback + pptx body) */
function textToPages(text) {
  const W = 1000, H = 1294, PAD = 60, LH = 34;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const cx = c.getContext('2d');
  cx.font = '400 22px Georgia, serif';
  const lines = [];
  text.split(/\n/).forEach(para => {
    if (!para.trim()) { lines.push(''); return; }
    let cur = '';
    para.split(/\s+/).forEach(word => {
      if (cx.measureText(cur + (cur ? ' ' : '') + word).width > W - PAD * 2 && cur) { lines.push(cur); cur = word; }
      else cur += (cur ? ' ' : '') + word;
    });
    lines.push(cur);
  });
  const perPage = Math.floor((H - PAD * 2) / LH);
  const pages = [];
  for (let i = 0; i < lines.length; i += perPage) {
    const cp = document.createElement('canvas'); cp.width = W; cp.height = H;
    const px = cp.getContext('2d');
    px.fillStyle = '#fff'; px.fillRect(0, 0, W, H);
    px.fillStyle = '#222'; px.font = '400 22px Georgia, serif';
    lines.slice(i, i + perPage).forEach((l, j) => px.fillText(l, PAD, PAD + 24 + j * LH));
    pages.push(pageFromImage(cp.toDataURL('image/jpeg', .85), W, H));
  }
  return pages.length ? pages : null;
}

/* render mammoth's HTML via an SVG foreignObject, sliced into pages;
   returns null if the markup won't rasterise (caller falls back to text) */
async function htmlToPages(html) {
  let x = html.replace(/<(br|hr)(\s[^>]*)?>/gi, '<$1$2/>');
  const probe = new DOMParser().parseFromString('<div xmlns="http://www.w3.org/1999/xhtml">' + x + '</div>', 'application/xml');
  if (probe.querySelector('parsererror')) return null;
  const W = 1000, PAD = 50;
  const meas = document.createElement('div');
  meas.style.cssText = `position:fixed;left:-99999px;top:0;width:${W - PAD * 2}px;font:400 20px Georgia,serif;line-height:1.55`;
  meas.innerHTML = x;
  document.body.appendChild(meas);
  const H = Math.max(300, meas.scrollHeight + PAD * 2);
  meas.remove();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:${W}px;padding:${PAD}px;font:400 20px Georgia,serif;line-height:1.55;color:#222;background:#fff">${x}</div></foreignObject></svg>`;
  const img = new Image();
  const ok = await new Promise(res => { img.onload = () => res(true); img.onerror = () => res(false); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
  if (!ok) return null;
  const pageH = 1294, pages = [];
  for (let y = 0; y < H; y += pageH) {
    const h = Math.min(pageH, H - y);
    const c = document.createElement('canvas'); c.width = W; c.height = h;
    const cx = c.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, h);
    cx.drawImage(img, 0, y, W, h, 0, 0, W, h);
    pages.push(pageFromImage(c.toDataURL('image/jpeg', .85), W, h));
  }
  return pages;
}

async function docxToPages(buf) {
  await loadScript(MAMMOTH_URL);
  const out = await mammoth.convertToHtml({ arrayBuffer: buf });
  const html = out.value || '';
  let pages = null;
  try { pages = await htmlToPages(html); } catch (e) { pages = null; }
  if (!pages) {
    const div = document.createElement('div');
    div.innerHTML = html;
    pages = textToPages(div.textContent || '');
  }
  return pages;
}

async function pptxToPages(buf) {
  await loadScript(JSZIP_URL);
  const zip = await JSZip.loadAsync(buf);
  const names = Object.keys(zip.files)
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a, b) => +a.match(/\d+/)[0] - +b.match(/\d+/)[0])
    .slice(0, 20);
  if (!names.length) return null;
  const pages = [];
  for (const n of names) {
    const xml = await zip.file(n).async('string');
    const sdoc = new DOMParser().parseFromString(xml, 'application/xml');
    const paras = [...sdoc.getElementsByTagName('a:p')]
      .map(p => [...p.getElementsByTagName('a:t')].map(t => t.textContent).join(''))
      .filter(s => s.trim());
    const c = document.createElement('canvas'); c.width = 1280; c.height = 720;
    const cx = c.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, 1280, 720);
    cx.fillStyle = '#ae853e'; cx.fillRect(70, 130, 1140, 4);
    cx.fillStyle = '#222';
    let y = 100;
    paras.forEach((p, i) => {
      cx.font = i === 0 ? '800 46px Montserrat, sans-serif' : '400 28px Georgia, serif';
      // wrap each paragraph
      let cur = '';
      const flush = () => { if (y < 690) cx.fillText(cur, 70, y); y += i === 0 ? 56 : 42; cur = ''; };
      p.split(/\s+/).forEach(word => {
        if (cx.measureText(cur + (cur ? ' ' : '') + word).width > 1140 && cur) flush();
        cur += (cur ? ' ' : '') + word;
      });
      if (cur) flush();
      if (i === 0) y += 40;
    });
    pages.push(pageFromImage(c.toDataURL('image/jpeg', .85), 1280, 720));
  }
  return pages;
}

/* convert a document and open it in the canvas editor for annotation */
async function openDocOnCanvas(data, name, type, opts) {
  const kind = docKind(name, type);
  toast('Preparing “' + (name || 'document') + '”…');
  try {
    const buf = dataToBuf(data);
    let pages = null;
    if (kind === 'pdf') pages = await pdfToPages(buf);
    else if (kind === 'docx') pages = await docxToPages(buf);
    else if (kind === 'pptx') pages = await pptxToPages(buf);
    if (!pages || !pages.length) { toast("Couldn't read anything from that document.", true); if (opts.onExit) opts.onExit(); return; }
    openCanvasEditor({ name: (name || 'document').replace(/\.[a-z0-9]+$/i, ''), canvas: { pages } }, opts);
  } catch (e) {
    toast("Couldn't open that document — " + (e && e.message ? e.message : 'unknown error'), true);
    if (opts.onExit) opts.onExit();
  }
}
/* ---------- boot ---------- */
(async () => {
  await bootDB();
  /* restore the screen you were on across a reload (state survives in history) */
  if (history.state && history.state.view && me()) view = Object.assign({}, view, history.state.view);
  render();
  history.replaceState({ view }, '');
})();
</script>
